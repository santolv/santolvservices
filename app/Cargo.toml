[package]
name = "notionobsidian"
version = "0.1.0"
edition = "2021"

[dependencies]
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
urlencoding = "2"
base64 = "0.22"
sha2 = "0.10"
subtle = "2"
argon2 = "0.5"
getrandom = "0.4"
rpassword = "7"
tempfile = "3"
url = "2"
quick-xml = "0.42"
zip = { version = "9.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
