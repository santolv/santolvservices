<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión · Santolv</title>
<style>
:root{font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color-scheme:light;--canvas:#f3f3f6;--surface:#fff;--field:#f4f4f7;--line:#e5e5ec;--text:#22232a;--accent:#155cb8;--error:#a62733;color:var(--text);background:var(--canvas)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px}
main{width:min(100%,428px);padding:32px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
h1{font-size:28px;line-height:1.2;font-weight:600;margin:0 0 24px}form,label{display:grid;gap:8px}
form{gap:16px}label{font-size:14px;font-weight:600;min-width:0}
input,button{width:100%;min-width:0;min-height:44px;font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px}
input{background:var(--field);color:var(--text)}
button{cursor:pointer;background:#1962c3;color:#fff;border-color:transparent;font-weight:600}button:hover:not(:disabled){background:#1555ac}
button:disabled{opacity:.65;cursor:wait}button.secondary{background:var(--field);color:var(--accent);border-color:var(--line)}button.secondary:hover{background:var(--surface)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#status{font-size:14px;line-height:1.5;color:var(--error);margin:16px 0 0}#status:empty{display:none}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--canvas:#18181b;--surface:#232329;--field:#2e2e35;--line:#3b3b44;--text:#f2f2f6;--accent:#9bc8ff;--error:#ffabb3}}
@media(max-width:480px){body{padding:20px}main{padding:24px}}
@media(pointer:coarse){input{font-size:17.12px}}
</style>
</head>
<body>
<main>
  <h1 id="title">Iniciar sesión en Santolv</h1>
  <form id="login" method="post">
    <label>Usuario<input id="username" autocomplete="username" maxlength="64" required></label>
    <label>Contraseña<input id="password" type="password" autocomplete="current-password" maxlength="1024" required></label>
    <button type="submit">Entrar</button>
  </form>
  <form id="change-password" method="post" hidden>
    <label>Contraseña temporal<input id="current-password" type="password" autocomplete="current-password" maxlength="1024" required></label>
    <label>Nueva contraseña<input id="new-password" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required></label>
    <button type="submit">Guardar contraseña</button>
    <button type="button" id="cancel" class="secondary">Cerrar sesión</button>
  </form>
  <p id="status" role="status"></p>
</main>
<script>
'use strict';
const API_ORIGIN=location.protocol==='https:'?location.origin:'http://localhost:8443';
const get=id=>document.getElementById(id);
let csrf='',submitted=false;
async function api(path,body){
  const headers={};
  if(body!==undefined)headers['Content-Type']='application/json';
  if(csrf)headers['X-CSRF-Token']=csrf;
  const response=await fetch(API_ORIGIN+'/api/v1'+path,{method:body===undefined?'GET':'POST',credentials:'include',headers,body:body===undefined?undefined:JSON.stringify(body)});
  if(!response.ok){
    const messages={401:'Comprueba el usuario o la contraseña.',429:'Espera un momento antes de volver a intentarlo.'};
    throw new Error(messages[response.status]||'No se pudo completar la operación.');
  }
  return response.status===204?null:response.json();
}
function passwordChange(session){
  csrf=session.csrf_token;
  get('title').textContent='Cambia tu contraseña temporal';
  get('login').hidden=true;
  get('change-password').hidden=false;
  get('current-password').focus();
}
async function run(button,action){
  button.disabled=true;
  get('status').textContent='';
  try{await action()}catch(error){get('status').textContent=error.message}finally{button.disabled=false}
}
get('login').addEventListener('submit',event=>{
  event.preventDefault();
  submitted=true;
  run(event.submitter,async()=>{
    const session=await api('/auth/login',{username:get('username').value.trim(),password:get('password').value});
    get('password').value='';
    if(session.must_change_password)passwordChange(session);
    else location.replace('/');
  });
});
get('change-password').addEventListener('submit',event=>{
  event.preventDefault();
  run(event.submitter,async()=>{
    await api('/auth/password',{current_password:get('current-password').value,new_password:get('new-password').value});
    location.replace('/');
  });
});
get('cancel').addEventListener('click',event=>run(event.currentTarget,async()=>{
  await api('/auth/logout',null);
  location.replace('/');
}));
api('/me').then(session=>{if(!submitted&&session.must_change_password)passwordChange(session)}).catch(()=>{});
</script>
</body>
</html>
