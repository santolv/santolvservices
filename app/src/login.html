<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="same-origin">
  <title>Iniciar sesión · ArtCraft</title>
  <link rel="stylesheet" href="/ui/hub.css">
  <script type="module" src="/ui/accounts.js"></script>
</head>
<body class="hub account-page">
  <main class="hub-dialog account-card">
    <h1>Iniciar sesión</h1>
    <form id="account-login" method="post" action="/api/session/login">
      <label>Cuenta<input name="user" autocomplete="username" required maxlength="40" autofocus></label>
      <label>Contraseña<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label>
      <p id="account-error" role="alert"></p>
      <button class="hub-button primary" type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
