<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendario · Santolv</title>
<style>
:root{color-scheme:light;--cal-text:#211f26;--cal-muted:#625b69;--cal-bg:#f8f7fa;--cal-panel:#fff;--cal-line:#ded9e3;--cal-accent:#8f3048;--cal-tint:#f8e6eb}
:root[data-theme="dark"]{color-scheme:dark;--cal-text:#f4edf5;--cal-muted:#c0b5c3;--cal-bg:#19171d;--cal-panel:#242128;--cal-line:#45404a;--cal-accent:#ff9bb4;--cal-tint:#4c2835}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,sans-serif;background:var(--cal-bg);color:var(--cal-text)}[hidden]{display:none!important}
.calendar-page{max-width:1320px;margin:auto;padding:clamp(16px,4vw,48px)}
.calendar-page h1{font-size:clamp(29px,5vw,46px);margin:0;letter-spacing:-.045em}.calendar-page h2{margin:0;font-size:1.3rem}
.cal-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px}.cal-row.spread{justify-content:space-between}.cal-heading{margin-bottom:22px}.cal-controls{margin-bottom:12px}
.calendar-page button,.calendar-page select{min-height:38px;padding:6px 12px;border:1px solid var(--cal-line);border-radius:8px;background:var(--cal-panel);color:inherit;font:inherit}
.calendar-page button{cursor:pointer}.calendar-page button.primary,.calendar-page button[aria-pressed="true"]{background:var(--cal-tint);color:var(--cal-accent);border-color:var(--cal-accent)}
.calendar-page [role=status]:empty{display:none}.calendar-page [role=status]{color:var(--cal-muted)}
.cal-scroll{overflow:auto;border:1px solid var(--cal-line);border-radius:12px;background:var(--cal-panel)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(100px,1fr));min-width:700px}.cal-weekday{padding:9px 10px;border-bottom:1px solid var(--cal-line);color:var(--cal-muted)}
.cal-day{min-height:96px;padding:6px;border-bottom:1px solid var(--cal-line);border-inline-end:1px solid var(--cal-line);overflow-wrap:anywhere}
.cal-grid.week .cal-day{min-height:220px}.cal-day.outside{color:var(--cal-muted);background:var(--cal-bg)}
.cal-day button.day-number{min-height:30px;padding:1px 6px;border:0;background:transparent}
.cal-day [aria-current="date"]{border-radius:6px;background:var(--cal-tint)!important;color:var(--cal-accent);font-weight:700}
.cal-event{display:block;margin:4px 0;padding:4px 6px;border-radius:6px;color:var(--cal-text);background:var(--cal-tint);text-decoration:none}
.cal-event:hover{text-decoration:underline}.cal-agenda{padding:12px 16px}.cal-agenda li{list-style:none}.cal-agenda li+li{margin-top:8px}
.calendar-form fieldset{display:grid;gap:12px;min-width:0;border:0;margin:0;padding:0}.calendar-form fieldset:disabled{opacity:.9}
.cal-members{list-style:none;margin:0;padding:0}.cal-members li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0}
.calendar-form .cal-member-form{display:grid;grid-template-columns:2fr 1fr;gap:6px}.cal-member-form button{grid-column:1/-1;justify-self:start}
@media(max-width:600px){
  .cal-grid.month{min-width:0;grid-template-columns:repeat(7,minmax(0,1fr))}
  .cal-grid.week{min-width:620px;grid-template-columns:repeat(7,minmax(88px,1fr))}
  .cal-grid.month .cal-weekday{padding:6px 2px;text-align:center}
  .cal-grid.month .cal-day{min-height:64px;padding:2px}
  .cal-grid.month .cal-event{padding:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.8rem}
  .cal-controls{align-items:flex-start}
}

/* Adaptación del diseño Calendario.html sobre los componentes y datos de Santolv. */
:root{--cal-text:#1d1d1f;--cal-muted:#6e6e73;--cal-bg:#fff;--cal-panel:#f5f5f7;--cal-line:#dedee2;--cal-accent:#d92d25;--cal-tint:#fceae9}
:root[data-theme="dark"]{--cal-text:#f5f5f7;--cal-muted:#aeaeb5;--cal-bg:#1e1e20;--cal-panel:#262628;--cal-line:#3b3b3e;--cal-accent:#ff6961;--cal-tint:#442a29}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.calendar-page{max-width:none;margin:0;padding:0;display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100dvh - var(--shell-height,48px));grid-template-rows:auto 1fr}
.cal-sidebar{grid-column:1;grid-row:1/3;background:var(--cal-panel);border-right:1px solid var(--cal-line);padding:28px 16px;display:flex;flex-direction:column;gap:16px;min-width:0}
.cal-sidebar h1{font-size:22px;letter-spacing:-.025em}.cal-sidebar label{display:grid;gap:8px;color:var(--cal-muted);font-size:13px;font-weight:600}.cal-sidebar select{width:100%;min-width:0;font-weight:400;color:var(--cal-text)}
.cal-workspace{grid-column:2;min-width:0;display:flex;flex-direction:column}
.cal-controls{padding:14px 20px;margin:0;gap:14px;min-height:68px;border-bottom:1px solid var(--cal-line)}
.calendar-page h2{font-size:23px;font-weight:650;letter-spacing:-.025em;margin-left:8px}
.calendar-page button,.calendar-page select{min-height:34px;border:0;background:color-mix(in srgb,var(--cal-text) 7%,transparent);border-radius:8px;font-size:14px;padding:6px 12px}
.calendar-page button.primary{background:var(--cal-accent);color:#fff;border:0;font-weight:600}
.calendar-page button:hover{filter:brightness(.94)}
.cal-segment{display:flex;gap:2px;padding:3px;background:color-mix(in srgb,var(--cal-text) 8%,transparent);border-radius:9px}
.cal-segment button{background:transparent;min-height:28px;padding:3px 13px}
.cal-segment button[aria-pressed="true"]{background:var(--cal-bg);color:var(--cal-text);box-shadow:0 1px 3px #0002;border:0}
#page-status{padding:0 20px;margin:8px 0;color:var(--cal-muted)}#page-status:empty{display:none}
.cal-scroll{flex:1;border:0;border-radius:0;background:var(--cal-bg)}
.cal-grid{min-height:calc(100dvh - var(--shell-height,48px) - 70px);grid-template-rows:36px;grid-auto-rows:minmax(100px,1fr)}
.cal-weekday{text-align:right;padding:9px 14px;font-size:12px;font-weight:500}
.cal-day{padding:5px;border-bottom:1px solid var(--cal-line);min-width:0}.cal-day:nth-child(7n){border-right:0}
.cal-day.outside{background:color-mix(in srgb,var(--cal-panel) 55%,var(--cal-bg))}
.cal-day button.day-number{display:block;margin:0 0 4px auto;width:30px;height:30px;border-radius:50%;font-size:14px}
.cal-day [aria-current="date"]{background:var(--cal-accent)!important;color:#fff;border-radius:50%}
.cal-event{font-size:12px;line-height:1.4;padding:4px 8px;margin:3px 0;border-radius:5px;border-left:3px solid var(--event-color,var(--cal-accent));background:color-mix(in srgb,var(--event-color,var(--cal-accent)) 14%,var(--cal-bg));color:var(--cal-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-agenda{max-width:850px;margin:0 auto;padding:24px}.cal-agenda .cal-event{padding:12px;white-space:normal}
@media(max-width:850px){.calendar-page{display:block}.cal-sidebar{border-right:0;border-bottom:1px solid var(--cal-line);padding:14px 16px;flex-direction:row;align-items:center;flex-wrap:wrap;gap:10px}.cal-sidebar h1{margin-right:auto}.cal-sidebar label{display:flex;align-items:center}.cal-sidebar select{width:auto;max-width:210px}.cal-controls{padding:12px}.calendar-page h2{font-size:20px}.cal-grid{min-height:65dvh}}
@media(max-width:600px){.cal-sidebar label{width:100%}.cal-sidebar select{max-width:none;flex:1}.cal-grid.month .cal-day{min-height:82px}.cal-grid.month .cal-event{font-size:11px}.cal-controls> .cal-row{flex-wrap:wrap}.calendar-page h2{flex-basis:100%;margin:4px 0}.cal-segment{max-width:100%}}
@media(prefers-reduced-motion:reduce){.calendar-page *{scroll-behavior:auto;transition:none}}


/* Reference: hourly week and compact, opaque Apple-style editor. */
.calendar-page{--blue:var(--cal-text);--fill:var(--cal-panel)}
.calendar-page.sidebar-hidden{grid-template-columns:0 minmax(0,1fr)}.calendar-page.sidebar-hidden .cal-sidebar{display:none}
.cal-controls{padding:12px 16px;min-height:56px}.cal-controls .cal-row{gap:3px}.calendar-page h2{font-size:21px;letter-spacing:-.02em;margin-left:12px}
.calendar-page #previous,.calendar-page #next,.calendar-page #today{height:28px;min-height:28px;padding:0 9px;background:color-mix(in srgb,var(--cal-text) 9%,var(--cal-bg));border-radius:7px;font-weight:500}
.cal-week-view{height:calc(100dvh - var(--shell-height,48px) - 57px);min-height:400px;display:flex;flex-direction:column;overflow-x:auto;overflow-y:hidden}
.cal-time-head,.cal-all-day,.cal-time-grid{display:grid;grid-template-columns:52px repeat(7,minmax(88px,1fr));min-width:668px}
.cal-time-head>div{padding:8px 0;display:flex;align-items:center;flex-direction:column;gap:2px;color:var(--cal-muted);font-size:12px;border-bottom:1px solid var(--cal-line)}
.cal-time-head button.day-number{font-size:19px;font-weight:400;border:0;background:transparent;border-radius:50%;width:32px;height:32px;padding:0;min-height:32px;color:var(--cal-text)}
.cal-time-head [aria-current=date]{background:var(--cal-accent)!important;color:#fff!important}
.cal-all-day{border-bottom:1px solid var(--cal-line);max-height:140px;overflow-y:auto;flex-shrink:0}.cal-all-day>span{font-size:11px;text-align:right;color:var(--cal-muted);padding:6px 8px}.cal-all-day>div{min-height:36px;padding:0 3px;border-left:1px solid var(--cal-line)}
.cal-time-scroll{flex:1;min-height:0;overflow-y:auto;min-width:668px}.cal-time-grid{height:1152px}
.cal-time-gutter{position:relative}.cal-time-gutter span{position:absolute;right:8px;font-size:11px;line-height:1.3;color:var(--cal-muted);font-variant-numeric:tabular-nums}
.cal-time-column{height:1152px;position:relative;min-width:0;border-left:1px solid var(--cal-line)}
.calendar-page button.cal-hour-slot{display:block;width:100%;height:48px;min-height:48px;padding:0;border:0;border-bottom:1px solid var(--cal-line);border-radius:0;background:transparent}
.calendar-page button.cal-hour-slot:hover{background:color-mix(in srgb,var(--cal-text) 4%,transparent)}
.cal-timed-event{position:absolute;box-sizing:border-box;margin:0;padding:4px 6px;border-left-width:3px;z-index:1;white-space:normal;line-height:1.3;background:color-mix(in srgb,var(--event-color) 25%,var(--cal-bg));box-shadow:0 0 0 1px var(--cal-bg)}
.cal-timed-event strong,.cal-timed-event small{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis}.cal-timed-event small{font-size:11px;color:var(--cal-muted)}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
#event-dialog{width:min(420px,calc(100% - 24px));padding:20px;border:1px solid var(--cal-line);border-radius:16px;background:var(--cal-panel);color:var(--cal-text)}
#event-dialog::backdrop{background:#0005;backdrop-filter:blur(6px)}
#event-form{display:grid;gap:14px;font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
#event-form #event-fields{gap:12px}#event-form>p:empty{display:none}
#event-form input[name=title]{order:-1;border:0;background:transparent;border-radius:0;font-family:inherit;font-weight:600;font-size:20px;line-height:1.3;padding:0;min-height:28px;width:100%;color:inherit;box-shadow:none}
#event-form input[name=title]::placeholder{color:var(--cal-muted);font-size:15px;font-weight:400}
#event-form input[name=title]:focus-visible{outline:0;box-shadow:0 1px var(--cal-accent)}
.cal-advanced-calendar{display:none!important}.cal-chips{display:flex;gap:6px;flex-wrap:wrap}
.cal-chips button{display:flex;align-items:center;gap:7px;min-height:28px;padding:4px 10px;border:0;border-radius:16px;background:color-mix(in srgb,var(--cal-text) 9%,var(--cal-panel));color:inherit;font-family:inherit;font-weight:500;font-size:13px;line-height:1.3}
.cal-chips button::before{content:'';width:10px;height:10px;border-radius:50%;background:var(--chip-color);flex:none}.cal-chips [aria-pressed=true]{outline:1.5px solid var(--chip-color);outline-offset:0}
.cal-chips button:disabled{opacity:1}
.cal-date-group{background:color-mix(in srgb,var(--cal-text) 9%,var(--cal-panel));border-radius:10px;overflow:hidden}
#event-form .cal-date-group label{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px;padding:6px 12px;font-weight:500;margin:0}
.cal-date-group label+label{border-top:1px solid var(--cal-line)}
#event-form .cal-date-group input:not([type=checkbox]){border:0;background:transparent;text-align:right;min-height:28px;width:150px;font:inherit;padding:0;color:inherit}
#event-form input[role=switch]{appearance:none;-webkit-appearance:none;position:relative;width:42px;height:26px;min-height:26px;border:0;border-radius:13px;background:#78788066;padding:0;margin:0;cursor:pointer;flex:none;transition:background .15s}
#event-form input[role=switch]::after{content:'';position:absolute;left:2px;top:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0004;transition:transform .15s}
#event-form input[role=switch]:checked{background:#30d158}#event-form input[role=switch]:checked::after{transform:translateX(16px)}
.cal-advanced{display:grid;gap:10px;font-size:12px}.cal-advanced>summary{cursor:pointer;color:var(--cal-muted);padding:4px 0}.cal-advanced label{margin-top:8px}
#event-form .calendar-actions{justify-content:flex-end;gap:8px}#event-form .calendar-actions button{border:0;border-radius:7px;min-height:32px;padding:6px 13px;background:color-mix(in srgb,var(--cal-text) 9%,var(--cal-panel));color:inherit;font-family:inherit;font-weight:600;font-size:13px;line-height:1.3}
#event-form #save-event{background:#ff453a;color:#fff}#event-form #delete-event{color:#ff6961;margin-right:auto}
#event-reminder{font-size:12px}#event-reminder select{max-width:100%}#source-links{display:flex;flex-wrap:wrap;gap:12px}#source-links a{color:var(--cal-accent)}
@media(max-width:620px){.calendar-page .cal-sidebar{display:none}.calendar-page.mobile-sidebar .cal-sidebar{display:flex}.calendar-page .cal-workspace{width:100%}.cal-week-view{height:calc(100dvh - var(--shell-height,48px) - 110px)}.calendar-page.mobile-sidebar .cal-week-view{height:65dvh}.cal-controls{align-items:center}.calendar-page h2{flex-basis:auto;margin-left:8px;font-size:18px}}
@media(prefers-reduced-motion:reduce){#event-form input[role=switch],#event-form input[role=switch]::after{transition:none}}

.calendar-body{overflow:hidden}.calendar-page{height:calc(100dvh - var(--shell-height,48px));min-height:0;grid-template-rows:minmax(0,1fr)}.cal-sidebar{grid-row:1}.cal-workspace{height:100%;min-height:0}.cal-scroll{min-height:0}.cal-week-view{height:100%;min-height:0}#event-form .cal-date-group label{font:500 13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}#event-form .calendar-actions{justify-content:flex-start}#event-reminder{display:none}#event-form .cal-advanced #event-reminder{display:flex}
@media(max-width:850px){.calendar-page{display:flex;flex-direction:column}.cal-sidebar{flex-shrink:0}.cal-workspace{flex:1;height:auto;min-height:0}.cal-week-view,.calendar-page.mobile-sidebar .cal-week-view{height:100%;min-height:0}}

#reminder-options #event-reminder{display:flex}

.calendar-page #new-event{background:#ff453a;color:#fff;min-height:28px;height:28px;padding:0 12px;font-size:13px;border-radius:7px}
</style>
</head>
<body class="calendar-body">
<!-- SANTOLV_SHELL -->
<main class="calendar-page app">
  <aside class="cal-sidebar" id="sidebar" aria-label="Calendarios">
    <div class="cal-row spread"><h1>Calendario</h1><!-- SANTOLV_SIDEBAR_HIDE --></div>
    <label>Calendarios <select id="calendar-filter" aria-label="Filtrar por calendario"><option value="">Todos los calendarios</option></select></label>
    <button type="button" id="manage">Gestionar calendarios</button>
  </aside>
  <section class="cal-workspace" aria-label="Eventos">
  <div class="cal-row spread cal-controls">
    <div class="cal-row"><!-- SANTOLV_SIDEBAR_SHOW --><button type="button" id="previous" aria-label="Período anterior">‹</button><button type="button" id="today">Hoy</button><button type="button" id="next" aria-label="Período siguiente">›</button><h2 id="period" aria-live="polite"></h2></div>
    <div class="cal-segment" role="group" aria-label="Vista"><button type="button" data-view="month" aria-pressed="false">Mes</button><button type="button" data-view="week" aria-pressed="true">Semana</button><button type="button" data-view="agenda" aria-pressed="false">Agenda</button></div><button type="button" class="primary" id="new-event">+ Nuevo evento</button>
  </div>
  <p id="page-status" role="status"></p>
  <div id="display" class="cal-scroll" aria-labelledby="period"></div>
  </section>
</main>
<dialog id="event-dialog" class="calendar-dialog" aria-labelledby="event-heading">
  <form id="event-form" class="calendar-form">
    <h2 id="event-heading" class="sr-only"></h2>
    <p id="event-detail"></p>
    <fieldset id="event-fields">
      <div id="calendar-chips" class="cal-chips" aria-label="Calendario"></div><label class="cal-advanced-calendar">Calendario <select name="calendar_id"></select></label>
      <input name="title" maxlength="200" placeholder="Título del evento" aria-label="Título del evento" required>
      <div class="cal-date-group"><label>Fecha <input id="calendar-date" type="date"></label>
      <label class="cal-switch-row">Todo el día <input name="all_day" type="checkbox" role="switch"></label><label class="cal-clock-row">Inicio <input id="start-clock" type="time"></label><label class="cal-clock-row">Fin <input id="end-clock" type="time"></label></div><details class="cal-advanced"><summary>Más opciones</summary><label>Descripción <textarea name="description" maxlength="4000" rows="3"></textarea></label>
      <label>Inicio <input name="local_start" type="datetime-local" step="1" required></label>
      <label><span id="end-label">Fin</span> <input name="local_end" type="datetime-local" step="1" required></label>
      <label>Zona horaria <input name="zone" maxlength="100" required></label>
      <label>Disponibilidad <select name="busy"><option value="true">Ocupado</option><option value="false">Libre</option></select></label>
      <fieldset id="repeat-fields">
        <label>Repetir <select name="repeat_kind"><option value="">Nunca</option><option value="daily">Cada día</option><option value="weekly">Cada semana</option><option value="monthly">Cada mes</option><option value="yearly">Cada año</option></select></label>
        <label id="repeat-choice" hidden>Finaliza <select name="repeat_end"><option value="">Sin fecha de fin</option><option value="until">En una fecha</option><option value="count">Tras varias ocasiones</option></select></label>
        <label id="repeat-until" hidden>Último día <input name="repeat_until" type="date"></label>
        <label id="repeat-count" hidden>Número de ocasiones <input name="repeat_count" type="number" min="1" max="10000"></label>
      </fieldset>

    </details></fieldset>
    <details id="reminder-options" class="cal-advanced"><summary>Recordatorio personal</summary>    <div class="cal-row" id="event-reminder">
      <label>Recordatorio personal <select name="reminder_minutes">
        <option value="">Sin recordatorio</option><option value="0">A la hora del evento</option><option value="5">5 minutos antes</option><option value="15">15 minutos antes</option><option value="30">30 minutos antes</option><option value="60">1 hora antes</option><option value="1440">1 día antes</option><option value="10080">1 semana antes</option>
      </select></label>
      <button type="button" id="save-reminder">Guardar recordatorio</button>
    </div></details>
    <details id="event-links" class="cal-advanced" hidden><summary>Notas y tareas vinculadas</summary><p>Estos vínculos son privados de tu cuenta.</p><label>Nota <select id="linked-note"><option value="">Ninguna</option></select></label><button type="button" id="more-linked-notes" hidden>Cargar más notas</button><label>Tarea <select id="linked-task"><option value="">Ninguna</option></select></label><button type="button" id="more-linked-tasks" hidden>Cargar más tareas</button><div id="source-links"></div><button type="button" id="save-links">Guardar vínculos</button></details>
    <p id="event-status" role="status"></p>
    <div class="calendar-actions">
      <button type="button" id="edit-single">Editar esta ocurrencia</button><button type="button" id="edit-series">Editar</button>
      <button type="button" id="delete-event">Eliminar</button>
      <button type="button" id="close-event">Cerrar</button><button type="submit" id="save-event">Guardar</button>
    </div>
  </form>
</dialog>
<dialog id="manage-dialog" class="calendar-dialog" aria-labelledby="manage-heading">
  <div class="calendar-form">
    <h2 id="manage-heading">Gestionar calendarios</h2>
    <label>Mis calendarios <select id="manage-select"></select></label>
    <form id="calendar-name-form" class="calendar-form">
      <label>Nombre <input name="name" maxlength="100" required></label>
      <div class="calendar-actions"><button type="submit" id="save-calendar">Crear calendario</button><button type="button" id="delete-calendar" hidden>Eliminar calendario</button></div>
    </form>
    <section id="sharing" hidden aria-labelledby="sharing-heading">
      <h3 id="sharing-heading">Acceso compartido</h3>
      <ul id="members" class="cal-members"></ul>
      <form id="share-form" class="cal-member-form">
        <label>Usuario <input name="username" maxlength="64" required></label>
        <label>Permiso <select name="role"><option value="reader">Lectura</option><option value="editor">Edición</option></select></label>
        <button type="submit">Dar acceso</button>
      </form>
    </section>
    <p id="manage-status" role="status"></p>
    <div class="calendar-actions"><button type="button" id="close-manage">Cerrar</button></div>
  </div>
</dialog>
<script>
(() => {
  'use strict';
  const calendar = window.SantolvCalendar;
  const {api, request, zone, localTime, describe, eventLabel, occurrenceUrl} = calendar;
  const $ = id => document.getElementById(id);
  const eventDialog = $('event-dialog');
  const eventForm = $('event-form');
  const eventFields = eventForm.elements;

        revoke.setAttribute('aria-label', 'Quitar acceso a ' + member.username);
        revoke.addEventListener('click', () => void manageAction(revoke, async () => {
          await api('/calendars/' + id + '/members/' + member.user_id, 'DELETE');
          await manageSelection();
        }));
        row.append(text, revoke);
        $('members').append(row);
      }
    } catch (error) { if (version === membersNumber) $('manage-status').textContent = describe(error); }
  }
  async function manageAction(button, action) {
    button.disabled = true;
    $('manage-status').textContent = '';
    try { await action(); }
    catch (error) { $('manage-status').textContent = describe(error); }
    finally { button.disabled = false; }
  }
  async function manageOptions(selected = '') {
    await loadCalendars();
    $('manage-select').replaceChildren(new Option('Nuevo calendario', ''),
      ...calendars.filter(calendar => calendar.role === 'owner').map(calendar => new Option(calendar.name, calendar.id)));
    $('manage-select').value = selected;
    await manageSelection();
  }
  $('manage').addEventListener('click', () => void manageAction($('manage'), async () => {
    manageDialog.showModal();
    await manageOptions();
  }));
  $('close-manage').addEventListener('click', () => manageDialog.close());
  $('manage-select').addEventListener('change', () => void manageSelection());
  nameForm.addEventListener('submit', event => {
    event.preventDefault();
    void manageAction($('save-calendar'), async () => {
      const id = $('manage-select').value;
      const result = await api('/calendars' + (id ? '/' + id : ''), id ? 'PUT' : 'POST', {name: nameForm.elements.name.value});
      await manageOptions(id || result.id);
      await Promise.all([load(), calendar.refresh()]);
    });
  });
  $('delete-calendar').addEventListener('click', () => {
    const id = $('manage-select').value;
    if (!id || !window.confirm('¿Eliminar este calendario y todos sus eventos?')) return;
    void manageAction($('delete-calendar'), async () => {
      await api('/calendars/' + id, 'DELETE');
      await manageOptions();
      await Promise.all([load(), calendar.refresh()]);
    });
  });
  $('share-form').addEventListener('submit', event => {
    event.preventDefault();
    const form = event.currentTarget;
    void manageAction(form.querySelector('button'), async () => {
      await api('/calendars/' + $('manage-select').value + '/members', 'PUT', {
        username: form.elements.username.value, role: form.elements.role.value
      });
      await manageSelection();
    });
  });

  function shift(direction) {
    anchor = view === 'month' ? new Date(anchor.getFullYear(), anchor.getMonth() + direction, 1) : day(anchor, direction * (view === 'week' ? 7 : 14));
    void load();
  }
  $('today').addEventListener('click', () => { anchor = new Date(); void load(); });
  $('previous').addEventListener('click', () => shift(-1));
  $('next').addEventListener('click', () => shift(1));
  $('calendar-filter').addEventListener('change', () => void load());
  $('new-event').addEventListener('click', () => openCreate(day(anchor)));
  for (const button of document.querySelectorAll('[data-view]')) button.addEventListener('click', () => {
    view = button.dataset.view;
    for (const item of document.querySelectorAll('[data-view]')) item.setAttribute('aria-pressed', String(item === button));
    void load();
  });
  document.addEventListener('calendar-updated', () => void loadCalendars().then(load).catch(error => {
    $('page-status').textContent = describe(error);
  }));
  async function endSession() {
    await request('/auth/logout', 'POST');
    window.SantolvShell.sessionEnded();
    document.body.hidden = true;
    location.replace('/');
  }
  async function begin() {
    const profile = await request('/me');
    if (profile.must_change_password) { location.replace('/account/'); return; }
    window.SantolvShell.session(profile.expires_at);
    window.SantolvShell.account(profile, {switch: endSession, logout: endSession});
    await loadCalendars();
    const params = new URLSearchParams(location.search);
    let linkStatus = '';
    if (params.has('event') && params.has('original')) {
      await openDetail(params.get('event'), params.get('original'));
      if (detail) anchor = dateFromKey(detail.occurrence.local_start.slice(0, 10));
      else linkStatus = $('page-status').textContent;
    }
    await load();
    if (linkStatus) $('page-status').textContent = linkStatus;
  }
  void begin().catch(error => { $('page-status').textContent = describe(error); });
})();
</script>
</body>
</html>
