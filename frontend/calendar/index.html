.cal-item input[type=checkbox]{appearance:none;-webkit-appearance:none;width:16px;height:16px;min-height:16px;margin:0;padding:0;border:1.5px solid var(--cal-color);border-radius:4px;background:transparent;display:grid;place-items:center;cursor:pointer}
.cal-item input[type=checkbox]:checked{background:var(--cal-color)}
.cal-item input[type=checkbox]:checked::after{content:'';width:4px;height:8px;margin-top:-2px;border-right:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(45deg)}
.cal-item input[type=checkbox]:focus-visible{outline:2px solid var(--ui-blue);outline-offset:2px}
.cal-item-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-item small{grid-column:2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--cal-muted);font-size:11px}
.calendar-page .cal-item-more{display:grid;place-items:center;flex:none;width:26px;height:26px;min-height:26px;padding:0;border:0;border-radius:6px;background:transparent;color:var(--cal-muted);opacity:0}
.cal-item:is(:hover,:focus-within) .cal-item-more{opacity:1}
.calendar-page .cal-item-more:hover{background:var(--ui-control);filter:none}
@media(hover:none){.calendar-page .cal-item-more{opacity:1}}
/* Editor de calendario: muestras de color */
.cal-colors{display:grid;gap:8px}
.cal-colors legend{font-size:14px;margin-bottom:6px}
.cal-swatches{display:flex;flex-wrap:wrap;gap:10px}
.cal-swatch{position:relative;display:block;width:26px;height:26px;border-radius:50%;background:var(--swatch);cursor:pointer}
.cal-swatch input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.cal-swatch:has(input:checked){box-shadow:0 0 0 2px var(--ui-raised),0 0 0 4px var(--swatch)}
.cal-swatch:has(input:focus-visible){outline:2px solid var(--ui-blue);outline-offset:4px}
/* Barra de controles a la altura de la cabecera del lateral: botón del lateral, flechas, «Hoy» y mes comparten eje. */
.calendar-page .cal-controls{box-sizing:border-box;min-height:48px;padding:9px 16px 9px 12px}
</style>
</head>
<body class="calendar-body">

  </aside>
  <section class="cal-workspace" aria-label="Eventos">
  <div class="cal-row spread cal-controls">
    <div class="cal-row"><!-- SANTOLV_SIDEBAR_SHOW --><button type="button" id="previous" aria-label="Período anterior"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m10 3-5 5 5 5"/></svg></button><button type="button" id="today">Hoy</button><button type="button" id="next" aria-label="Período siguiente"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5"/></svg></button><h2 id="period" aria-live="polite"></h2></div>
    <div class="cal-segment" role="group" aria-label="Vista"><button type="button" data-view="month" aria-pressed="false">Mes</button><button type="button" data-view="week" aria-pressed="true">Semana</button><button type="button" data-view="agenda" aria-pressed="false">Agenda</button></div><button type="button" class="primary" id="new-event">+ Nuevo evento</button>

<dialog id="event-dialog" class="calendar-dialog" aria-labelledby="event-heading">

      <label>Inicio <input name="local_start" type="datetime-local" step="1" required></label>
      <label><span id="end-label">Fin</span> <input name="local_end" type="datetime-local" step="1" required></label>
      <label>Zona horaria <input name="zone" maxlength="100" required></label>
      <label>Disponibilidad <select name="busy"><option value="true">Ocupado</option><option value="false">Libre</option></select></label>
      <fieldset id="repeat-fields">
        <label>Repetir <select name="repeat_kind"><option value="">Nunca</option><option value="daily">Cada día</option><option value="weekly">Cada semana</option><option value="monthly">Cada mes</option><option value="yearly">Cada año</option></select></label>
        <label id="repeat-choice" hidden>Finaliza <select name="repeat_end"><option value="">Sin fecha de fin</option><option value="until">En una fecha</option><option value="count">Tras varias ocasiones</option></select></label>
        <label id="repeat-until" hidden>Último día <input name="repeat_until" type="date"></label>

      </fieldset>

    </details></fieldset>
    <details id="reminder-options" class="cal-advanced"><summary>Recordatorio personal</summary>    <div class="cal-row" id="event-reminder">
      <label>Recordatorio personal <select name="reminder_minutes">
        <option value="">Sin recordatorio</option><option value="0">A la hora del evento</option><option value="5">5 minutos antes</option><option value="15">15 minutos antes</option><option value="30">30 minutos antes</option><option value="60">1 hora antes</option><option value="1440">1 día antes</option><option value="10080">1 semana antes</option>
      </select></label>
      <button type="button" id="save-reminder">Guardar recordatorio</button>
    </div></details>
    <details id="event-links" class="cal-advanced" hidden><summary>Notas y tareas vinculadas</summary><p>Estos vínculos son privados de tu cuenta.</p><label>Nota <select id="linked-note"><option value="">Ninguna</option></select></label><button type="button" id="more-linked-notes" hidden>Cargar más notas</button><label>Tarea <select id="linked-task"><option value="">Ninguna</option></select></label><button type="button" id="more-linked-tasks" hidden>Cargar más tareas</button><div id="source-links"></div><button type="button" id="save-links">Guardar vínculos</button></details>
    <p id="event-status" role="status"></p>
    <div class="calendar-actions">
      <button type="button" id="edit-single">Editar esta ocurrencia</button><button type="button" id="edit-series">Editar</button>
      <button type="button" id="delete-event">Eliminar</button>
      <button type="button" id="close-event">Cerrar</button><button type="submit" id="save-event">Guardar</button>
    </div>
  </form>
</dialog>
<dialog id="manage-dialog" class="calendar-dialog" aria-labelledby="manage-heading">
  <div class="calendar-form">
    <h2 id="manage-heading">Nuevo calendario</h2>
    <input type="hidden" id="manage-select">
    <form id="calendar-name-form" class="calendar-form">
      <label>Nombre <input name="name" maxlength="100" required></label>
      <fieldset class="cal-colors"><legend>Color</legend><div id="color-choices" class="cal-swatches"></div></fieldset>

    <p id="manage-status" role="status"></p>
    <div class="calendar-actions"><button type="button" id="close-manage">Cerrar</button></div>
  </div>
</dialog>
<script>
(() => {
  'use strict';
  const calendar = window.SantolvCalendar;
  const {api, request, zone, localTime, describe, eventLabel, occurrenceUrl} = calendar;
  const $ = id => document.getElementById(id);
  const eventDialog = $('event-dialog');
  const eventForm = $('event-form');
  const eventFields = eventForm.elements;
  const manageDialog = $('manage-dialog');
  const nameForm = $('calendar-name-form');
  let view = 'week', anchor = new Date(), calendars = [], loadNumber = 0, detailsNumber = 0, membersNumber = 0;
  let detail, mode;

  function day(date, shift = 0) {
    return new Date(date.getFullYear(), date.getMonth(), date.getDate() + shift);
  }
  function monday(date) { return day(date, -((date.getDay() + 6) % 7)); }
  function key(date) { return localTime(date).slice(0, 10); }
  function dateFromKey(value) { return new Date(value + 'T12:00:00'); }
  function range() {
    if (view === 'month') {
      const start = monday(new Date(anchor.getFullYear(), anchor.getMonth(), 1));
      return [start, day(start, 42)];
    }
    const start = view === 'week' ? monday(anchor) : day(anchor);
    return [start, day(start, view === 'week' ? 7 : 14)];
  }
  function containsDay(event, date) {
    const value = key(date);
    if (event.all_day) return event.local_start.slice(0, 10) <= value && event.local_end.slice(0, 10) > value;
    return new Date(event.starts_at) < day(date, 1) && new Date(event.ends_at) > date;
  }
  function eventColor(id) { const own=calendars.find(c=>c.id===id)?.color;if(own)return own;const item=calendars.find(c=>c.id===id),known={'personal':'#0a84ff','trabajo':'#ff9f0a','familia':'#30d158','estudio':'#bf5af2'};if(item?.is_default)return '#0a84ff';if(known[item?.name.toLocaleLowerCase()])return known[item.name.toLocaleLowerCase()];const colors=['#0a84ff','#ff9f0a','#30d158','#bf5af2','#ff453a'];return colors[Array.from(id||'').reduce((n,c)=>n+c.charCodeAt(0),0)%colors.length]; }
  const eventRecords = new WeakMap();
  function link(event, agenda = false) {
    const a = document.createElement('a');
    a.className = 'cal-event';
    a.style.setProperty('--event-color', eventColor(event.calendar_id));
    a.href = occurrenceUrl(event);
    a.title = event.title;
    a.textContent = agenda ? eventLabel(event) + ' · ' + event.title + ' · ' + event.calendar_name : event.title;
    eventRecords.set(a, event);
    a.addEventListener('click', click => {
      if (click.button || click.metaKey || click.ctrlKey || click.shiftKey || click.altKey) return;
      click.preventDefault();
      history.replaceState(null, '', a.href);
      void openDetail(event.event_id, event.original_start);
    });
    return a;
  }
  function render(items, start, end) {
    if (view === 'week') { renderWeek(items,start); return; }
    if (view === 'agenda') {
      const list = document.createElement('ul');
      list.className = 'cal-agenda';
      for (const event of items) {
        const row = document.createElement('li');
        row.append(link(event, true));
        list.append(row);
      }
      if (!items.length) {
        const row = document.createElement('li');
        row.textContent = 'No hay eventos en este período.';
        list.append(row);
      }
      $('display').replaceChildren(list);
      return;
    }
    const grid = document.createElement('div');
    grid.className = 'cal-grid ' + view;
    for (const label of ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom']) {
      const cell = document.createElement('div');
      cell.textContent = label;
      cell.className = 'cal-weekday';
      grid.append(cell);
    }
    for (let date = start; date < end; date = day(date, 1)) {
      const cell = document.createElement('div');
      cell.className = 'cal-day' + (view === 'month' && anchor.getMonth() !== date.getMonth() ? ' outside' : '');
      const button = document.createElement('button');
      const dateKey = key(date);
      button.type = 'button';
      button.className = 'day-number';
      button.textContent = date.getDate();
      button.setAttribute('aria-label', 'Crear evento el ' + date.toLocaleDateString('es-ES', {dateStyle: 'full'}));
      if (dateKey === key(new Date())) button.setAttribute('aria-current', 'date');
      button.addEventListener('click', () => openCreate(dateFromKey(dateKey)));
      cell.append(button);
      for (const event of items) if (containsDay(event, date)) cell.append(link(event));
      grid.append(cell);
    }
    $('display').replaceChildren(grid);
  }

  function layoutIntervals(events) {
    const sorted=events.slice().sort((a,b)=>a.start-b.start||a.end-b.end),groups=[];
    for(const item of sorted){let group=groups.at(-1);if(!group||item.start>=group.end){group={end:item.end,items:[],lanes:[]};groups.push(group)}group.end=Math.max(group.end,item.end);let lane=group.lanes.findIndex(end=>end<=item.start);if(lane<0)lane=group.lanes.length;group.lanes[lane]=item.end;group.items.push({...item,lane});}
    return groups.flatMap(group=>group.items.map(item=>({...item,columns:group.lanes.length})));
  }
  function renderWeek(items,start) {
    const wrapper=document.createElement('div');wrapper.className='cal-week-view';
    const header=document.createElement('div');header.className='cal-time-head';header.append(document.createElement('div'));
    const allDay=document.createElement('div');allDay.className='cal-all-day';const caption=document.createElement('span');caption.textContent='Todo el día';allDay.append(caption);
    const scroll=document.createElement('div');scroll.className='cal-time-scroll';const grid=document.createElement('div');grid.className='cal-time-grid';const gutter=document.createElement('div');gutter.className='cal-time-gutter';
    for(let h=0;h<24;h++){const label=document.createElement('span');label.textContent=String(h).padStart(2,'0')+':00';label.style.top=(h*48)+'px';gutter.append(label)}grid.append(gutter);
    for(let i=0;i<7;i++){
      const date=day(start,i),head=document.createElement('div');const label=document.createElement('span');label.textContent=date.toLocaleDateString('es',{weekday:'short'});const number=document.createElement('button');number.type='button';number.textContent=date.getDate();number.className='day-number';if(key(date)===key(new Date()))number.setAttribute('aria-current','date');number.addEventListener('click',()=>openCreate(date));head.append(label,number);header.append(head);
      const full=document.createElement('div');for(const event of items.filter(e=>e.all_day&&containsDay(e,date)))full.append(link(event));allDay.append(full);
      const column=document.createElement('div');column.className='cal-time-column';
      for(let h=0;h<24;h++){const slot=document.createElement('button');slot.type='button';slot.className='cal-hour-slot';slot.setAttribute('aria-label','Crear evento '+date.toLocaleDateString('es')+' '+h+':00');slot.addEventListener('click',()=>{const value=day(date);value.setHours(h);openCreate(value,true)});column.append(slot)}
      const minute=value=>value.getHours()*60+value.getMinutes();
      const intervals=items.filter(e=>!e.all_day&&containsDay(e,date)).map(event=>{const begin=new Date(event.starts_at),finish=new Date(event.ends_at);return {event,start:begin<date?0:minute(begin),end:finish>=day(date,1)?1440:minute(finish)}});
      for(const item of layoutIntervals(intervals)){const a=link(item.event);a.classList.add('cal-timed-event');a.replaceChildren();const title=document.createElement('strong');title.textContent=item.event.title;const time=document.createElement('small');time.textContent=new Date(item.event.starts_at).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'})+'–'+new Date(item.event.ends_at).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});a.append(title,time);a.style.top=(item.start*.8)+'px';a.style.height=Math.max(24,(item.end-item.start)*.8-2)+'px';a.style.left=(item.lane/item.columns*100)+'%';a.style.width=(100/item.columns)+'%';column.append(a)}grid.append(column);
    }
    scroll.append(grid);wrapper.append(header,allDay,scroll);$('display').replaceChildren(wrapper);scroll.scrollTop=7*48;
  }

  async function load() {
    const version = ++loadNumber;
    const [start, end] = range();
    const status = $('page-status');
    $('period').textContent = view === 'month'
      ? anchor.toLocaleDateString('es-ES', {month: 'long', year: 'numeric'})
      : (start.toLocaleDateString('es',{month:'short'}).replace('.','') + (start.getMonth()===day(end,-1).getMonth()?'':' – '+day(end,-1).toLocaleDateString('es',{month:'short'}).replace('.',''))+' '+day(end,-1).getFullYear());
    $('display').replaceChildren();
    status.textContent = 'Cargando eventos…';
    if (miniMonth.getFullYear() !== anchor.getFullYear() || miniMonth.getMonth() !== anchor.getMonth()) miniMonth = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
    renderMini();
    const query = new URLSearchParams({from: day(start, -2).toISOString(), to: day(end, 2).toISOString(), limit: '200'});
    try {
      const items = [];
      let offset = 0;
      do {
        query.set('offset', offset);
        const page = await api('/events?' + query);
        if (version !== loadNumber) return;
        items.push(...page.items);
        offset = page.next_offset;
      } while (offset !== null);
      const visible = items.filter(event => shown(event.calendar_id)).filter(event => event.all_day
        ? event.local_start.slice(0, 10) < key(end) && event.local_end.slice(0, 10) > key(start)
        : new Date(event.starts_at) < end && new Date(event.ends_at) > start);
      render(visible, start, end);
      status.textContent = '';
    } catch (error) { if (version === loadNumber) status.textContent = describe(error); }
  }
  async function loadCalendars() {
    calendars = (await api('/calendars')).items;
    renderCalendarList();
  }
  // Sidebar calendars: visibility and colour are the signed-in user's own preferences, stored on the server.
  const PALETTE = {'#0a84ff': 'Azul', '#30d158': 'Verde', '#ff9f0a': 'Naranja', '#ff453a': 'Rojo', '#bf5af2': 'Morado', '#ff2d55': 'Rosa', '#64d2ff': 'Celeste', '#a2845e': 'Marrón'};
  let miniMonth = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
  const shown = id => calendars.find(item => item.id === id)?.visible !== false;
  function renderCalendarList() {
    const own = calendars.filter(item => item.role === 'owner'), shared = calendars.filter(item => item.role !== 'owner');
    fillCalendars($('own-list'), own);
    fillCalendars($('shared-list'), shared);
    $('shared-group').hidden = !shared.length;
  }
  function fillCalendars(list, items) {
    list.replaceChildren(...items.map(item => {
      const row = document.createElement('li');
      row.className = 'cal-item';
      row.dataset.id = item.id;
      row.style.setProperty('--cal-color', eventColor(item.id));
      const label = document.createElement('label');
      const box = document.createElement('input');
      box.type = 'checkbox';
      box.checked = item.visible !== false;
      box.addEventListener('change', () => void savePreference(item, {visible: box.checked}));
      const name = document.createElement('span');
      name.className = 'cal-item-name';
      name.textContent = item.name;
      label.append(box, name);
      if (item.role !== 'owner' && item.owner) {
        const owner = document.createElement('small');
        owner.textContent = item.owner + (item.role === 'editor' ? ' · Edición' : ' · Lectura');
        label.append(owner);
      }
      const more = document.createElement('button');
      more.type = 'button';
      more.className = 'cal-item-more';
      more.setAttribute('aria-label', 'Opciones de ' + item.name);
      more.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 8h.01M8 8h.01M12 8h.01"/></svg>';
      more.addEventListener('click', event => calendarMenu(event, item));
      row.append(label, more);
      return row;
    }));
  }
  const putPreference = (item, visible) => api('/calendars/' + item.id + '/preferences', 'PUT', {color: item.color || null, visible})
    .then(() => { item.visible = visible; });
  async function savePreference(item, changes) {
    const next = {color: item.color || null, visible: item.visible !== false, ...changes};
    try {
      await api('/calendars/' + item.id + '/preferences', 'PUT', next);
      Object.assign(item, next);
    } catch (error) { $('page-status').textContent = describe(error); }
    renderCalendarList();
    await load();
  }
  async function setVisibility(rule) {
    try {
      await Promise.all(calendars.filter(item => (item.visible !== false) !== rule(item)).map(item => putPreference(item, rule(item))));
    } catch (error) { $('page-status').textContent = describe(error); }
    renderCalendarList();
    await load();
  }
  function calendarItems(item) {
    const owner = item.role === 'owner';
    return [
      {label: 'Mostrar solo este calendario', icon: 'calendar', action: () => setVisibility(other => other.id === item.id)},
      {label: 'Mostrar todos los calendarios', icon: 'check', hidden: calendars.every(other => other.visible !== false), action: () => setVisibility(() => true)},
      '-',
      {label: owner ? 'Editar calendario…' : 'Cambiar color…', icon: 'edit', action: () => openCalendarEditor(item.id)},
      {label: 'Compartir y permisos…', icon: 'share', hidden: !owner, action: () => openCalendarEditor(item.id, true)},
      '-',
      {label: 'Eliminar calendario', icon: 'trash', danger: true, hidden: !owner || item.is_default, action: () => deleteCalendar(item)}
    ];
  }
  function calendarMenu(event, item) { window.SantolvShell?.contextMenu?.(event, calendarItems(item), {label: 'Opciones de ' + item.name}); }
  for (const list of [$('own-list'), $('shared-list')]) window.SantolvShell?.bindContextMenu?.(list, event => {
    const item = calendars.find(calendar => calendar.id === event.target.closest('.cal-item')?.dataset.id);
    return item && calendarItems(item);
  }, {label: 'Opciones del calendario'});
  function renderMini() {
    $('mini-title').textContent = miniMonth.toLocaleDateString('es-ES', {month: 'long', year: 'numeric'});
    const grid = $('mini-grid');
    grid.replaceChildren(...['L', 'M', 'X', 'J', 'V', 'S', 'D'].map(text => Object.assign(document.createElement('span'), {className: 'cal-mini-weekday', textContent: text})));
    const [from, to] = range(), first = monday(miniMonth), today = key(new Date());
    for (let i = 0; i < 42; i++) {
      const date = day(first, i), button = document.createElement('button');
      button.type = 'button';
      button.textContent = date.getDate();
      button.className = 'cal-mini-day' + (date.getMonth() !== miniMonth.getMonth() ? ' outside' : '') + (date >= from && date < to ? ' in-range' : '');
      if (key(date) === today) button.setAttribute('aria-current', 'date');
      button.setAttribute('aria-label', date.toLocaleDateString('es-ES', {dateStyle: 'full'}));
      button.addEventListener('click', () => { anchor = date; void load(); });
      grid.append(button);
    }
  }
  $('mini-previous').addEventListener('click', () => { miniMonth = new Date(miniMonth.getFullYear(), miniMonth.getMonth() - 1, 1); renderMini(); });
  $('mini-next').addEventListener('click', () => { miniMonth = new Date(miniMonth.getFullYear(), miniMonth.getMonth() + 1, 1); renderMini(); });
  $('add-calendar').addEventListener('click', event => { event.preventDefault(); event.stopPropagation(); void openCalendarEditor(null); });

  function scheduleInputs() {
    const allDay = eventFields.all_day.checked;
    for (const control of [eventFields.local_start, eventFields.local_end]) {
      const value = control.value;
      control.type = allDay ? 'date' : 'datetime-local';
      if (value) control.value = allDay ? value.slice(0, 10) : value.length === 10 ? value + 'T09:00' : value;
    }
    $('end-label').textContent = allDay ? 'Fin (fecha excluida)' : 'Fin';
    const repeat = Boolean(eventFields.repeat_kind.value) && mode !== 'occurrence';
    $('repeat-choice').hidden = !repeat;
    $('repeat-until').hidden = !repeat || eventFields.repeat_end.value !== 'until';
    $('repeat-count').hidden = !repeat || eventFields.repeat_end.value !== 'count';
    eventFields.repeat_until.required = !$('repeat-until').hidden;
    eventFields.repeat_count.required = !$('repeat-count').hidden;
  }
  function formMode(next, item) {
    mode = next;
    const viewing = next === 'view';
    const creating = next === 'create';
    const recurring = Boolean(item?.repeat_kind);
    eventForm.reset();
    $('event-status').textContent = '';
    $('event-heading').textContent = viewing ? item.title : ({create: 'Nuevo evento', series: 'Editar evento', occurrence: 'Editar ocurrencia'})[next];
    $('event-detail').textContent = viewing ? eventLabel(item) + ' · ' + item.calendar_name : '';
    $('event-fields').disabled = viewing;
    $('repeat-fields').hidden = next === 'occurrence' || (viewing && !recurring);
    $('repeat-fields').disabled = next === 'occurrence';
    $('event-reminder').hidden = next === 'occurrence';
    $('reminder-options').hidden = next === 'occurrence';
    $('save-reminder').hidden = !viewing;
    $('save-event').hidden = viewing;
    $('save-event').textContent=creating?'Añadir':'Guardar';
    $('close-event').textContent=viewing?'Cerrar':'Cancelar';
    $('edit-single').hidden = !viewing || !recurring || item?.role === 'reader';
    $('edit-series').hidden = !viewing || item?.role === 'reader';
    $('edit-series').textContent = recurring ? 'Editar serie' : 'Editar';
    $('delete-event').hidden = creating || viewing;
    $('delete-event').textContent = next === 'occurrence' ? 'Cancelar ocurrencia' : recurring ? 'Eliminar serie' : 'Eliminar evento';
    const options = creating ? calendars.filter(calendar => calendar.role !== 'reader') : [calendars.find(calendar => calendar.id === item.calendar_id) || {id: item.calendar_id, name: item.calendar_name}];
    eventFields.calendar_id.replaceChildren(...options.map(calendar => new Option(calendar.name, calendar.id)));
    if (creating && !options.some(calendar => calendar.is_default)) eventFields.calendar_id.prepend(new Option('Personal', ''));
    const onlyVisible = calendars.filter(calendar => calendar.visible !== false);
    if (creating && onlyVisible.length === 1 && options.some(calendar => calendar.id === onlyVisible[0].id)) eventFields.calendar_id.value = onlyVisible[0].id;
    eventFields.calendar_id.disabled = !creating;
    eventFields.title.value = item?.title || '';
    eventFields.description.value = item?.description || '';
    eventFields.zone.value = item?.zone || zone;
    eventFields.busy.value = String(item?.busy ?? true);
    eventFields.all_day.checked = item?.all_day || false;
    eventFields.repeat_kind.value = item?.repeat_kind || '';
    eventFields.repeat_end.value = item?.repeat_until ? 'until' : item?.repeat_count ? 'count' : '';
    eventFields.repeat_until.value = item?.repeat_until || '';
    eventFields.repeat_count.value = item?.repeat_count ?? '';
    const reminder = item?.reminder_minutes;
    for (const option of eventFields.reminder_minutes.querySelectorAll('[data-custom]')) option.remove();
    if (reminder != null && ![...eventFields.reminder_minutes.options].some(option => option.value === String(reminder))) {
      const option = new Option(reminder + ' minutos antes', reminder);
      option.dataset.custom = '';
      eventFields.reminder_minutes.add(option);
    }
    eventFields.reminder_minutes.value = reminder ?? '';
    scheduleInputs();
    for (const field of ['local_start', 'local_end']) {
      if (item?.[field]) eventFields[field].value = item[field].slice(0, item.all_day ? 10 : 19);
    }
    refreshClocks(); renderChips();
    $('event-links').hidden = !viewing;
    if (viewing) void loadLinks(item.event_id || item.id);
    if (!eventDialog.open) eventDialog.showModal();
  }

  function renderChips(){const group=$('calendar-chips');group.replaceChildren();for(const option of eventFields.calendar_id.options){const b=document.createElement('button');b.type='button';b.textContent=option.textContent;b.style.setProperty('--chip-color',eventColor(option.value));b.setAttribute('aria-pressed',String(option.value===eventFields.calendar_id.value));b.disabled=eventFields.calendar_id.disabled;b.addEventListener('click',()=>{eventFields.calendar_id.value=option.value;renderChips()});group.append(b)}}
  function refreshClocks(){ $('calendar-date').value=eventFields.local_start.value.slice(0,10);$('start-clock').value=eventFields.local_start.value.slice(11,16)||'09:00';$('end-clock').value=eventFields.local_end.value.slice(11,16)||'10:00';document.querySelectorAll('.cal-clock-row').forEach(row=>row.hidden=eventFields.all_day.checked); }
  function syncClocks(resetSpan = false){
    const date=$('calendar-date').value;if(!date)return;
    const allDay=eventFields.all_day.checked,start=allDay?'00:00':$('start-clock').value,end=allDay?'00:00':$('end-clock').value;
    const previousStart=eventFields.local_start.value.slice(0,10),previousEnd=eventFields.local_end.value.slice(0,10);
    const span=previousStart&&previousEnd?Math.max(0,Math.round((Date.parse(previousEnd)-Date.parse(previousStart))/86400000)):0;
    const days=allDay?Math.max(1,span):resetSpan===true?Number(end<=start):Math.max(span,Number(end<=start));
    const endDate=key(day(dateFromKey(date),days));
    eventFields.local_start.value=date+(allDay?'':'T'+start);eventFields.local_end.value=endDate+(allDay?'':'T'+end);
  }
  for(const id of ['calendar-date','start-clock','end-clock'])$(id).addEventListener('change',syncClocks);
  eventFields.all_day.addEventListener('change',()=>{scheduleInputs();syncClocks(true);refreshClocks()});
  for(const field of ['local_start','local_end'])eventFields[field].addEventListener('change',refreshClocks);
  async function loadLinks(id){
    const version=detailsNumber;const area=$('source-links');area.replaceChildren();
    for(const kind of ['notes','tasks']){const select=$(kind==='notes'?'linked-note':'linked-task');select.replaceChildren(new Option('Ninguna',''));select.disabled=true;
      try{const [page,current]=await Promise.all([request('/'+kind+'?limit=100'),api('/events/'+id+'/links/'+kind)]);if(version!==detailsNumber)return;for(const item of page.items)select.add(new Option(item.title,item.id));if(current.id&&!page.items.some(item=>item.id===current.id)){const item=await request('/'+kind+'/'+current.id);if(version!==detailsNumber)return;select.add(new Option(item.title,item.id))}select.value=current.id||'';select.disabled=false;select.dataset.initial=select.value;const more=$('more-linked-'+kind);more.dataset.cursor=page.next_cursor||'';more.hidden=!page.next_cursor;if(current.id){const a=document.createElement('a');a.href='/'+kind+'/?id='+encodeURIComponent(current.id);a.textContent='Abrir '+(kind==='notes'?'nota':'tarea');area.append(a)}}catch(error){if(version===detailsNumber){const p=document.createElement('p');p.textContent=(kind==='notes'?'Notas: ':'Tareas: ')+(error.status===503?'Servicio desactivado.':error.status===403?'Acceso denegado.':describe(error));area.append(p)}}
    }
  }
  for(const kind of ['notes','tasks'])$('more-linked-'+kind).addEventListener('click',async()=>{const button=$('more-linked-'+kind),version=detailsNumber;button.disabled=true;try{const page=await request('/'+kind+'?limit=100&cursor='+encodeURIComponent(button.dataset.cursor));if(version!==detailsNumber)return;const select=$(kind==='notes'?'linked-note':'linked-task');for(const item of page.items)if(![...select.options].some(o=>o.value===item.id))select.add(new Option(item.title,item.id));button.dataset.cursor=page.next_cursor||'';button.hidden=!page.next_cursor}catch(error){if(version===detailsNumber)$('event-status').textContent=describe(error)}finally{button.disabled=false}});
  $('save-links').addEventListener('click',async()=>{const eventId=detail?.event.id,version=detailsNumber;if(!eventId)return;const button=$('save-links');button.disabled=true;try{for(const kind of ['notes','tasks']){const select=$(kind==='notes'?'linked-note':'linked-task');if(!select.disabled&&select.value!==select.dataset.initial){const value=select.value;await api('/events/'+eventId+'/links/'+kind,'PUT',{id:value||null});if(version!==detailsNumber)return;select.dataset.initial=value}}if(version!==detailsNumber)return;$('event-status').textContent='Vínculos guardados.';await loadLinks(eventId)}catch(error){$('event-status').textContent=describe(error)}finally{button.disabled=false}});

  function openCreate(date, exact = false) {
    detailsNumber++;
    detail = null;
    formMode('create');
    const now = new Date();
    const start = exact ? date : key(date) === key(now) ? new Date(now.getTime() + 1800000) : new Date(date.setHours(9, 0, 0, 0));
    eventFields.local_start.value = localTime(start);
    eventFields.local_end.value = localTime(new Date(start.getTime() + 3600000));
    refreshClocks();
  }
  const occurrencePath = (id, original) => '/events/' + encodeURIComponent(id) + '/occurrences/' + encodeURIComponent(original);
  async function openDetail(id, original) {
    const version = ++detailsNumber;
    try {
      const [event, occurrence] = await Promise.all([api('/events/' + encodeURIComponent(id)), api(occurrencePath(id, original))]);
      if (version !== detailsNumber) return;
      detail = {event, occurrence};
      formMode('view', {...occurrence, repeat_until: event.repeat_until, repeat_count: event.repeat_count});
    } catch (error) { if (version === detailsNumber) $('page-status').textContent = describe(error); }
  }
  const reminderValue = () => eventFields.reminder_minutes.value === '' ? null : Number(eventFields.reminder_minutes.value);
  function formData() {
    const value = name => eventFields[name].value;
    const allDay = eventFields.all_day.checked;
    const local = name => value(name) + (allDay ? 'T00:00' : '');
    return {
      title: value('title'), description: value('description'), zone: value('zone').trim(),
      local_start: local('local_start'), local_end: local('local_end'), all_day: allDay, busy: value('busy') === 'true'
    };
  }
  async function updated() {
    eventDialog.close();
    await loadCalendars();
    await Promise.all([load(), calendar.refresh()]);
  }
  eventForm.addEventListener('submit', async event => {
    event.preventDefault();
    if (mode === 'view') return;
    const button = $('save-event');
    button.disabled = true;
    $('event-status').textContent = '';
    try {
      if (mode === 'occurrence') {
        await api(occurrencePath(detail.event.id, detail.occurrence.original_start), 'PUT', {revision: detail.event.revision, event: formData()});
      } else {
        const kind = eventFields.repeat_kind.value;
        const endMode = eventFields.repeat_end.value;
        const input = {
          ...formData(), calendar_id: eventFields.calendar_id.value || null, repeat_kind: kind || null,
          repeat_until: kind && endMode === 'until' ? eventFields.repeat_until.value : null,
          repeat_count: kind && endMode === 'count' ? Number(eventFields.repeat_count.value) : null,
          reminder_minutes: reminderValue(), revision: detail?.event.revision
        };
        if (mode === 'create') await api('/events', 'POST', input);
        else {
          const path = '/events/' + detail.event.id;
          try { await api(path, 'PUT', input); }
          catch (error) {
            if (error.message !== 'confirm_clear_exceptions') throw error;
            if (!window.confirm('Este cambio quitará los cambios y cancelaciones de ocurrencias individuales. ¿Guardar la serie?')) return;
            await api(path, 'PUT', {...input, clear_exceptions: true});
          }
        }
      }
      await updated();
    } catch (error) { $(eventDialog.open ? 'event-status' : 'page-status').textContent = describe(error); }
    finally { button.disabled = false; }
  });
  $('save-reminder').addEventListener('click', async () => {
    const button = $('save-reminder');
    button.disabled = true;
    try {
      const minutes = reminderValue();
      await api('/events/' + detail.event.id + '/reminder', 'PUT', {minutes_before: minutes});
      detail.event.reminder_minutes = minutes;
      detail.occurrence.reminder_minutes = minutes;
      $('event-status').textContent = 'Recordatorio guardado.';
      void calendar.refresh();
    } catch (error) { $('event-status').textContent = describe(error); }
    finally { button.disabled = false; }
  });
  $('delete-event').addEventListener('click', async () => {
    const one = mode === 'occurrence';
    if (!window.confirm(one ? '¿Cancelar esta ocurrencia?' : '¿Eliminar este evento y todas sus ocurrencias?')) return;
    const button = $('delete-event');
    button.disabled = true;
    try {
      if (one) await api(occurrencePath(detail.event.id, detail.occurrence.original_start), 'PUT', {revision: detail.event.revision, cancelled: true});
      else await api('/events/' + detail.event.id + '?revision=' + detail.event.revision, 'DELETE');
      await updated();
    } catch (error) { $(eventDialog.open ? 'event-status' : 'page-status').textContent = describe(error); }
    finally { button.disabled = false; }
  });
  $('edit-single').addEventListener('click', () => formMode('occurrence', detail.occurrence));
  $('edit-series').addEventListener('click', () => formMode('series', detail.event));
  $('close-event').addEventListener('click', () => eventDialog.close());
  eventDialog.addEventListener('close', () => {
    detailsNumber++;
    if (location.search) history.replaceState(null, '', '/calendar/');
  });
  for (const field of ['repeat_kind', 'repeat_end']) eventFields[field].addEventListener('change', scheduleInputs);
  eventFields.all_day.addEventListener('change', () => {
    scheduleInputs();
    const start = eventFields.local_start.value;
    if (eventFields.all_day.checked && start && eventFields.local_end.value <= start) {
      eventFields.local_end.value = key(day(dateFromKey(start), 1));
    }
  });

  async function manageSelection() {
    const version = ++membersNumber;
    const id = $('manage-select').value;
    const current = calendars.find(calendar => calendar.id === id);
    const owner = current?.role === 'owner';
    $('sharing').hidden = !owner;
    $('members').replaceChildren();
    $('share-form').reset();
    if (!owner) return;
    try {
      const {items} = await api('/calendars/' + id + '/members');
      if (version !== membersNumber) return;
      for (const member of items) {
        const row = document.createElement('li');
        const text = document.createElement('span');
        text.textContent = member.username + ' · ' + (member.role === 'editor' ? 'Edición' : 'Lectura');
        const revoke = document.createElement('button');
        revoke.type = 'button';
        revoke.textContent = 'Quitar acceso';
        revoke.setAttribute('aria-label', 'Quitar acceso a ' + member.username);
        revoke.addEventListener('click', () => void manageAction(revoke, async () => {
          await api('/calendars/' + id + '/members/' + member.user_id, 'DELETE');
          await manageSelection();
        }));
        row.append(text, revoke);
        $('members').append(row);
      }
    } catch (error) { if (version === membersNumber) $('manage-status').textContent = describe(error); }
  }
  async function manageAction(button, action) {
    button.disabled = true;
    $('manage-status').textContent = '';
    try { await action(); }
    catch (error) { $('manage-status').textContent = describe(error); }
    finally { button.disabled = false; }
  }
  function renderColors(current) {
    $('color-choices').replaceChildren(...Object.entries(PALETTE).map(([value, label]) => {
      const swatch = document.createElement('label');
      swatch.className = 'cal-swatch';
      swatch.style.setProperty('--swatch', value);
      swatch.title = label;
      const input = document.createElement('input');
      input.type = 'radio';
      input.name = 'color';
      input.value = value;
      input.checked = value === current;
      input.setAttribute('aria-label', label);
      swatch.append(input);
      return swatch;
    }));
    if (!nameForm.querySelector('input[name=color]:checked')) nameForm.querySelector('input[name=color]').checked = true;
  }
  async function openCalendarEditor(id, share = false) {
    const current = calendars.find(calendar => calendar.id === id) || null;
    const owner = !current || current.role === 'owner';
    $('manage-select').value = current ? current.id : '';
    $('manage-heading').textContent = !current ? 'Nuevo calendario' : owner ? 'Editar calendario' : 'Calendario compartido';
    nameForm.elements.name.value = current?.name || '';
    nameForm.elements.name.disabled = !owner;
    renderColors(current ? eventColor(current.id) : Object.keys(PALETTE)[calendars.length % 8]);
    $('save-calendar').textContent = current ? 'Guardar' : 'Crear calendario';
    $('delete-calendar').hidden = !current || !owner || current.is_default;
    $('manage-status').textContent = '';
    $('sharing').hidden = true;
    manageDialog.showModal();
    (owner ? nameForm.elements.name : nameForm.querySelector('input[name=color]:checked')).focus();
    await manageSelection();
    if (share && !$('sharing').hidden) $('share-form').elements.username.focus();
  }
  async function deleteCalendar(item) {
    if (!window.confirm('¿Eliminar «' + item.name + '» y todos sus eventos?')) return;
    try {
      await api('/calendars/' + item.id, 'DELETE');
      if (manageDialog.open) manageDialog.close();
      await loadCalendars();
      await Promise.all([load(), calendar.refresh()]);
    } catch (error) { $(manageDialog.open ? 'manage-status' : 'page-status').textContent = describe(error); }
  }
  $('close-manage').addEventListener('click', () => manageDialog.close());
  nameForm.addEventListener('submit', event => {
    event.preventDefault();
    void manageAction($('save-calendar'), async () => {
      const id = $('manage-select').value;
      const current = calendars.find(item => item.id === id);
      const color = nameForm.querySelector('input[name=color]:checked')?.value || null;
      const name = nameForm.elements.name.value.trim();
      let target = id;
      if (!current) target = (await api('/calendars', 'POST', {name})).id;
      else if (current.role === 'owner' && name !== current.name) await api('/calendars/' + id, 'PUT', {name});
      await api('/calendars/' + target + '/preferences', 'PUT', {color, visible: current ? current.visible !== false : true});
      manageDialog.close();
      await loadCalendars();
      await Promise.all([load(), calendar.refresh()]);
    });
  });
  $('delete-calendar').addEventListener('click', () => {
    const item = calendars.find(calendar => calendar.id === $('manage-select').value);
    if (item) void deleteCalendar(item);
  });
  $('share-form').addEventListener('submit', event => {
    event.preventDefault();
    const form = event.currentTarget;
    void manageAction(form.querySelector('button'), async () => {
      await api('/calendars/' + $('manage-select').value + '/members', 'PUT', {
        username: form.elements.username.value, role: form.elements.role.value
      });
      await manageSelection();
    });
  });

  function shift(direction) {
    anchor = view === 'month' ? new Date(anchor.getFullYear(), anchor.getMonth() + direction, 1) : day(anchor, direction * (view === 'week' ? 7 : 14));
    void load();
  }
  // Right click: event actions on an event, "Nuevo evento" on an empty hour or day.
  window.SantolvShell?.bindContextMenu?.(document.querySelector('.cal-workspace'), contextEvent => {
    const target = contextEvent.target;
    const anchorLink = target.closest('a.cal-event');
    const item = anchorLink && eventRecords.get(anchorLink);
    if (item) return [
      {label: 'Abrir evento', icon: 'open', action: () => anchorLink.click()},
      {label: 'Abrir en una pestaña nueva', icon: 'share', action: () => window.open(anchorLink.href, '_blank', 'noopener')},
      {label: 'Copiar enlace', icon: 'copy', hidden: !navigator.clipboard, action: () => navigator.clipboard.writeText(anchorLink.href)},
      '-',
      {label: 'Nuevo evento este día', icon: 'plus', action: () => openCreate(day(new Date(item.starts_at)))},
      '-',
      {label: 'Eliminar evento…', icon: 'trash', danger: true, action: async () => { await openDetail(item.event_id, item.original_start); if (detail?.event.id === item.event_id) $('delete-event').click(); }}
    ];
    const slot = target.closest('.cal-hour-slot') || target.closest('.cal-day')?.querySelector('button.day-number');
    if (slot) return [{label: 'Nuevo evento', icon: 'calendar', action: () => slot.click()}, '-', {label: 'Ir a hoy', icon: 'restore', action: () => $('today').click()}];
  }, {label: 'Acciones del calendario'});
  $('today').addEventListener('click', () => { anchor = new Date(); void load(); });
  $('previous').addEventListener('click', () => shift(-1));
  $('next').addEventListener('click', () => shift(1));
  $('new-event').addEventListener('click', () => openCreate(day(anchor)));
  for (const button of document.querySelectorAll('[data-view]')) button.addEventListener('click', () => {
    view = button.dataset.view;
    for (const item of document.querySelectorAll('[data-view]')) item.setAttribute('aria-pressed', String(item === button));
    void load();
  });
  document.addEventListener('calendar-updated', () => void loadCalendars().then(load).catch(error => {
    $('page-status').textContent = describe(error);
  }));
  async function endSession() {
    await request('/auth/logout', 'POST');
    window.SantolvShell.sessionEnded();
    document.body.hidden = true;
    location.replace('/');
  }
  async function begin() {
    const profile = await request('/me');
    if (profile.must_change_password) { location.replace('/account/'); return; }
    window.SantolvShell.session(profile.expires_at);
    window.SantolvShell.account(profile, {switch: endSession, logout: endSession});
    await loadCalendars();
    const params = new URLSearchParams(location.search);
    let linkStatus = '';
    if (params.has('event') && params.has('original')) {
      await openDetail(params.get('event'), params.get('original'));
      if (detail) anchor = dateFromKey(detail.occurrence.local_start.slice(0, 10));
      else linkStatus = $('page-status').textContent;
    }
    await load();
    if (linkStatus) $('page-status').textContent = linkStatus;
  }
  void begin().catch(error => { $('page-status').textContent = describe(error); });
})();
</script>
