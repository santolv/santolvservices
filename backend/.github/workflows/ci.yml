name: Rust and PostgreSQL
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://drive_test:test-only@localhost:5432/drive_test
    steps:
      - uses: actions/checkout@v4
      - name: Start runner PostgreSQL without containers
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE drive_test LOGIN CREATEDB PASSWORD 'test-only';"
          sudo -u postgres createdb -O drive_test drive_test
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo install cargo-audit --locked
      - run: cargo audit
