name: Single-file installers
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["main", "codex/**"]
    paths:
      - ".github/workflows/installers.yml"
      - "backend/src/installer.rs"
      - "backend/src/core/postgres.rs"
      - "backend/src/dependencies.rs"
      - "backend/src/main.rs"
jobs:
  package:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: santolvdrive-linux-x64
            binary: santolvdrive
            target: x86_64-unknown-linux-musl
            rustflags: ""
          - os: ubuntu-24.04-arm
            artifact: santolvdrive-linux-arm64
            binary: santolvdrive
            target: aarch64-unknown-linux-musl
            rustflags: ""
          - os: windows-latest
            artifact: santolvdrive-windows-x64.exe
            binary: santolvdrive.exe
            target: x86_64-pc-windows-msvc
            rustflags: "-C target-feature=+crt-static"
          - os: macos-15-intel
            artifact: santolvdrive-macos-x64
            binary: santolvdrive
            target: x86_64-apple-darwin
            rustflags: ""
          - os: macos-latest
            artifact: santolvdrive-macos-arm64
            binary: santolvdrive
            target: aarch64-apple-darwin
            rustflags: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools postgresql
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: cargo test --locked --lib installer::tests --target ${{ matrix.target }}
      - run: ./target/${{ matrix.target }}/release/${{ matrix.binary }} install --check
      - name: Verify native Linux installation and startup
        if: runner.os == 'Linux'
        shell: bash
        run: |
          runtime="$RUNNER_TEMP/santolv-server"
          server="$runtime/santolvdrive"
          printf '%s\n' '{"username":"test_admin","password":"temporary-test-only"}' |
            ./target/${{ matrix.target }}/release/santolvdrive install --directory "$runtime" --stdin
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" || true' EXIT
          "$server" serve &
          server_pid=$!
          curl --fail --silent --show-error --max-time 2 --retry 10 --retry-connrefused http://127.0.0.1:8443/health/ready
          curl --fail --silent --show-error --max-time 2 http://localhost:5500/ > /dev/null
      - name: Name artifact
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/${{ matrix.artifact }}
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum '${{ matrix.artifact }}' > '${{ matrix.artifact }}.sha256'; else shasum -a 256 '${{ matrix.artifact }}' > '${{ matrix.artifact }}.sha256'; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: backend/dist/*
