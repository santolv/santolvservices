[package]
name = "santolvdrive"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[dependencies]
axum = { version = "0.8", features = ["json", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["http1", "server", "tokio", "service"] }
tower-http = { version = "0.6", features = ["trace", "limit"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "time", "json", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "serde-human-readable"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
futures-util = "0.3"
unicode-normalization = "0.1"
rpassword = "7"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
rcgen = "0.14"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
