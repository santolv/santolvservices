# ArtCraft editors hosted by the suite (see docs/architecture/office-editors.md).
# Each is an official GitHub release, pinned by tag AND commit: the build script refuses a tag
# that no longer points at the recorded commit. Updating an editor = change tag + commit here,
# rebuild with tools/build-office-editors.ps1 and review the changes before deploying.

[wordcraft]
repository = "https://github.com/storytold/wordcraft"
tag = "v0.19.1"
commit = "5d658dc033f3139926839bffd6ae0eef558c210c"
package = "wordcraft-web"
service = "documents"

