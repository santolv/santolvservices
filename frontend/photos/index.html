/* Interactive glass: a moving selected lens, a hover lens, and light reflections. */
.periods{position:relative;isolation:isolate;--lens-x:0px;--lens-width:0px;--hover-x:0px;--hover-width:0px;overflow:visible}
.periods:before,.periods:after{content:'';position:absolute;left:0;top:4px;bottom:4px;pointer-events:none;border-radius:999px;box-sizing:border-box;backdrop-filter:blur(18px) saturate(190%);-webkit-backdrop-filter:blur(18px) saturate(190%);transition:transform 440ms cubic-bezier(.22,1.12,.36,1),width 380ms cubic-bezier(.22,1,.36,1),opacity 180ms ease,box-shadow 220ms ease}
.periods:before{z-index:0;width:var(--lens-width);transform:translateX(var(--lens-x));background:linear-gradient(150deg,color-mix(in srgb,var(--surface) 90%,transparent),color-mix(in srgb,var(--surface) 48%,transparent));border:1px solid color-mix(in srgb,var(--surface) 90%,var(--line));box-shadow:0 2px 8px #1b304b18,inset 0 1px 0 #ffffffb3,inset 0 -1px 0 #314d7512;opacity:0}
.periods[data-glass-ready]:before{opacity:1}.periods:after{z-index:1;width:var(--hover-width);transform:translateX(var(--hover-x)) scale(.96);opacity:0;background:radial-gradient(ellipse at 25% 0%,#ffffffb0,transparent 72%),color-mix(in srgb,var(--blue) 6%,transparent);border:1px solid color-mix(in srgb,var(--surface) 80%,transparent);box-shadow:0 3px 12px #243a5412,inset 0 1px 0 #ffffffbd}
.periods[data-hovering]:after{opacity:1;transform:translateX(var(--hover-x)) scale(1.015,1.08)}
.periods button,.app.non-library .periods button{position:relative;z-index:2;transition:color 180ms ease,transform 230ms var(--motion-ease);background:transparent;box-shadow:none;border:1px solid transparent}
.periods button[aria-pressed="true"],.app.non-library .periods button[aria-pressed="true"]{background:transparent;box-shadow:none;color:var(--text)}
.periods button:hover{color:var(--blue)}.periods button:active:not(:disabled){transform:scale(.94)}
.top-group:not(.periods),.search,.select-mode-button{transition:box-shadow 250ms ease,border-color 250ms ease,background-color 250ms ease,transform 250ms var(--motion-ease)}
@media(hover:hover){.top-group:not(.periods):hover,.search:hover{border-color:color-mix(in srgb,var(--blue) 16%,var(--glass-border));box-shadow:0 5px 20px #233f6212,inset 0 1px 0 #ffffffb3}.nav:hover,.album-link:hover{transform:translateX(3px)}.nav[aria-current="page"]:hover{transform:translateX(1px)}.select-mode-button:hover{transform:translateY(-1px);box-shadow:0 4px 15px #233f6212,inset 0 1px 0 #ffffffa3}}

.icon-btn:hover:before,.icon-btn:focus-visible:before,.sidebar-button:hover:before,.select-mode-button:hover:before{opacity:.75}.icon-btn svg,.sidebar-button svg{position:relative;transition:transform 280ms var(--motion-ease),filter 200ms ease}.icon-btn:hover svg{transform:translateY(-1px) scale(1.08)}.icon-btn:active svg{transform:scale(.9)}
.photo-details{position:absolute;left:10px;right:10px;bottom:10px;z-index:1;display:grid;gap:6px;padding:12px;border-radius:12px;color:#fff;background:linear-gradient(135deg,#202a3e88,#11182066);border:1px solid #ffffff50;box-shadow:0 5px 20px #0002,inset 0 1px 0 #ffffff38;backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);text-align:left;opacity:0;transform:translateY(12px) scale(.975);pointer-events:none;transition:opacity 220ms ease,transform 400ms var(--motion-ease);will-change:auto}
.photo-details strong{font-size:13px;font-weight:600;letter-spacing:-.015em;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px #0003}.photo-detail-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:9px;line-height:1.4;color:#ffffffe0}.photo-detail-meta>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.photo-detail-meta>span:first-child{flex:none}.photo-card:hover .photo-details,.photo-card:focus-within .photo-details{opacity:1;transform:none;transition-delay:65ms}.photo-card:hover .favorite-mark,.photo-card:focus-within .favorite-mark{opacity:0}.is-selecting .photo-card .photo-details{opacity:0;transform:translateY(8px)}.is-selecting .photo-card .favorite-mark{opacity:1}
.photo-open:after{content:'';position:absolute;inset:0;border:1px solid #ffffff10;pointer-events:none;opacity:0;transition:opacity 220ms}.photo-card:hover .photo-open:after{opacity:1}.photo-card:hover .photo-open img{transform:scale(1.045);filter:brightness(.97)}.photo-card.is-selected:hover .photo-open img{transform:scale(.955)}
.period-card:before{content:'';position:absolute;inset:0;z-index:2;border-radius:inherit;pointer-events:none;background:linear-gradient(125deg,#ffffff28,transparent 40%);box-shadow:inset 0 0 0 1px #ffffff70;opacity:0;transition:opacity 300ms ease}.period-card:hover:before,.period-card:focus-visible:before{opacity:1}.period-card:hover .period-copy{transform:translateY(-5px)}.album-link svg{transition:transform 280ms var(--motion-ease)}.album-link:hover svg{transform:rotate(-5deg) scale(1.08)}
.glass-tooltip{position:fixed;z-index:150;max-width:240px;padding:7px 11px;border-radius:10px;background:var(--glass);color:var(--text);border:1px solid var(--glass-border);box-shadow:0 5px 20px #172a421c,inset 0 1px 0 #ffffff70;backdrop-filter:blur(24px) saturate(170%);font-size:11px;line-height:1.5;pointer-events:none;text-align:center}
@media(max-width:620px){.photo-details{left:6px;right:6px;bottom:6px;padding:8px;border-radius:9px;gap:4px}.photo-details strong{font-size:11px}.photo-detail-meta{font-size:8px;flex-wrap:wrap;gap:2px}.glass-tooltip{max-width:190px;font-size:10px}}
@media(hover:none){.photo-details{display:none}}
@media(prefers-reduced-motion:reduce){.periods:before,.periods:after,.photo-details,.icon-btn,.nav,.album-link{transition:none!important}.photo-card:hover .photo-open img,.icon-btn:hover svg,.nav:hover,.album-link:hover,.select-mode-button:hover,.album-link:hover svg,.periods[data-hovering]:after{transform:none}.periods[data-glass-ready]:before{transform:translateX(var(--lens-x))}.periods[data-hovering]:after{transform:translateX(var(--hover-x))}.photo-card.is-selected:hover .photo-open img{transform:scale(.955)}}

.app{grid-template-rows:48px minmax(0,1fr)}@media(max-width:620px){.app.mobile-sidebar .side{top:48px}}
</style>

</div>
  <dialog id="viewer" class="viewer" aria-label="Visor de fotos"><div class="viewer-layout"><div class="viewer-head"><div class="viewer-title"><strong id="viewer-name"></strong><small id="viewer-meta"></small></div><div class="viewer-actions"><button class="icon-btn" data-action="viewer-favorite" aria-label="Añadir a favoritos" aria-pressed="false"><svg aria-hidden="true"><use href="#i-heart"/></svg></button><button class="icon-btn" data-action="zoom" aria-label="Ampliar imagen" aria-pressed="false"><svg aria-hidden="true"><use href="#i-zoom"/></svg></button><button class="icon-btn" data-action="viewer-trash" aria-label="Mover a la papelera"><svg aria-hidden="true"><use href="#i-trash"/></svg></button><button class="icon-btn" data-action="close-viewer" aria-label="Cerrar visor"><svg aria-hidden="true"><use href="#i-close"/></svg></button></div></div><div class="viewer-stage" id="viewer-stage"><button class="icon-btn" data-action="previous" aria-label="Foto anterior"><svg style="transform:rotate(180deg)" aria-hidden="true"><use href="#i-arrow"/></svg></button><div class="viewer-image-wrap"><img id="viewer-image" alt=""></div><button class="icon-btn" data-action="next" aria-label="Foto siguiente"><svg aria-hidden="true"><use href="#i-arrow"/></svg></button></div><div class="viewer-foot" id="viewer-position"></div></div></dialog>
  <dialog id="info-dialog" aria-labelledby="info-title"><div class="dialog-head"><h2 id="info-title"></h2><button class="icon-btn" data-action="close-info" aria-label="Cerrar ventana"><svg aria-hidden="true"><use href="#i-close"/></svg></button></div><div class="dialog-body" id="info-body"></div></dialog>

<script>

'use strict';
const $ = id => document.getElementById(id);
const icon = name => '<svg aria-hidden="true"><use href="#i-' + name + '"/></svg>';
const escapeText = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const photos = [];
    const albums = [];

const state={route:'photos',album:null,filter:'all',sort:'newest',period:'all',datePrefix:'',year:'',viewerId:null,viewerIds:[],zoom:false,selecting:false,selected:new Set()};
let toastTimer,dragDepth=0,pendingFocus=null,pendingUndo=null;
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
const runningMotion=new WeakMap();
function animateElement(element,keyframes,options={}){if(!element||reducedMotion.matches||typeof element.animate!=='function')return null;runningMotion.get(element)?.cancel();const animation=element.animate(keyframes,{duration:320,easing:'cubic-bezier(.22,1,.36,1)',fill:'backwards',...options});runningMotion.set(element,animation);animation.finished.catch(()=>{});return animation}
function animateLibrary(){const cards=[...$('library').querySelectorAll('.photo-card,.album-cover,.period-card')];if(cards.length){const viewport=$('content').getBoundingClientRect();cards.filter(card=>{const rect=card.getBoundingClientRect();return rect.bottom>viewport.top&&rect.top<viewport.bottom}).slice(0,24).forEach((card,index)=>animateElement(card,[{opacity:0,transform:'translateY(10px) scale(.985)'},{opacity:1,transform:'none'}],{duration:380,delay:Math.min(index*16,160)}))}else animateElement($('library').firstElementChild,[{opacity:0,transform:'translateY(7px)'},{opacity:1,transform:'none'}],{duration:260})}
function prepareImages(){for(const image of $('library').querySelectorAll('.photo-open img')){const button=image.closest('.photo-open');const loaded=()=>button.classList.add('is-loaded');const failed=()=>{button.classList.add('is-error');if(!button.querySelector('.image-fallback')){const fallback=document.createElement('span');fallback.className='image-fallback';fallback.innerHTML=icon('photos')+'<span>No se pudo cargar la imagen</span>';button.append(fallback)}};if(!image.hasAttribute('src')){image.addEventListener('load',loaded,{once:true});image.addEventListener('error',failed,{once:true})}else if(image.complete){if(image.naturalWidth)loaded();else failed()}else{image.addEventListener('load',loaded,{once:true});image.addEventListener('error',failed,{once:true})}}}


let glassSyncFrame=0,tooltipTimer=0,tooltipTarget=null,reflectionFrame=0;
function syncPeriodGlass(){const group=$('periods');if(group.hidden){delete group.dataset.glassReady;return}const active=group.querySelector('[aria-pressed="true"]');if(!active||!active.offsetWidth){delete group.dataset.glassReady;return}group.style.setProperty('--lens-x',active.offsetLeft+'px');group.style.setProperty('--lens-width',active.offsetWidth+'px');group.dataset.glassReady='true'}
function queuePeriodGlass(){cancelAnimationFrame(glassSyncFrame);glassSyncFrame=requestAnimationFrame(syncPeriodGlass)}
function pointPeriodGlass(button){const group=$('periods');if(!button)return;group.style.setProperty('--hover-x',button.offsetLeft+'px');group.style.setProperty('--hover-width',button.offsetWidth+'px');group.dataset.hovering='true'}
function prepareHoverDetails(){for(const button of $('library').querySelectorAll('.photo-open')){if(button.querySelector('.photo-details'))continue;const photo=photos.find(item=>item.id===button.dataset.photo);if(!photo)continue;const detail=document.createElement('span');detail.className='photo-details';detail.setAttribute('aria-hidden','true');detail.innerHTML='<strong>'+escapeText(photo.name)+'</strong><span class="photo-detail-meta"><span>'+escapeText(dateCompact(photo.date))+'</span><span>'+escapeText(photo.place)+'</span></span>';button.append(detail)}for(const button of document.querySelectorAll('.icon-btn[title],.sidebar-button[title],.select-mode-button[title]')){button.dataset.tooltip=button.title;button.removeAttribute('title')}}
function hideGlassTooltip(){clearTimeout(tooltipTimer);$('glass-tooltip').hidden=true;if(tooltipTarget?.getAttribute('aria-describedby')==='glass-tooltip')tooltipTarget.removeAttribute('aria-describedby');tooltipTarget=null}
function showGlassTooltip(button,immediate=false){hideGlassTooltip();if(!button||button.disabled)return;const text=button.dataset.tooltip||button.getAttribute('aria-label');if(!text)return;tooltipTarget=button;tooltipTimer=setTimeout(()=>{if(!button.isConnected||button.disabled)return;const box=button.getBoundingClientRect();if(!box.width)return;const tip=$('glass-tooltip');tip.textContent=text;tip.hidden=false;const rect=tip.getBoundingClientRect();tip.style.left=Math.max(8,Math.min(innerWidth-rect.width-8,box.left+box.width/2-rect.width/2))+'px';tip.style.top=(box.bottom+rect.height+14<innerHeight?box.bottom+9:Math.max(8,box.top-rect.height-9))+'px';button.setAttribute('aria-describedby','glass-tooltip');animateElement(tip,[{opacity:0,translate:'0 -4px'},{opacity:1,translate:'0 0'}],{duration:180})},immediate?0:350)}

function renderSelection(){
 const visible=new Set(matches().map(photo=>photo.id));for(const id of state.selected)if(!visible.has(id))state.selected.delete(id);
 const available=!['trash','settings'].includes(state.route)&&(state.route!=='albums'||!!state.album)&&(state.route!=='photos'||state.period==='all')&&visible.size>0;
 if(!available){state.selecting=false;state.selected.clear()}
 $('app').classList.toggle('is-selecting',state.selecting);
 const mode=document.querySelector('[data-action="select-mode"]');mode.hidden=!available;mode.textContent=state.selecting?'Cancelar':'Seleccionar';mode.setAttribute('aria-pressed',String(state.selecting));
 const all=document.querySelector('[data-action="select-all"]');all.hidden=!state.selecting;all.textContent=state.selected.size===visible.size?'Deseleccionar':'Seleccionar todas';
 $('selection-count').textContent=state.selected.size?state.selected.size+' seleccionada'+(state.selected.size===1?'':'s'):state.selecting?'Selecciona fotos':'';
 $('bulk-actions').hidden=!state.selected.size;
 for(const card of $('library').querySelectorAll('.photo-card')){const id=card.querySelector('[data-photo]').dataset.photo;card.classList.toggle('is-selected',state.selected.has(id));let button=card.querySelector('.select-photo');if(!button){button=document.createElement('button');button.className='select-photo';button.dataset.select=id;button.innerHTML=icon('check');card.append(button)}const photo=photos.find(item=>item.id===id);button.setAttribute('aria-pressed',String(state.selected.has(id)));button.setAttribute('aria-label',(state.selected.has(id)?'Deseleccionar ':'Seleccionar ')+photo.name);button.hidden=!available}
 for(const image of $('sidebar-albums').querySelectorAll('img')){const holder=document.createElement('span');holder.innerHTML=icon('albums');image.replaceWith(holder.firstElementChild)}
}
function toggleSelection(id){state.selecting=true;if(state.selected.has(id))state.selected.delete(id);else state.selected.add(id);renderSelection();const target=document.querySelector('[data-select="'+id+'"]');if(target&&state.selected.has(id))animateElement(target,[{transform:'scale(.7)'},{transform:'scale(1.12)',offset:.65},{transform:'scale(1)'}],{duration:230})}

function renderContext(){const chips=[];if(state.datePrefix)chips.push(['clear-date',monthText(state.datePrefix)]);else if(state.year)chips.push(['clear-date',state.year]);if(state.filter!=='all')chips.push(['clear-filter',({landscape:'Paisajes',city:'Ciudad',imported:'Añadidas por ti'})[state.filter]]);if($('search').value.trim())chips.push(['clear-search','Buscar: '+$('search').value.trim()]);$('active-context').hidden=!chips.length||state.route==='settings';$('app').classList.toggle('has-context',!$('active-context').hidden);$('active-context').innerHTML=chips.map(([action,label])=>'<button class="context-chip" data-action="'+action+'" aria-label="Quitar filtro: '+escapeText(label)+'"><span>'+escapeText(label)+'</span>'+icon('close')+'</button>').join('');const filterButton=document.querySelector('[data-action="filter"]');filterButton.classList.toggle('is-active',state.filter!=='all'||state.sort!=='newest')}
function render({motion=false}={}){const focused=document.activeElement;const key=['photo','favorite','album'].find(name=>focused?.dataset?.[name]);const value=key?focused.dataset[key]:null;hideGlassTooltip();renderContent();prepareImages();prepareServerImages();prepareHoverDetails();renderContext();renderSelection();queuePeriodGlass();if(focused&&!focused.isConnected){const replacement=key?document.querySelector('[data-'+key+'="'+CSS.escape(value)+'"]'):null;(replacement||$('content')).focus({preventScroll:true})}if(motion)animateLibrary()}
async function closeDialog(dialog){if(!dialog.open||dialog.classList.contains('closing'))return;dialog.classList.add('closing');const animation=animateElement(dialog.classList.contains('viewer')?dialog.querySelector('.viewer-layout'):dialog,[{opacity:1,transform:'none'},{opacity:0,transform:dialog.classList.contains('viewer')?'scale(.975)':'translateY(7px) scale(.985)'}],{duration:160,easing:'ease-in'});if(animation)await animation.finished.catch(()=>{});dialog.close();dialog.classList.remove('closing')}
function showShortcuts(){showInfo('Atajos de teclado','<div class="shortcut-row"><span>Buscar en la fototeca</span><kbd class="keyboard-key">/</kbd></div><div class="shortcut-row"><span>Foto anterior / siguiente</span><span><kbd class="keyboard-key">←</kbd> <kbd class="keyboard-key">→</kbd></span></div><div class="shortcut-row"><span>Marcar como favorita en el visor</span><kbd class="keyboard-key">F</kbd></div><div class="shortcut-row"><span>Cerrar ventana o limpiar búsqueda</span><kbd class="keyboard-key">Esc</kbd></div>')}
function notify(text,undo=null){$('toast').replaceChildren(document.createTextNode(text));pendingUndo=undo;if(undo){const button=document.createElement('button');button.textContent='Deshacer';button.dataset.action='undo';$('toast').append(button)}$('toast').hidden=false;animateElement($('toast'),[{opacity:0,translate:'0 12px'},{opacity:1,translate:'0 0'}],{duration:260});clearTimeout(toastTimer);toastTimer=setTimeout(()=>{$('toast').hidden=true;pendingUndo=null},undo?7000:4200)}
function dateText(value){return new Date(value+'T12:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'})}
function dateCompact(value){return new Date(value+'T12:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'})}
function monthText(value){return new Date(value+'-01T12:00:00').toLocaleDateString('es-ES',{month:'long',year:'numeric'})}
function setTheme(value){window.SantolvShell.setTheme(value)}
function matches(){const query=$('search').value.trim().toLocaleLowerCase('es');return photos.filter(p=>(state.route==='trash'?p.deleted:!p.deleted)&&(state.route!=='favorites'||p.favorite)&&(state.route!=='imports'||p.imported)&&(!state.album||p.album===state.album)&&(!state.datePrefix||p.date.startsWith(state.datePrefix))&&(!state.year||p.date.startsWith(state.year))&&(state.filter==='all'||state.filter==='imported'&&p.imported||p.category===state.filter)&&(!query||(p.name+' '+p.place).toLocaleLowerCase('es').includes(query))).sort((a,b)=>state.sort==='name'?a.name.localeCompare(b.name,'es'):state.sort==='oldest'?a.date.localeCompare(b.date):b.date.localeCompare(a.date))}
function empty(title,text,action=''){return '<div class="empty">'+icon(state.route==='trash'?'trash':state.route==='favorites'?'heart':'photos')+'<h2>'+escapeText(title)+'</h2><p>'+escapeText(text)+'</p>'+action+'</div>'}
function pageHeading(title,subtitle){return '<div class="page-heading"><div><h1>'+escapeText(title)+'</h1><p>'+escapeText(subtitle)+'</p></div></div>'}
function photoMarkup(photo){return '<article class="photo-card"><button class="photo-open" data-photo="'+photo.id+'" aria-label="Abrir '+escapeText(photo.name)+'"><img data-media="'+photo.id+'" '+(photo.src?'src="'+escapeText(photo.src)+'"':'')+' alt="'+escapeText(photo.alt)+'" width="600" height="600" loading="lazy" decoding="async">'+(photo.favorite?'<span class="favorite-mark">'+icon('heart')+'</span>':'')+'</button><button class="photo-action" data-'+(photo.deleted?'restore':'favorite')+'="'+photo.id+'" aria-label="'+(photo.deleted?'Restaurar ':photo.favorite?'Quitar de favoritos: ':'Añadir a favoritos: ')+escapeText(photo.name)+'" '+(!photo.deleted?'aria-pressed="'+photo.favorite+'"':'')+'>'+icon(photo.deleted?'restore':'heart')+'</button></article>'}
function renderContent(){
 const titles={photos:'Fototeca',albums:state.album?albums.find(a=>a.id===state.album)?.name:'Colecciones',favorites:'Favoritos',imports:'Importaciones',trash:'Eliminado recientemente',settings:'Ajustes'};
 const rows=matches(),album=albums.find(a=>a.id===state.album),isTimeline=state.route==='photos'&&state.period!=='all';
 const isGrid=!['settings'].includes(state.route)&&(state.route!=='albums'||!!album)&&!isTimeline&&rows.length>0;
 $('app').classList.toggle('non-library',!isGrid);
 $('window-title').textContent=titles[state.route];document.title=titles[state.route]+' · SantolvPhotos';
 const dates=rows.map(photo=>photo.date).sort();
 $('window-subtitle').textContent=rows.length?dateCompact(dates[0])+' – '+dateCompact(dates.at(-1)):'Biblioteca del servidor';
 if(state.route==='settings')$('window-subtitle').textContent='SantolvPhotos';
 if(state.route==='albums'&&!album)$('window-subtitle').textContent='Tus álbumes';
 $('periods').hidden=state.route!=='photos';document.querySelector('.zoom-control').hidden=!isGrid;
 document.querySelector('[data-action="filter"]').disabled=['settings','albums'].includes(state.route)&&!album;
 document.querySelectorAll('[data-period]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.period===state.period)));
 document.querySelectorAll('[data-route]').forEach(link=>{if(link.dataset.route===state.route)link.setAttribute('aria-current','page');else link.removeAttribute('aria-current')});
 $('photo-count').textContent=photos.filter(p=>!p.deleted).length;$('favorite-count').textContent=photos.filter(p=>p.favorite&&!p.deleted).length;
 $('sidebar-albums').innerHTML=albums.map(a=>'<button class="album-link" data-album="'+a.id+'" '+(a.id===state.album?'aria-current="page"':'')+'>'+icon('albums')+'<span>'+escapeText(a.name)+'</span></button>').join('');
 if(state.route==='settings'){renderSettings();$('library-count').textContent='Preferencias de SantolvPhotos';return}
 if(state.route==='albums'&&!album){
  const query=$('search').value.trim().toLocaleLowerCase('es'),visible=albums.filter(a=>a.name.toLocaleLowerCase('es').includes(query));
  $('library').innerHTML='<div class="page-content">'+pageHeading('Colecciones','Cada historia tiene su lugar.')+'<button class="button primary" data-action="new-album">Nuevo álbum</button>'+(visible.length?'<div class="album-grid">'+visible.map(a=>'<button class="album-cover" data-album="'+a.id+'"><span aria-hidden="true">'+icon('albums')+'</span><strong>'+escapeText(a.name)+'</strong><small>'+photos.filter(p=>p.album===a.id&&!p.deleted).length+' fotos</small></button>').join('')+'</div>':empty('No hay colecciones con ese nombre','Prueba con otra búsqueda.'))+'</div>';$('library-count').textContent=visible.length+' colecciones';return;
 }
 $('library-count').textContent=rows.length+' '+(rows.length===1?'foto':'fotos');
 if(!rows.length){$('library').innerHTML=empty(state.route==='trash'?'No hay fotos eliminadas':state.route==='favorites'?'Aquí estarán tus favoritos':state.route==='imports'?'Tus fotos, cuando quieras':'No se han encontrado fotos',state.route==='trash'?'Las fotos que retires de la fototeca aparecerán aquí.':state.route==='favorites'?'Marca el corazón de una foto para guardarla en esta colección.':state.route==='imports'?'Sube fotos para guardarlas en tu cuenta.':'Prueba otra búsqueda o cambia los filtros.',state.route==='imports'?'<button class="button primary" data-action="import">'+icon('upload')+'Importar fotos</button>':'');return}
 if(isTimeline){
  const buckets=new Map();for(const photo of rows){const key=photo.date.slice(0,state.period==='years'?4:7);if(!buckets.has(key))buckets.set(key,[]);buckets.get(key).push(photo)}
  $('library').innerHTML='<div class="page-content">'+(state.year?'<button class="back" data-action="all-years">'+icon('arrow')+'Todos los años</button>':'')+pageHeading(state.period==='years'?'Años':state.year||'Meses','Tu fototeca, a través del tiempo.')+'<div class="period-grid">'+[...buckets].map(([key,items])=>'<button class="period-card" data-bucket="'+key+'"><img data-media="'+items[0].id+'" '+(items[0].src?'src="'+escapeText(items[0].src)+'"':'')+' alt="" width="800" height="500" loading="lazy"><span class="period-copy"><strong>'+escapeText(state.period==='years'?key:monthText(key))+'</strong><small>'+items.length+' fotos</small></span></button>').join('')+'</div></div>';return;
 }
 $('library').innerHTML='<div class="photo-grid">'+rows.map(photoMarkup).join('')+'</div>';
}
function route(){const [requested,albumId]=location.hash.replace(/^#\/?/,'').split('/');state.route=['photos','albums','favorites','imports','trash','settings'].includes(requested)?requested:'photos';state.album=state.route==='albums'&&albums.some(a=>a.id===albumId)?albumId:null;state.filter='all';state.datePrefix='';state.year='';state.selecting=false;state.selected.clear();$('search').value='';$('content').scrollTop=0;$('app').classList.remove('mobile-sidebar');render({motion:true})}
function openViewer(id){state.viewerIds=matches().map(p=>p.id);state.viewerId=id;if(photoSpace)photoApi('/nodes/'+id+'/touch',{method:'POST'}).catch(()=>{});pendingFocus=document.activeElement;updateViewer();$('viewer').showModal();animateElement($('viewer').querySelector('.viewer-layout'),[{opacity:0},{opacity:1}],{duration:260});animateElement($('viewer-image'),[{opacity:0,transform:'scale(.94)'},{opacity:1,transform:'none'}],{duration:420})}
function updateViewer(direction=0){const photo=photos.find(p=>p.id===state.viewerId);if(!photo)return;const image=$('viewer-image');const changed=image.getAttribute('src')!==photo.src;if(changed){state.zoom=false;$('viewer-stage').classList.remove('zoomed');const zoom=document.querySelector('[data-action="zoom"]');zoom.setAttribute('aria-pressed','false');zoom.setAttribute('aria-label','Ampliar imagen');if(photo.src)image.src=photo.src;else{image.removeAttribute('src');imageUrl(photo).then(url=>{if(state.viewerId===photo.id)image.src=url}).catch(showPhotoError)}image.alt=photo.alt;if($('viewer').open)animateElement(image,[{opacity:0,transform:'translateX('+(direction*24)+'px) scale(.99)'},{opacity:1,transform:'none'}],{duration:300})}$('viewer-name').textContent=photo.name;$('viewer-meta').textContent=dateText(photo.date)+' · '+'Fecha de subida · Servidor';$('viewer-position').textContent=(state.viewerIds.indexOf(photo.id)+1)+' de '+state.viewerIds.length+' · ← → Navegar · F Favorito · Esc Cerrar';const favorite=document.querySelector('[data-action="viewer-favorite"]');favorite.classList.toggle('is-favorite',photo.favorite);favorite.setAttribute('aria-pressed',String(photo.favorite));favorite.setAttribute('aria-label',photo.favorite?'Quitar de favoritos':'Añadir a favoritos');document.querySelector('[data-action="viewer-trash"]').hidden=photo.deleted}
function stepViewer(direction){const index=state.viewerIds.indexOf(state.viewerId);state.viewerId=state.viewerIds[(index+direction+state.viewerIds.length)%state.viewerIds.length];updateViewer(direction)}
function showInfo(title,body){$('info-title').textContent=title;$('info-body').innerHTML=body;if(!$('info-dialog').open)$('info-dialog').showModal();animateElement($('info-dialog'),[{opacity:0,transform:'translateY(10px) scale(.975)'},{opacity:1,transform:'none'}],{duration:250})}
function openFilters(){showInfo('Filtrar y ordenar','<label>Mostrar<select id="filter-kind"><option value="all">Todas las fotos</option><option value="landscape">Paisajes</option><option value="city">Ciudad</option><option value="imported">Añadidas por ti</option></select></label><label>Orden<select id="sort-kind"><option value="newest">Más recientes primero</option><option value="oldest">Más antiguas primero</option><option value="name">Por nombre</option></select></label><button class="button primary" data-action="close-info">Listo</button>');$('filter-kind').value=state.filter;$('sort-kind').value=state.sort;$('filter-kind').addEventListener('change',event=>{state.filter=event.target.value;render()});$('sort-kind').addEventListener('change',event=>{state.sort=event.target.value;render()})}
function thumbnailSize(value){const cards=[...$('library').querySelectorAll('.photo-card')];for(const card of cards)runningMotion.get(card)?.cancel();const before=cards.map(card=>card.getBoundingClientRect());$('thumbnail-size').value=String(Math.min(300,Math.max(120,value)));document.documentElement.style.setProperty('--thumb',$('thumbnail-size').value+'px');if(reducedMotion.matches)return;const after=cards.map(card=>card.getBoundingClientRect());const viewport=$('content').getBoundingClientRect();cards.forEach((card,index)=>{const from=before[index],to=after[index];if(!to.width||to.top>viewport.bottom||to.bottom<viewport.top)return;animateElement(card,[{transformOrigin:'0 0',transform:'translate('+(from.left-to.left)+'px,'+(from.top-to.top)+'px) scale('+(from.width/to.width)+','+(from.height/to.height)+')'},{transformOrigin:'0 0',transform:'none'}],{duration:300})})}
document.addEventListener('click',async event=>{
 const target=event.target.closest('button,[data-album]');if(!target)return;
 if(target.dataset.album){location.hash='/albums/'+target.dataset.album;return}
 if(target.dataset.period){state.period=target.dataset.period;state.datePrefix='';state.year='';$('content').scrollTop=0;render({motion:true});return}
 if(target.dataset.bucket){if(state.period==='years'){state.year=target.dataset.bucket;state.period='months'}else{state.datePrefix=target.dataset.bucket;state.period='all'}$('content').scrollTop=0;render({motion:true});return}
 if(target.dataset.select){toggleSelection(target.dataset.select);return}if(target.dataset.photo){if(state.selecting||event.ctrlKey||event.metaKey||event.shiftKey){state.selecting=true;toggleSelection(target.dataset.photo)}else openViewer(target.dataset.photo);return}
 if(target.dataset.favorite){toggleFavorite(target.dataset.favorite);return}
 if(target.dataset.restore){await restorePhoto(target.dataset.restore);return}
 const action=target.dataset.action;
 if(action==='select-mode'){state.selecting=!state.selecting;state.selected.clear();renderSelection()}
 if(action==='select-all'){const visible=matches();if(state.selected.size===visible.length)state.selected.clear();else state.selected=new Set(visible.map(photo=>photo.id));renderSelection()}
 if(action==='selection-favorite')await bulkPhoto('favorite');
 if(action==='selection-trash')await bulkPhoto('trash');
 if(action==='import')$('file-input').click();
 if(action==='filter')openFilters();
 if(action==='smaller')thumbnailSize(Number($('thumbnail-size').value)-20);if(action==='larger')thumbnailSize(Number($('thumbnail-size').value)+20);
 if(action==='all-years'){state.year='';state.datePrefix='';state.period='years';render({motion:true})}
 if(action==='theme'){const dark=document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);setTheme(dark?'light':'dark');if(state.route==='settings')renderSettings();notify('Tema '+(dark?'claro':'oscuro'))}
 if(action==='about')showInfo('SantolvPhotos','<p>Tu biblioteca está conectada al backend compartido de Santolv.</p><p>Favoritos, álbumes, originales y papelera se conservan en tu cuenta.</p>');
 if(action==='new-album')await createAlbum();
 if(action==='close-info')await closeDialog($('info-dialog'));if(action==='close-viewer')await closeDialog($('viewer'));
 if(action==='shortcuts')showShortcuts();
 if(action==='clear-date'){state.year='';state.datePrefix='';render({motion:true})}
 if(action==='clear-filter'){state.filter='all';render({motion:true})}
 if(action==='clear-search'){$('search').value='';render({motion:true});$('search').focus()}
 if(action==='undo'&&pendingUndo){const undo=pendingUndo;pendingUndo=null;undo();notify('Acción deshecha.')}
 if(action==='next')stepViewer(1);if(action==='previous')stepViewer(-1);if(action==='viewer-favorite')toggleFavorite(state.viewerId);
 if(action==='zoom'){state.zoom=!state.zoom;$('viewer-stage').classList.toggle('zoomed',state.zoom);target.setAttribute('aria-pressed',String(state.zoom));target.setAttribute('aria-label',state.zoom?'Ajustar imagen a la ventana':'Ampliar imagen')}
 if(action==='viewer-trash')await trashPhoto();
});
$('viewer').addEventListener('close',()=>{const photoId=pendingFocus?.dataset.photo;render();const origin=photoId?document.querySelector('[data-photo="'+photoId+'"]'):null;if(origin)origin.focus({preventScroll:true});else $('content').focus({preventScroll:true})});
$('viewer-image').addEventListener('error',()=>notify('No se ha podido previsualizar esta imagen. Prueba otro formato.'));
$('search').addEventListener('input',render);$('thumbnail-size').addEventListener('input',event=>thumbnailSize(Number(event.target.value)));$('file-input').addEventListener('change',event=>importFiles(event.target.files));window.addEventListener('hashchange',route);
document.querySelector('.skip').addEventListener('click',event=>{event.preventDefault();$('content').focus()});
document.addEventListener('keydown',event=>{if($('info-dialog').open)return;if($('viewer').open){if($('viewer').classList.contains('closing'))return;if(event.key==='ArrowRight'){event.preventDefault();stepViewer(1)}if(event.key==='ArrowLeft'){event.preventDefault();stepViewer(-1)}if(event.key.toLowerCase()==='f'&&!event.ctrlKey&&!event.metaKey&&!event.repeat){event.preventDefault();toggleFavorite(state.viewerId)}return}if(event.key==='Escape'&&$('search').value){$('search').value='';render({motion:true});$('search').focus()}if(event.key==='/'&&!event.ctrlKey&&!event.metaKey&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){event.preventDefault();$('search').focus()}});
for(const dialog of [$('viewer'),$('info-dialog')])dialog.addEventListener('cancel',event=>{event.preventDefault();closeDialog(dialog)});
$('viewer-image').addEventListener('click',()=>document.querySelector('[data-action="zoom"]').click());
$('content').addEventListener('scroll',()=>{$('app').classList.toggle('is-scrolled',$('content').scrollTop>40)},{passive:true});
reducedMotion.addEventListener('change',()=>{if(reducedMotion.matches)for(const animation of document.getAnimations?.()||[])animation.cancel()});
document.addEventListener('dragenter',event=>{if(!event.dataTransfer?.types.includes('Files'))return;event.preventDefault();dragDepth++;$('drop-hint').hidden=false});document.addEventListener('dragover',event=>{if(event.dataTransfer?.types.includes('Files'))event.preventDefault()});document.addEventListener('dragleave',()=>{dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)$('drop-hint').hidden=true});document.addEventListener('drop',event=>{if(!event.dataTransfer?.files.length)return;event.preventDefault();dragDepth=0;$('drop-hint').hidden=true;if($('viewer').open||$('info-dialog').open){notify('Cierra la ventana antes de añadir fotos.');return}importFiles(event.dataTransfer.files)});

$('periods').addEventListener('pointerover',event=>{if(event.pointerType==='touch')return;pointPeriodGlass(event.target.closest('[data-period]'))});
$('periods').addEventListener('pointerleave',()=>{delete $('periods').dataset.hovering});
$('periods').addEventListener('focusin',event=>pointPeriodGlass(event.target.closest('[data-period]')));
$('periods').addEventListener('focusout',event=>{if(!$('periods').contains(event.relatedTarget))delete $('periods').dataset.hovering});
$('periods').addEventListener('keydown',event=>{const buttons=[...$('periods').querySelectorAll('[data-period]')],index=buttons.indexOf(document.activeElement);if(index<0)return;let next;if(event.key==='ArrowRight')next=(index+1)%buttons.length;else if(event.key==='ArrowLeft')next=(index+buttons.length-1)%buttons.length;else if(event.key==='Home')next=0;else if(event.key==='End')next=buttons.length-1;else return;event.preventDefault();buttons[next].focus();buttons[next].click()});
document.addEventListener('pointerover',event=>{if(event.pointerType==='touch')return;const button=event.target.closest('.icon-btn,.sidebar-button,.select-mode-button');if(button&&!button.contains(event.relatedTarget))showGlassTooltip(button)});
document.addEventListener('pointerout',event=>{if(tooltipTarget&&!tooltipTarget.contains(event.relatedTarget))hideGlassTooltip()});
document.addEventListener('focusin',event=>{const button=event.target.closest('.icon-btn,.sidebar-button,.select-mode-button');if(button)showGlassTooltip(button,true)});
document.addEventListener('focusout',event=>{if(tooltipTarget===event.target)hideGlassTooltip()});
document.addEventListener('pointerdown',hideGlassTooltip);
document.addEventListener('pointermove',event=>{if(reducedMotion.matches||event.pointerType==='touch'||reflectionFrame)return;const target=event.target.closest('.icon-btn,.sidebar-button,.select-mode-button');if(!target)return;const x=event.clientX,y=event.clientY;reflectionFrame=requestAnimationFrame(()=>{reflectionFrame=0;if(!target.isConnected)return;const rect=target.getBoundingClientRect();target.style.setProperty('--shine-x',(x-rect.left)+'px');target.style.setProperty('--shine-y',(y-rect.top)+'px')})},{passive:true});
$('content').addEventListener('scroll',hideGlassTooltip,{passive:true});
window.addEventListener('resize',()=>{hideGlassTooltip();queuePeriodGlass()},{passive:true});
if(typeof ResizeObserver==='function'){const glassObserver=new ResizeObserver(queuePeriodGlass);glassObserver.observe($('periods'))}
if(document.fonts?.ready)document.fonts.ready.then(queuePeriodGlass);


const API_ORIGIN=location.protocol==='https:'?location.origin:'http://localhost:8443';
let csrf='',photoSpace=null,libraryCursor=null,photoBusy=false,mediaTail=Promise.resolve(),mediaGeneration=0;
const mediaUrls=new Map(),mediaRequests=new Map();
async function photoApi(path,{method='GET',body,headers={}}={}){
 const h=new Headers(headers);if(method!=='GET'){h.set('X-CSRF-Token',csrf);h.set('Idempotency-Key',crypto.randomUUID())}
 if(body!==undefined&&!(body instanceof Blob)&&!(body instanceof ArrayBuffer)){h.set('Content-Type','application/json');body=JSON.stringify(body)}
 const response=await fetch(API_ORIGIN+'/api/v1'+path,{method,body,headers:h,credentials:'include'});

 const data=response.status===204?null:await response.json();
 if(response.status===401||['password_change_required','service_forbidden','service_disabled','service_not_installed'].includes(data?.error?.code)){leavePhotos();throw new Error('Vuelve a Inicio para continuar.')}
 if(!response.ok)throw new Error(({quota_exceeded:'No queda espacio disponible.',name_already_exists:'Ya existe una foto con ese nombre.',revision_changed:'La foto ha cambiado. Actualiza la biblioteca.',workspace_sync_pending:'El servidor está organizando las carpetas. Vuelve a intentarlo.'})[data?.error?.code]||data?.error?.code||'No se pudo completar la operación.');return data
}
function leavePhotos(){clearMedia();photos.length=0;albums.length=0;document.body.hidden=true;location.replace('/')}
function clearMedia(){mediaGeneration++;for(const url of mediaUrls.values())URL.revokeObjectURL(url);mediaUrls.clear()}
async function loadLibrary(append=false){
 const data=await photoApi('/photos/library'+(append&&libraryCursor?'?after='+encodeURIComponent(libraryCursor):''));
 if(!append){photos.length=0;albums.length=0}
 for(const item of data.items){if(item.kind==='folder'){if(!item.deleted)albums.push({...item,eyebrow:'Álbum',cover:''});continue}photos.push({...item,src:mediaUrls.get(item.id)||'',alt:item.name,place:'Fecha de subida',category:'imported',imported:true})}
 libraryCursor=data.next_cursor;const albumId=location.hash.replace(/^#\/?/,'').split('/')[1];if(state.route==='albums'&&albums.some(a=>a.id===albumId))state.album=albumId;render();$('load-more').hidden=!libraryCursor;
}
function showPhotoError(error){notify(error.message||'No se pudo completar la operación.')}
async function beginPhotos(){try{const me=await photoApi('/me');csrf=me.csrf_token||'';if(me.must_change_password){leavePhotos();return}window.SantolvShell?.session(me.expires_at);photoSpace=(await photoApi('/photos/space',{method:'POST'})).id;document.querySelector('.side-note').textContent=me.username+' · Conectado';window.SantolvShell?.account(me.username,{logout:endPhotosSession,switch:endPhotosSession});await loadLibrary();
 const params=new URLSearchParams(location.search),requested=params.get('photo')||params.get('album');if(requested){const data=await photoApi('/photos/library?id='+encodeURIComponent(requested));const item=data.items[0];if(item&&!item.deleted){if(item.kind==='folder'){if(!albums.some(a=>a.id===item.id))albums.push({...item,eyebrow:'Álbum',cover:''});location.hash='/albums/'+item.id}else{if(!photos.some(p=>p.id===item.id))photos.push({...item,src:'',alt:item.name,place:'Fecha de subida',category:'imported',imported:true});render();openViewer(item.id)}}}
 }catch(error){$('library').textContent='No se pudo conectar con tu biblioteca.';showPhotoError(error)}}

async function endPhotosSession(){if(photoBusy)throw new Error('Espera a que termine la operación de Fotos.');await photoApi('/auth/logout',{method:'POST'});window.SantolvShell?.sessionEnded();leavePhotos()}
function imageUrl(photo){if(mediaUrls.has(photo.id))return Promise.resolve(mediaUrls.get(photo.id));if(mediaRequests.has(photo.id))return mediaRequests.get(photo.id);
 const generation=mediaGeneration;const request=mediaTail.then(async()=>{if(generation!==mediaGeneration)throw new Error('Carga cancelada.');const r=await fetch(API_ORIGIN+'/api/v1/nodes/'+photo.id+'/content',{credentials:'include'});if(r.status===401){leavePhotos();throw new Error('Sesión caducada.')}if(!r.ok)throw new Error('No se pudo cargar '+photo.name);if(Number(r.headers.get('content-length'))>30*1024*1024){await r.body.cancel();throw new Error('La previsualización admite originales de hasta 30 MiB.')}const mime=({'jpg':'image/jpeg','jpeg':'image/jpeg','png':'image/png','webp':'image/webp','gif':'image/gif','avif':'image/avif'})[photo.name.split('.').at(-1).toLowerCase()];const url=URL.createObjectURL(new Blob([await r.arrayBuffer()],{type:mime}));if(generation!==mediaGeneration){URL.revokeObjectURL(url);throw new Error('Carga cancelada.')}mediaUrls.set(photo.id,url);photo.src=url;while(mediaUrls.size>8){const [oldId,oldUrl]=mediaUrls.entries().next().value;mediaUrls.delete(oldId);URL.revokeObjectURL(oldUrl);const old=photos.find(p=>p.id===oldId);if(old)old.src=''}return url}).finally(()=>mediaRequests.delete(photo.id));mediaTail=request.catch(()=>{});mediaRequests.set(photo.id,request);return request;
}
const imageObserver=new IntersectionObserver(entries=>{for(const entry of entries){if(!entry.isIntersecting)continue;const image=entry.target;imageObserver.unobserve(image);const photo=photos.find(p=>p.id===image.dataset.media);if(photo&&!photo.deleted)imageUrl(photo).then(url=>{if(image.isConnected)image.src=url}).catch(()=>image.closest('.photo-open')?.classList.add('is-error'))}},{root:$('content'),rootMargin:'200px'});
function prepareServerImages(){imageObserver.disconnect();for(const image of $('library').querySelectorAll('img[data-media]'))imageObserver.observe(image)}
async function persistPhoto(photo,action,value){if(!photo||photoBusy)return false;photoBusy=true;try{const result=await photoApi(action==='favorite'?'/photos/'+photo.id+'/favorite':'/nodes/'+photo.id+'/'+action,{method:action==='favorite'?'PUT':'POST',body:action==='favorite'?{favorite:value}:undefined,headers:{'If-Match':'"'+photo.revision+'"'}});photo.revision=result.revision;if(action==='favorite')photo.favorite=value;else photo.deleted=action==='trash';render();if($('viewer').open)updateViewer();return true}catch(error){showPhotoError(error);await loadLibrary().catch(showPhotoError);return false}finally{photoBusy=false}}
async function toggleFavorite(id){const photo=photos.find(p=>p.id===id);if(photo)await persistPhoto(photo,'favorite',!photo.favorite)}
async function bulkPhoto(action){for(const id of [...state.selected]){const photo=photos.find(p=>p.id===id);if(!await persistPhoto(photo,action,true))break}state.selected.clear();state.selecting=false;render()}
async function trashPhoto(){const photo=photos.find(p=>p.id===state.viewerId);if(await persistPhoto(photo,'trash')){await closeDialog($('viewer'));notify('Foto guardada en la papelera del servidor.')}}
async function restorePhoto(id){if(await persistPhoto(photos.find(p=>p.id===id),'restore'))notify('Foto restaurada.')}
const sha256=async buffer=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',buffer)),b=>b.toString(16).padStart(2,'0')).join('');
async function uploadPhoto(file){
 // shortcut: browser hashing buffers one image (30 MiB max); use streaming hashing for larger originals.
 const buffer=await file.arrayBuffer();const upload=await photoApi('/uploads',{method:'POST',body:{space_id:photoSpace,parent_id:state.album,name:file.name,size:file.size,sha256:await sha256(buffer)}});
 let accepted=false;try{for(let offset=0;offset<file.size;offset+=1024*1024){const chunk=buffer.slice(offset,offset+1024*1024);await photoApi('/uploads/'+upload.id+'/content',{method:'PATCH',body:chunk,headers:{'Content-Type':'application/octet-stream','Upload-Offset':String(offset),'X-Chunk-SHA256':await sha256(chunk)}});notify('Subiendo '+file.name+' · '+Math.min(100,Math.round((offset+chunk.byteLength)/file.size*100))+'%')}
 await photoApi('/uploads/'+upload.id+'/complete',{method:'POST'});accepted=true;
 for(let attempt=0;attempt<120;attempt++){const status=await photoApi('/uploads/'+upload.id);if(status.state==='ready')return;if(status.completion_error)throw new Error(status.completion_error);await new Promise(resolve=>setTimeout(resolve,500))}
 throw new Error('El servidor sigue procesando '+file.name+'. Actualiza la biblioteca para comprobar el resultado.');
 }catch(error){if(!accepted)await photoApi('/uploads/'+upload.id,{method:'DELETE'}).catch(()=>{});throw error}
}
async function importFiles(files){if(photoBusy||!photoSpace)return;photoBusy=true;let added=0;try{for(const file of files){if(!/^image\/(jpeg|png|webp|gif|avif)$/.test(file.type)||!file.size||file.size>30*1024*1024){notify(file.name+': admite JPEG, PNG, WebP, GIF o AVIF de hasta 30 MiB.');continue}await uploadPhoto(file);added++}if(added)notify(added+' '+(added===1?'foto guardada':'fotos guardadas')+' en el servidor.')}catch(error){showPhotoError(error)}finally{photoBusy=false;$('file-input').value='';await loadLibrary().catch(showPhotoError)}}
async function createAlbum(){if(!photoSpace)return notify('Espera a que se conecte la biblioteca.');showInfo('Nuevo álbum','<form id="album-form"><label>Nombre<input id="album-name" required maxlength="255" autocomplete="off"></label><button class="button primary">Crear álbum</button></form>');$('album-form').addEventListener('submit',async event=>{event.preventDefault();const button=event.target.querySelector('button');button.disabled=true;try{await photoApi('/spaces/'+photoSpace+'/nodes',{method:'POST',body:{name:$('album-name').value,parent_id:null}});await closeDialog($('info-dialog'));await loadLibrary()}catch(error){showPhotoError(error)}finally{button.disabled=false}})}
function renderSettings(){const theme=window.SantolvShell.preference();$('library').innerHTML='<div class="page-content settings">'+pageHeading('Ajustes','Tu fototeca, a tu manera.')+'<h2>Apariencia</h2><div class="group"><label class="setting-row">Tema<select id="theme-select" data-shell-theme-select><option value="system">Según el sistema</option><option value="light">Claro</option><option value="dark">Oscuro</option></select></label></div><h2>Biblioteca</h2><p>Conectada al servidor Santolv. Favoritos, álbumes, fotos y papelera se guardan en tu cuenta.</p><p>Las fechas corresponden a la subida. La búsqueda abarca las fotos cargadas; usa Cargar más para continuar.</p><p>Esta versión muestra originales JPEG, PNG, WebP, GIF y AVIF de hasta 30 MiB. Las miniaturas derivadas, EXIF y vídeo quedan pendientes.</p></div>';$('theme-select').value=theme;$('theme-select').addEventListener('change',event=>setTheme(event.target.value))}
$('load-more').addEventListener('click',async()=>{const button=$('load-more');button.disabled=true;try{await loadLibrary(true)}catch(error){showPhotoError(error)}finally{button.disabled=false}});
window.addEventListener('pagehide',clearMedia);
window.addEventListener('pageshow',()=>beginPhotos());

route();

</script>
