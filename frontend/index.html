function notify(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,4200)}
function dateText(value){return new Date(value+'T12:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'})}
function dateCompact(value){return new Date(value+'T12:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'})}
function monthText(value){return new Date(value+'-01T12:00:00').toLocaleDateString('es-ES',{month:'long',year:'numeric'})}
function setTheme(value){if(value==='system')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=value;try{localStorage.setItem('santolvphotos.theme',value)}catch{}}

function matches(){const query=$('search').value.trim().toLocaleLowerCase('es');return photos.filter(p=>(state.route==='trash'?p.deleted:!p.deleted)&&(state.route!=='favorites'||p.favorite)&&(state.route!=='imports'||p.imported)&&(!state.album||p.album===state.album)&&(!state.datePrefix||p.date.startsWith(state.datePrefix))&&(!state.year||p.date.startsWith(state.year))&&(state.filter==='all'||state.filter==='imported'&&p.imported||p.category===state.filter)&&(!query||(p.name+' '+p.place).toLocaleLowerCase('es').includes(query))).sort((a,b)=>state.sort==='name'?a.name.localeCompare(b.name,'es'):state.sort==='oldest'?a.date.localeCompare(b.date):b.date.localeCompare(a.date))}
function empty(title,text,action=''){return '<div class="empty">'+icon(state.route==='trash'?'trash':state.route==='favorites'?'heart':'photos')+'<h2>'+escapeText(title)+'</h2><p>'+escapeText(text)+'</p>'+action+'</div>'}

function render(){
 const titles={photos:'Fototeca',albums:state.album?albums.find(a=>a.id===state.album)?.name:'Colecciones',favorites:'Favoritos',imports:'Importaciones',trash:'Eliminado recientemente',settings:'Ajustes'};
 const rows=matches(),album=albums.find(a=>a.id===state.album),isTimeline=state.route==='photos'&&state.period!=='all';
 const isGrid=!['settings'].includes(state.route)&&(state.route!=='albums'||!!album)&&!isTimeline&&rows.length>0;
 $('app').classList.toggle('non-library',!isGrid);
 $('window-title').textContent=titles[state.route];document.title=titles[state.route]+' · SantolvPhotos';

 if(state.route==='albums'&&!album)$('window-subtitle').textContent='Tus álbumes';
 $('periods').hidden=state.route!=='photos';document.querySelector('.zoom-control').hidden=!isGrid;

function renderSettings(){const theme=document.documentElement.dataset.theme||'system';$('library').innerHTML='<div class="page-content settings">'+pageHeading('Ajustes','Tu fototeca, a tu manera.')+'<h2>Apariencia</h2><div class="group"><label class="setting-row"><div><strong>Tema</strong><small>Claro, oscuro o según tu dispositivo.</small></div><select id="theme-select" aria-label="Tema"><option value="system">Según el sistema</option><option value="light">Claro</option><option value="dark">Oscuro</option></select></label><div class="setting-row"><div><strong>Vista de escritorio</strong><small>Inspirada en la fototeca de Fotos para Mac.</small></div><span>SantolvPhotos</span></div></div><h2>Biblioteca</h2><div class="group"><div class="setting-row"><div><strong>Conexión al servidor</strong><small>El backend Rust se conectará en otra fase.</small></div><span>Sin conectar</span></div><div class="setting-row"><div><strong>Fotos de muestra</strong><small>Fechas, nombres y colecciones ficticios.</small></div><span>20 imágenes locales</span></div></div><p class="settings-note">Los favoritos, las importaciones y las fotos eliminadas de esta demo se reinician al recargar. Solo se guarda tu preferencia de tema. La tecnología de las aplicaciones móviles y descargables se decidirá más adelante.</p></div>';$('theme-select').value=theme;$('theme-select').addEventListener('change',event=>setTheme(event.target.value))}
function route(){const [requested,albumId]=location.hash.replace(/^#\/?/,'').split('/');state.route=['photos','albums','favorites','imports','trash','settings'].includes(requested)?requested:'photos';state.album=state.route==='albums'&&albums.some(a=>a.id===albumId)?albumId:null;state.filter='all';state.datePrefix='';state.year='';$('search').value='';$('content').scrollTop=0;$('app').classList.remove('mobile-sidebar');render()}
function openViewer(id){state.viewerIds=matches().map(p=>p.id);state.viewerId=id;pendingFocus=document.activeElement;updateViewer();$('viewer').showModal()}
function updateViewer(){const photo=photos.find(p=>p.id===state.viewerId);if(!photo)return;state.zoom=false;$('viewer-stage').classList.remove('zoomed');const zoom=document.querySelector('[data-action="zoom"]');zoom.setAttribute('aria-pressed','false');zoom.setAttribute('aria-label','Ampliar imagen');$('viewer-image').src=photo.src;$('viewer-image').alt=photo.alt;$('viewer-name').textContent=photo.name;$('viewer-meta').textContent=dateText(photo.date)+' · '+(photo.imported?'Previsualización local':photo.place+' · Foto de muestra');$('viewer-position').textContent=(state.viewerIds.indexOf(photo.id)+1)+' de '+state.viewerIds.length+' · Flechas para navegar · Esc para cerrar';const favorite=document.querySelector('[data-action="viewer-favorite"]');favorite.classList.toggle('is-favorite',photo.favorite);favorite.setAttribute('aria-pressed',String(photo.favorite));favorite.setAttribute('aria-label',photo.favorite?'Quitar de favoritos':'Añadir a favoritos');document.querySelector('[data-action="viewer-trash"]').hidden=photo.deleted}
function stepViewer(direction){const index=state.viewerIds.indexOf(state.viewerId);state.viewerId=state.viewerIds[(index+direction+state.viewerIds.length)%state.viewerIds.length];updateViewer()}
function toggleFavorite(id){const photo=photos.find(p=>p.id===id);if(!photo)return;photo.favorite=!photo.favorite;render();if($('viewer').open)updateViewer();else document.querySelector('[data-favorite="'+id+'"]')?.focus({preventScroll:true})}

document.addEventListener('click',event=>{

 if(action==='theme'){const dark=document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);setTheme(dark?'light':'dark');if(state.route==='settings')renderSettings();notify('Tema '+(dark?'claro':'oscuro'))}
 if(action==='about')showInfo('SantolvPhotos','<p>Una fototeca de escritorio inspirada en la distribución de Fotos para Mac: imágenes protagonistas, barra lateral y controles compactos.</p><ul><li>20 fotografías locales de muestra.</li><li>Vistas por años, meses y todas las fotos.</li><li>Favoritos, colecciones, filtros y visor.</li></ul><p style="margin-top:14px">Esta demostración no está conectada al servidor. Los cambios se reinician al recargar.</p>');

 if(action==='next')stepViewer(1);if(action==='previous')stepViewer(-1);if(action==='viewer-favorite')toggleFavorite(state.viewerId);
 if(action==='zoom'){state.zoom=!state.zoom;$('viewer-stage').classList.toggle('zoomed',state.zoom);target.setAttribute('aria-pressed',String(state.zoom));target.setAttribute('aria-label',state.zoom?'Ajustar imagen a la ventana':'Ampliar imagen')}
 if(action==='viewer-trash'){photos.find(p=>p.id===state.viewerId).deleted=true;$('viewer').close();render();notify('Movida a Eliminado recientemente. Puedes restaurarla allí.')}
});
$('viewer').addEventListener('close',()=>{const photoId=pendingFocus?.dataset.photo;render();const origin=photoId?document.querySelector('[data-photo="'+photoId+'"]'):null;if(origin)origin.focus({preventScroll:true});else $('content').focus({preventScroll:true})});
$('viewer-image').addEventListener('error',()=>notify('No se ha podido previsualizar esta imagen. Prueba otro formato.'));
$('search').addEventListener('input',render);$('thumbnail-size').addEventListener('input',event=>thumbnailSize(Number(event.target.value)));$('file-input').addEventListener('change',event=>importFiles(event.target.files));window.addEventListener('hashchange',route);
document.querySelector('.skip').addEventListener('click',event=>{event.preventDefault();$('content').focus()});
document.addEventListener('keydown',event=>{if($('info-dialog').open)return;if($('viewer').open){if(event.key==='ArrowRight'){event.preventDefault();stepViewer(1)}if(event.key==='ArrowLeft'){event.preventDefault();stepViewer(-1)}return}if(event.key==='/'&&!event.ctrlKey&&!event.metaKey&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){event.preventDefault();$('search').focus()}});
document.addEventListener('dragenter',event=>{if(!event.dataTransfer?.types.includes('Files'))return;event.preventDefault();dragDepth++;$('drop-hint').hidden=false});document.addEventListener('dragover',event=>{if(event.dataTransfer?.types.includes('Files'))event.preventDefault()});document.addEventListener('dragleave',()=>{dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)$('drop-hint').hidden=true});document.addEventListener('drop',event=>{if(!event.dataTransfer?.files.length)return;event.preventDefault();dragDepth=0;$('drop-hint').hidden=true;if($('viewer').open||$('info-dialog').open){notify('Cierra la ventana antes de añadir fotos.');return}importFiles(event.dataTransfer.files)});
window.addEventListener('beforeunload',()=>photos.filter(p=>p.imported).forEach(p=>URL.revokeObjectURL(p.src)));
route();

</script>
</body>
</html>
