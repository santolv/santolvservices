{data}=await api('/uploads/'+job.id,{signal});offset=data.received;confirmed=offset}else throw e}}progress(file.name,'Verificando y guardando el archivo…',file.size,file.size);await api(`/uploads/${job.id}/complete`,{method:'POST',signal});for(let i=0;i<120;i++){if(state.paused)throw new DOMException('Pausado','AbortError');const {data}=await api('/uploads/'+job.id,{signal});if(data.state==='ready'&&data.storage_pending){progress(file.name,'Contenido guardado. Organizando las carpetas del servidor…',file.size,file.size);await new Promise(resolve=>setTimeout(resolve,500));continue}if(data.state==='ready'){clearJob();state.replacement=null;progress(file.name,'Guardado correctamente.',file.size,file.size,true);toast('Archivo guardado.');await refresh();setTimeout(()=>$('upload-panel').hidden=true,2500);return}if(data.completion_error)throw new Error(data.completion_error);if(data.state!=='pending')throw new Error('No se pudo publicar el archivo.');await new Promise(resolve=>setTimeout(resolve,500))}throw new Error('El servidor sigue verificando el archivo. Puedes consultar la subida de nuevo.')}catch(error){progress(file.name,message(error),confirmed,file.size);toast(message(error));if(state.me)chrome()}finally{state.uploading=false;state.paused=false;$('file-input').value=''}}
function setTheme(theme,persist=true){

function closeMenus(){for(const id of ['new-menu','node-menu'])$(id).classList.remove('show');$('newBtn').setAttribute('aria-expanded','false')}
function nodeMenu(event,node){
 event.preventDefault();contextSpace=null;const n=state.rows.find(n=>n.id===node.dataset.node);if(!n)return;
 closeMenus();state.selected=n;state.selection=n.id;document.querySelectorAll('[data-node]').forEach(card=>{const selected=card.dataset.node===n.id;card.classList.toggle('on',selected);card.setAttribute('aria-pressed',String(selected))});selectionBar();
 const options=n.trashed_at?[['restore','Restaurar','history'],['purge','Eliminar definitivamente','trash']]:[['inspect',n.kind==='folder'?'Abrir carpeta':'Abrir','folder'],['info','Obtener información','file'],...(n.kind==='file'?[['download-selected','Descargar una copia','download']]:[]),['share','Compartir','users'],['rename','Cambiar nombre','edit'],['move','Mover a una carpeta','folder'],['trash','Enviar a la papelera','trash']];

function openWorkspace(space,loadNow=true){if(!space)return;state.space=space.id;state.parent=null;state.crumbs=[];state.view='files';if(loadNow)return load()}
async function deleteWorkspace(space){if(!space||space.kind!=='organization'||space.owner_id!==state.me?.id)throw new Error('Solo el propietario puede eliminar este espacio.');const id=space.id;confirm('Eliminar espacio',`Se eliminará «${esc(space.name)}» para todos sus miembros, incluidos sus archivos, carpetas y papelera. Esta acción no se puede deshacer.`,'Eliminar espacio',async()=>{await api('/spaces/'+id,{method:'DELETE'});contextSpace=null;state.view='recent';state.parent=null;state.crumbs=[];await loadSpaces();state.space=state.spaces.find(s=>s.kind==='personal')?.id||null});const submit=$('modal-form').querySelector('[type=submit]');submit.style.background='var(--red)';submit.style.color='var(--on-accent)'}
function workspaceMenu(event,space){event.preventDefault();closeMenus();contextSpace=space;state.selected=null;state.selection=null;selectionBar();const menu=$('node-menu');menu.innerHTML='<button role="menuitem" data-action="space-open">Abrir espacio</button><button role="menuitem" data-action="space-members">Miembros</button>'+(space.owner_id===state.me?.id?'<hr><button class="destructive" role="menuitem" data-action="delete-space">Eliminar espacio</button>':'');positionContextMenu(event,menu)}
function positionContextMenu(event,menu){menu.classList.add('show');menu.style.left=Math.max(12,Math.min(event.clientX||12,innerWidth-menu.offsetWidth-12))+'px';menu.style.top=Math.max(12,Math.min(event.clientY||12,innerHeight-menu.offsetHeight-12))+'px';menu.querySelector('button')?.focus()}
function driveContextMenu(event){if(event.target.closest('input,textarea,select,[contenteditable="true"]'))return;const node=event.target.closest('[data-node]');if(node){contextSpace=null;nodeMenu(event,node);return}const el=event.target.closest('[data-space]');if(el){event.preventDefault();const space=state.spaces.find(s=>s.id===el.dataset.space);if(space)workspaceMenu(event,space);return}if(event.target.closest('.app')){event.preventDefault();if(!state.me)return;closeMenus();contextSpace=null;const menu=$('node-menu'),canCreate=['files','recent'].includes(state.view);menu.innerHTML=(canCreate?'<button role="menuitem" data-action="new-folder">Nueva carpeta</button><button role="menuitem" data-action="upload">Subir archivo</button><hr>':'')+'<button role="menuitem" data-action="refresh">Actualizar</button>';positionContextMenu(event,menu)}}
document.addEventListener('contextmenu',driveContextMenu);

document.addEventListener('keydown',event=>{if(event.key==='ContextMenu'||(event.shiftKey&&event.key==='F10')){driveContextMenu(event)}if(event.key==='Escape')closeMenus();if(['ArrowDown','ArrowUp','Home','End'].includes(event.key)&&event.target.closest('[role="menu"]')){event.preventDefault();const buttons=[...event.target.closest('[role="menu"]').querySelectorAll('button:not(:disabled)')];let i=buttons.indexOf(event.target);i=event.key==='Home'?0:event.key==='End'?buttons.length-1:(i+(event.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length;buttons[i]?.focus()}});
document.addEventListener('pointerdown',event=>{if(!event.target.closest('[role="menu"]')&&!event.target.closest('#newBtn'))closeMenus()});

document.addEventListener('scroll',closeMenus,true);
document.addEventListener('click',async event=>{const download=event.target.closest('a[download]');if(LOCAL_FILE&&download){event.preventDefault();try{await downloadFile(download.href)}catch(error){toast(message(error))}return}const action=event.target.closest('[data-action]');if(action){if(action.disabled)return;if(action.dataset.action==='delete-space'&&!action.closest('#node-menu'))contextSpace=null;$('node-menu').classList.remove('show');if(action.dataset.action!=='new-menu'){$('new-menu').classList.remove('show');$('newBtn').setAttribute('aria-expanded','false')}if($('detail').open)$('detail').close();try{await actions[action.dataset.action]?.(action)}catch(error){toast(message(error))}return}const nav=event.target.closest('[data-nav]');if(nav&&state.me){if(nav.disabled)return;state.view=nav.dataset.nav;if(state.view==='files'||state.view==='recent')state.space=state.spaces.find(s=>s.kind==='personal')?.id||state.space;state.parent=null;state.crumbs=[];$('search').value='';$('sidebar').classList.remove('open');document.querySelector('.app')?.classList.remove('mobile-sidebar');await load();return}const space=event.target.closest('[data-space]');if(space){contextSpace=null;state.space=space.dataset.space;state.parent=null;state.crumbs=[];state.view='files';$('search').value='';$('sidebar').classList.remove('open');await load();return}const crumb=event.target.closest('[data-crumb]');if(crumb){const i=Number(crumb.dataset.crumb);state.parent=i<0?null:state.crumbs[i].id;state.crumbs=state.crumbs.slice(0,i+1);await load();return}const node=event.target.closest('[data-node]');if(node){const selected=state.rows.find(n=>n.id===node.dataset.node);if(!selected)return;state.selected=selected;state.selection=selected.id;const cards=document.querySelectorAll('[data-node]');cards.forEach(card=>{const on=card.dataset.node===selected.id;card.classList.toggle('on',on);card.setAttribute('aria-pressed',String(on))});selectionBar();return}});
document.addEventListener('click',event=>{if(event.target.closest('#items')&&!event.target.closest('[data-node]')){state.selected=null;state.selection=null;render()}});
document.addEventListener('dblclick',event=>{const node=event.target.closest('[data-node]');if(node){state.selected=state.rows.find(n=>n.id===node.dataset.node);if(state.selected?.kind==='folder')openFolder(state.selected);else detail()}});

async function moveDialog(){
 const n={...state.selected},space=n.space_id||state.space;let parent=null,trail=[],cursor=null,folders=[];const title='Mover «'+n.name+'»';
 async function draw(append=false){const {data}=await api(`/spaces/${space}/nodes?${parent?'parent='+encodeURIComponent(parent)+'&':''}${append&&cursor?'after='+encodeURIComponent(cursor):''}`);cursor=data.next_cursor;folders=(append?folders:[]).concat(data.items.filter(f=>f.kind==='folder'&&f.id!==n.id));
 form(title,`<p>Destino: <strong>${esc(trail.length?trail.map(f=>f.name).join(' / '):'Mi unidad')}</strong></p><div class="stack"><button type="button" class="button" id="move-up" ${trail.length?'':'disabled'}>Subir un nivel</button>${folders.map(f=>`<button type="button" class="button" data-destination="${f.id}">${icon('folder')}${esc(f.name)}</button>`).join('')}${cursor?'<button type="button" class="button" id="move-more">Cargar más</button>':''}</div>`,'Mover aquí',async()=>{await mutate('/nodes/'+n.id,'PATCH',parent?{parent_id:parent}:{move_to_root:true},n);$('dialog').close();await load();toast('Elemento movido.')});
 $('move-up').addEventListener('click',()=>{trail.pop();parent=trail.at(-1)?.id||null;draw().catch(e=>toast(message(e)))});
 $('dialog-body').querySelectorAll('[data-destination]').forEach(b=>b.addEventListener('click',()=>{const f=folders.find(f=>f.id===b.dataset.destination);trail.push(f);parent=f.id;draw().catch(e=>toast(message(e)))}));
 if(cursor)$('move-more').addEventListener('click',()=>draw(true).catch(e=>toast(message(e))));
 }await draw();
}
async function downloadFile(url){
 if(!state.token)throw new Error('Inicia sesión para descargar.');
 if(!url.startsWith(API_ORIGIN+'/api/v1/nodes/'))throw new Error('Dirección de descarga no válida.');
 const response=await fetch(url,{credentials:'omit',headers:{Authorization:'Bearer '+state.token}});
 if(!response.ok)throw new Error('No se pudo descargar el archivo.');
 // shortcut: the standalone demo buffers downloads up to 64 MiB; add streamed saving for larger files.
 const limit=64*1024*1024,reader=response.body.getReader(),chunks=[];let size=0;
 try{while(true){const {done,value}=await reader.read();if(done)break;size+=value.byteLength;if(size>limit)throw new Error('Esta prueba admite descargas de hasta 64 MiB.');chunks.push(value)}}catch(error){await reader.cancel();throw error}
 const objectURL=URL.createObjectURL(new Blob(chunks)),link=document.createElement('a');
 link.href=objectURL;link.download=state.selected?.name||'archivo';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(objectURL),60000);
}
async function connectAPI(){
 if(LOCAL_FILE){$('login-submit').disabled=true;$('connection-help').innerHTML='<a class="button primary" href="http://localhost:5500/">Abrir Drive con sesión segura</a>';$('api-status').textContent='Abre la interfaz segura';return}
 $('login-submit').disabled=true;$('login-error').textContent='';$('api-status').textContent='Conectando…';$('api-dot').style.background='#9aa48e';
 let connected=false;
 try{
  const health=await fetch(apiUrl('/health/live'),{credentials,cache:'no-store',signal:AbortSignal.timeout(4000)});
  if(!health.ok)throw new Error('La API no está disponible.');
  connected=true;$('api-status').textContent='API conectada';$('api-dot').style.background='#388d6b';$('connection-help').textContent='Conectado al servidor local. Utiliza la cuenta que creó el administrador.';
  try{await enter();if(state.me&&!state.csrf&&!state.token){signedOut();toast('Entra de nuevo para habilitar las operaciones de esta pestaña.')}}catch(error){if(error.status!==401)throw error}
 }catch(error){$('api-status').textContent='Sin conexión';$('api-dot').style.background='#ad3d3d';$('login-error').textContent=connected?message(error):'No se puede conectar con la API en localhost:8443. Arranca el backend y vuelve a pulsar Entrar.';$('connection-help').innerHTML='<button type="button" class="button" data-action="connect">Reintentar conexión</button>';}
 finally{$('login-submit').disabled=false}
}
setTheme(storage.get('drive.theme')==='dark'?'dark':'light',false);
connectAPI();
