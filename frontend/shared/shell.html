<header class="shell-header">
  <a class="shell-brand" href="/" aria-label="Santolv, Inicio"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="8.5" height="8.5" rx="2.8" fill="#2e91ff"/><rect x="13.5" y="2" width="8.5" height="8.5" rx="2.8" fill="#b275f4"/><rect x="2" y="13.5" width="8.5" height="8.5" rx="2.8" fill="#f39b61"/><rect x="13.5" y="13.5" width="8.5" height="8.5" rx="2.8" fill="#52c78b"/></svg><span>Santolv</span></a>
<div class="shell-controls" aria-label="Controles de Santolv">
  <a class="shell-button shell-home" href="/" aria-label="Volver a Inicio" title="Volver a Inicio">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3.5 11 7.1-6.2a2.1 2.1 0 0 1 2.8 0l7.1 6.2"/><path d="M6 9v9a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V9M10 20v-5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v5"/></svg><span>Inicio</span>
  </a>
  <button class="shell-button shell-apps" type="button" popovertarget="shell-apps-menu" aria-label="Aplicaciones" title="Aplicaciones">
    <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="6" cy="6" r="2.2"/><circle cx="14" cy="6" r="2.2"/><circle cx="6" cy="14" r="2.2"/><circle cx="14" cy="14" r="2.2"/></svg>
  </button>
  <button class="shell-button" type="button" data-shell-theme aria-label="Cambiar todo a modo oscuro" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><g class="shell-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19m-14 0 1.5-1.5m11-11L19 5"/></g><path class="shell-moon" d="M20.8 13A9 9 0 0 1 11 3.2 9 9 0 1 0 20.8 13Z"/></svg>
  </button>
  <button class="shell-button shell-profile account-avatar" type="button" popovertarget="shell-account-menu" aria-label="Mi cuenta" title="Mi cuenta" hidden></button>
  <nav id="shell-apps-menu" class="shell-menu" popover aria-label="Aplicaciones de Santolv">
    <strong>Aplicaciones</strong>
    <a href="/drive/" data-shell-service="drive" hidden><span aria-hidden="true" class="shell-app-mark shell-drive-mark"></span>Drive</a>
    <a href="/photos/" data-shell-service="photos" hidden><span aria-hidden="true" class="shell-app-mark shell-photos-mark"></span>Fotos</a>
    <p id="shell-apps-status" role="status" hidden></p>
  </nav>
  <section id="shell-account-menu" class="shell-menu" popover aria-label="Mi cuenta">
    <strong id="shell-username"></strong>
    <a href="/account/">Gestionar mi cuenta</a>
    <button type="button" data-shell-account="switch">Cambiar de cuenta</button>
    <button type="button" data-shell-account="logout">Cerrar sesión</button>
    <p id="shell-account-error" role="status" hidden></p>
  </section>
</div>
</header>
