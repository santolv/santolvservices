<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Notas · Santolv</title>
<!-- SANTOLV_RECORD_STYLE -->
</head>
<body data-service="notes">
<!-- SANTOLV_SHELL -->
<main class="records-main">
  <div class="heading">
    <h1>Notas</h1>
    <button type="button" class="primary" id="new" disabled>Nueva nota</button>
  </div>
  <form class="filters" id="filters" role="search">
    <label class="record-search"><span class="sr-only">Buscar</span><input type="search" name="q" placeholder="Buscar" aria-label="Buscar"></label>
    <div class="record-segment" role="group" aria-label="Archivo"><button type="button" data-record-archive="false" aria-pressed="true">Activas</button><button type="button" data-record-archive="true" aria-pressed="false">Archivadas</button></div>
    <label id="archived-filter" hidden><span>Archivo</span><select name="archived"><option value="false">Activas</option><option value="true">Archivadas</option></select></label>
  </form>
  <p id="message" role="status"></p>
  <ul id="items" aria-label="Resultados"></ul>
  <button type="button" id="more" hidden>Cargar más</button>
</main>
<dialog class="records-editor" id="editor" aria-labelledby="editor-title">
  <form id="edit-form">
    <h2 id="editor-title" class="sr-only"></h2>
    <fieldset id="edit-fields">
      <label class="record-title"><span class="sr-only">Título</span><input name="title" placeholder="Título" maxlength="200" required></label>
      <fieldset id="note-fields">
        <label class="record-content"><span class="sr-only">Contenido</span><textarea name="content" placeholder="Escribe algo…" rows="8"></textarea></label>
        <label class="inline" id="archive-field" hidden><input name="archived" type="checkbox"><span>Archivada</span></label>
      </fieldset>
    </fieldset>
    <p id="editor-error" role="alert" hidden></p>
    <div class="actions">
      <div>
        <button type="button" id="archive" hidden>Archivar</button>

        <button type="button" class="danger" id="delete" hidden>Eliminar</button>
      </div>
      <div>
        <button type="button" id="cancel" aria-label="Cerrar sin guardar" title="Cerrar sin guardar">×</button>
        <button type="submit" class="primary" id="save">Hecho</button>
      </div>
    </div>
  </form>
</dialog>
<!-- SANTOLV_RECORD_SCRIPT -->
<script>(() => {
 'use strict';
 const {api,start}=window.SantolvRecords.create(),$=id=>document.getElementById(id),form=$('edit-form'),editor=$('editor'),filters=$('filters');
 const format=new Intl.DateTimeFormat('es',{dateStyle:'medium',timeStyle:'short'});
 let editing,cursor,request,params,saving=false,ready=false,searchTimer;const records=new WeakMap();
 const message=(text,error=false)=>{$('message').textContent=text;$('message').dataset.error=String(error)};
 const error=(text='')=>{$('editor-error').textContent=text;$('editor-error').hidden=!text};
 function row(note){const li=document.createElement('li'),button=document.createElement('button');button.type='button';button.className='record-open';const title=document.createElement('strong');title.textContent=note.title;button.append(title);if(note.content){const preview=document.createElement('span');preview.className='preview';preview.textContent=Array.from(note.content).slice(0,140).join('');button.append(preview)}const meta=document.createElement('span');meta.className='meta';meta.textContent='Editada '+format.format(new Date(note.updated_at));button.append(meta);button.addEventListener('click',()=>open(note));li.append(button);records.set(li,note);return li}
 async function load(append=false){if(!ready||append&&!cursor)return;request?.abort();const current=new AbortController();request=current;
  if(!append){$('items').replaceChildren();cursor=null;params=new URLSearchParams({archived:filters.elements.archived.value});if(filters.elements.q.value.trim())params.set('q',filters.elements.q.value.trim())}
  const query=new URLSearchParams(params);if(append)query.set('cursor',cursor);$('more').disabled=true;$('items').setAttribute('aria-busy','true');message('Cargando…');
  try{const page=await api('/notes?'+query,{signal:current.signal});if(request!==current)return;$('items').append(...page.items.map(row));cursor=page.next_cursor;message($('items').childElementCount?'':'No hay resultados.')}catch(e){if(request===current)message(e.message,true)}finally{if(request===current){$('more').hidden=!cursor;$('more').disabled=false;$('items').setAttribute('aria-busy','false')}}
 }
 function open(note=null){if(!ready||editor.open)return;editing=note;form.reset();$('editor-title').textContent=note?'Editar nota':'Nueva nota';form.elements.title.value=note?.title||'';form.elements.content.value=note?.content||'';form.elements.archived.checked=Boolean(note?.archived_at);$('archive').hidden=!note;$('archive').textContent=note?.archived_at?'Restaurar':'Archivar';$('delete').hidden=!note;error();editor.showModal();form.elements.title.focus()}
 async function change(method,body){if(saving)return;saving=true;for(const id of ['edit-fields','save','cancel','archive','delete'])$(id).disabled=true;error();try{await api('/notes'+(editing?'/'+encodeURIComponent(editing.id):''),{method,body});editor.close();await load()}catch(e){error(e.message)}finally{saving=false;for(const id of ['edit-fields','save','cancel','archive','delete'])$(id).disabled=false}}
 form.addEventListener('submit',e=>{e.preventDefault();const body={title:form.elements.title.value,content:form.elements.content.value};if(editing)body.archived=form.elements.archived.checked;void change(editing?'PUT':'POST',body)});
 $('archive').addEventListener('click',()=>{if(editing){form.elements.archived.checked=!Boolean(editing.archived_at);form.requestSubmit()}});
 $('delete').addEventListener('click',()=>{if(editing&&window.confirm('¿Eliminar esta nota? Las tareas vinculadas se conservarán.'))void change('DELETE')});
 $('cancel').addEventListener('click',()=>editor.close());editor.addEventListener('cancel',e=>{if(saving)e.preventDefault()});$('new').addEventListener('click',()=>open());$('more').addEventListener('click',()=>void load(true));
 for(const button of document.querySelectorAll('[data-record-archive]'))button.addEventListener('click',()=>{filters.elements.archived.value=button.dataset.recordArchive;for(const b of document.querySelectorAll('[data-record-archive]'))b.setAttribute('aria-pressed',String(b===button));void load()});
 async function quick(note,method,body){try{await api('/notes/'+encodeURIComponent(note.id),{method,body});await load()}catch(e){message(e.message,true)}}
 window.SantolvShell?.bindContextMenu?.($('items'),event=>{const note=records.get(event.target.closest('li'));if(!note||!ready||editor.open)return;const archived=Boolean(note.archived_at);
  return [{label:'Abrir',icon:'open',action:()=>open(note)},{label:'Ver tareas vinculadas',icon:'check',action:()=>location.assign('/tasks/?note='+encodeURIComponent(note.id))},'-',
   {label:archived?'Restaurar':'Archivar',icon:archived?'restore':'archive',action:()=>quick(note,'PUT',{title:note.title,content:note.content,archived:!archived})},'-',
   {label:'Eliminar',icon:'trash',danger:true,action:()=>{if(window.confirm('¿Eliminar esta nota? Las tareas vinculadas se conservarán.'))return quick(note,'DELETE')}}]},{label:'Acciones de la nota'});
 filters.addEventListener('submit',e=>{e.preventDefault();void load()});filters.elements.q.addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>void load(),200)});
 message('Cargando…');start().then(async()=>{ready=true;$('new').disabled=false;await load();const id=new URLSearchParams(location.search).get('id');if(id)open(await api('/notes/'+encodeURIComponent(id)))}).catch(e=>message(e.message,true));
})();
</script>
</body>
</html>
