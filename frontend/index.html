<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Santolv · Inicio</title>
<style>
:root{font-family:system-ui,sans-serif;color:#172331;background:#f5f7fa;color-scheme:light dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(at 20% 0%,#dfefff,transparent 65%)}header{display:flex;justify-content:space-between;align-items:center;padding:24px 5vw;border-bottom:1px solid #7892ab22}header strong{font-size:22px;letter-spacing:-1px}main{max-width:980px;margin:9vh auto;padding:24px}h1{font-size:clamp(30px,5vw,48px);letter-spacing:-1.5px;margin-bottom:12px}p{color:#607080;line-height:1.6}button,input,a{font:inherit}button,.service{border:1px solid #7892ab25;border-radius:20px;background:#ffffffb8;color:inherit;padding:16px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}a{color:#1477d8}.services{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:24px;margin-top:36px}.service{display:flex;flex-direction:column;text-decoration:none;padding:34px;box-shadow:0 10px 40px #17385608}.service:hover{background:#fff}.service strong{font-size:25px;margin-top:20px}.symbol{font-size:38px;color:#1477d8}.photos .symbol{color:#e85d85}.service span:last-child{margin-top:8px;color:#607080}form{max-width:380px;display:grid;gap:16px;background:#ffffff90;border:1px solid #7892ab25;border-radius:24px;padding:26px}label{display:grid;gap:8px}input{width:100%;padding:12px;border:1px solid #7892ab66;border-radius:10px;background:transparent;color:inherit}form button{background:#1477d8;color:white;border-radius:12px}#status{min-height:28px}#logout{padding:10px 18px}[hidden]{display:none!important}:focus-visible{outline:3px solid #1488eb;outline-offset:4px}@media(prefers-color-scheme:dark){:root{background:#11171f;color:#e6eef7}body{background:radial-gradient(at 20% 0%,#183047,transparent 65%)}button,.service,form{background:#24303d99}.service:hover{background:#2b3c50}p,.service span:last-child{color:#a3b2c1}}
</style></head><body><header><strong>Santolv</strong><div><span id="account"></span> <button id="logout" hidden>Cerrar sesión</button></div></header><main>
<h1 id="greeting">Tu espacio.</h1><p id="intro">Una cuenta para tus servicios.</p>
<form id="login"><label>Usuario<input id="username" autocomplete="username" required></label><label>Contraseña<input id="password" type="password" autocomplete="current-password" required></label><button>Entrar</button></form>
<form id="change-password" hidden><p>Actualiza tu contraseña temporal para continuar.</p><label>Contraseña actual<input id="current-password" type="password" autocomplete="current-password" required></label><label>Nueva contraseña<input id="new-password" type="password" autocomplete="new-password" minlength="12" required></label><button>Guardar contraseña</button></form>
<p id="status" role="status" aria-live="polite"></p>
<div id="services" class="services" hidden><a class="service" href="/drive/"><span class="symbol" aria-hidden="true">▱</span><strong>Drive</strong><span>Archivos y carpetas</span></a><a class="service photos" href="/photos/"><span class="symbol" aria-hidden="true">✿</span><strong>Fotos</strong><span>Tu biblioteca de fotos</span></a></div>
</main><script>
'use strict';
const API_ORIGIN=location.protocol==='https:'?location.origin:'http://localhost:8443';
const $=id=>document.getElementById(id);let csrf='';
async function api(path,method='GET',body){const headers={};if(body!==undefined)headers['Content-Type']='application/json';if(csrf&&method!=='GET')headers['X-CSRF-Token']=csrf;const r=await fetch(API_ORIGIN+'/api/v1'+path,{method,headers,credentials:'include',body:body===undefined?undefined:JSON.stringify(body)});const data=r.status===204?null:await r.json();if(!r.ok)throw new Error(r.status===401?'Usuario o contraseña incorrectos.':data?.error?.code||'No se pudo completar la operación.');return data}
function signedOut(){csrf='';$('login').hidden=false;$('change-password').hidden=true;$('services').hidden=true;$('logout').hidden=true;$('account').textContent='';$('greeting').textContent='Tu espacio.'}
async function enter(){const me=await api('/me');csrf=me.csrf_token||'';$('login').hidden=true;$('account').textContent=me.username;$('logout').hidden=false;$('greeting').textContent='Tu espacio, '+me.username+'.';$('change-password').hidden=!me.must_change_password;$('services').hidden=me.must_change_password;$('intro').textContent=me.must_change_password?'Completa la configuración de tu cuenta.':'Elige el servicio que quieres abrir.'}
for(const id of ['login','change-password'])$(id).addEventListener('submit',async event=>{event.preventDefault();const button=event.target.querySelector('button');button.disabled=true;$('status').textContent='Conectando…';try{if(id==='login'){await api('/auth/login','POST',{username:$('username').value.trim(),password:$('password').value});$('password').value=''}else{await api('/auth/password','POST',{current_password:$('current-password').value,new_password:$('new-password').value});$('current-password').value='';$('new-password').value='';signedOut();$('status').textContent='Contraseña actualizada. Inicia sesión con la nueva contraseña.';return}await enter();$('status').textContent=''}catch(error){$('status').textContent=error.message}finally{button.disabled=false}});
$('logout').addEventListener('click',async()=>{try{await api('/auth/logout','POST');signedOut();$('status').textContent='Sesión cerrada.'}catch(error){$('status').textContent=error.message}});
window.addEventListener('pageshow',()=>enter().catch(()=>signedOut()));
</script></body></html>
