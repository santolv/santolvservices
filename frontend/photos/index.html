.app .page-content,.app.has-context.non-library .page-content{padding:12.84px 25.68px 34.24px}
.page-heading h2{font-size:24.61px;letter-spacing:-.025em}
.app .empty{padding-top:59.92px}
.photo-day{padding:16.05px 25.68px 7.49px;font-size:17.12px;font-weight:650;letter-spacing:-.01em}
.photo-day span{margin-inline-start:8.56px;color:var(--sub);font-size:12.84px;font-weight:500}
.app .photo-grid{display:flex;flex-wrap:wrap;gap:2.14px;padding:0 2.14px}
.photo-loading-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,var(--thumb)),1fr));grid-auto-rows:var(--thumb);gap:2.14px;padding:14.98px 2.14px 0}
.photo-loading-grid span{background:var(--fill)}
.app .photo-card{flex:none;width:var(--thumb);height:var(--thumb);border-radius:0}
.app .photo-open{height:100%;aspect-ratio:auto;border-radius:0;padding:0;border:0}
.app .photo-open img{width:100%;height:100%;object-fit:cover}
.app .photo-card.is-selected{border-radius:7.49px}
.app .photo-card.is-selected .photo-open img{transform:scale(.93)}
.app .photo-card.is-selected::after{border-radius:inherit;border-width:3.21px}
.app .library-foot{padding:29.96px 17.12px 34.24px;gap:2.14px;font-size:13.91px}
.app .library-foot strong{font-size:16.05px;font-weight:600}
#load-more{display:block;margin:21.4px auto 0}
.photo-inspector{min-width:0;grid-column:3;grid-row:2;padding:12.84px 17.12px 25.68px;background:var(--side);border-inline-start:1.07px solid var(--line);overflow:auto}
.inspector-head{display:flex;align-items:center;justify-content:space-between;gap:8.56px;margin-bottom:12.84px}
.inspector-head h2{font-size:16.05px}
.photo-inspector h3{margin-bottom:10.7px;font-size:14.98px;overflow-wrap:anywhere}
.photo-inspector p,.photo-inspector dt{color:var(--sub);font-size:12.84px}
.photo-inspector dl{margin-bottom:14.98px}
.photo-inspector dl div{display:flex;justify-content:space-between;gap:8.56px;padding:8.56px 0;border-bottom:1.07px solid var(--line)}
.photo-inspector dd{text-align:right}
.photo-selection-dock{position:absolute;z-index:21;bottom:21.4px;left:calc(var(--sidebar) + (100% - var(--sidebar) - var(--inspector-size,0px)) / 2);transform:translateX(-50%);display:flex;align-items:center;gap:6.42px;width:max-content;max-width:calc(100vw - 25.68px);padding:6.42px 8.56px 6.42px 14.98px;border:1.07px solid var(--line);border-radius:12.84px;background:var(--surface);backdrop-filter:none;box-shadow:0 8.56px 25.68px #0002}
.photo-selection-dock .selection-count{color:var(--text)}
.photo-selection-dock .icon-btn{color:var(--blue)}
@media(max-width:1000px){.app .library-heading{grid-template-columns:minmax(0,1fr) auto}.app .periods{grid-row:2;grid-column:1/-1;justify-self:center}}
@media(max-width:860px){.app.inspector-open{--inspector-size:0px}.photo-inspector{position:absolute;inset:51.36px 0 0 auto;width:min(278.2px,90%);z-index:18;box-shadow:-8px 0 25.68px #0002}}
@media(max-width:620px){
 :root,.app.mobile-sidebar{--sidebar:0px}
 .app.mobile-sidebar main{grid-column:2}
 .app.mobile-sidebar .side{inset:var(--shell-height) auto 0 0;width:240.429px}
 .app .top,.app.non-library .top,.app.is-scrolled:not(.non-library) .top{padding-inline:10.7px;gap:4.28px}
 .app .library-heading{padding:17.12px 14.98px 9.63px;align-items:center}
 .app.is-selecting .window-title,.app.is-selecting .periods{display:block}
 .app.is-selecting .periods:not([hidden]){display:flex}
 .app .heading-actions{gap:3.21px}
 .app .select-mode-button{padding-inline:6.42px;font-size:11.77px}
 .window-title h1{font-size:24.61px}
 .app .context-bar,.photo-day{padding-inline:14.98px}
 .app .page-content,.app.has-context.non-library .page-content{padding-inline:14.98px}
 .app .photo-card{min-width:0}
}
@media(max-width:360px){.top .icon-btn{width:25.68px}.top .search{padding-inline:5.35px}.top .search input{width:38.52px;font-size:11.77px}}

<div class="app" id="app">

<script>

'use strict';
const $ = id => document.getElementById(id);
const icon = name => '<svg aria-hidden="true"><use href="#i-' + name + '"/></svg>';
const escapeText = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const photos = [];
    const albums = [];

const state={route:'photos',album:null,filter:'all',sort:'newest',period:'all',datePrefix:'',year:'',viewerId:null,infoId:null,viewerIds:[],zoom:false,selecting:false,selected:new Set()};
let libraryLoading=true;
let toastTimer,dragDepth=0,pendingFocus=null,pendingUndo=null;
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
const runningMotion=new WeakMap();
function animateElement(element,keyframes,options={}){if(!element||reducedMotion.matches||typeof element.animate!=='function')return null;runningMotion.get(element)?.cancel();const animation=element.animate(keyframes,{duration:320,easing:'cubic-bezier(.22,1,.36,1)',fill:'backwards',...options});runningMotion.set(element,animation);animation.finished.catch(()=>{});return animation}
function animateLibrary(){const cards=[...$('library').querySelectorAll('.photo-card,.album-cover,.period-card')];if(cards.length){const viewport=$('content').getBoundingClientRect();cards.filter(card=>{const rect=card.getBoundingClientRect();return rect.bottom>viewport.top&&rect.top<viewport.bottom}).slice(0,24).forEach((card,index)=>animateElement(card,[{opacity:0,transform:'translateY(10px) scale(.985)'},{opacity:1,transform:'none'}],{duration:380,delay:Math.min(index*16,160)}))}else animateElement($('library').firstElementChild,[{opacity:0,transform:'translateY(7px)'},{opacity:1,transform:'none'}],{duration:260})}
function showImageFailure(image){
  const button=image.closest('.photo-open');
  if(!button||button.classList.contains('is-error'))return;
  button.classList.add('is-error');
  const fallback=document.createElement('span');
  fallback.className='image-fallback';
  fallback.innerHTML=icon('photos')+'<span>No se pudo cargar la imagen</span>';
  button.append(fallback);
}
const photoRatios=new Map();
function layoutPhotoGrid(){
 const target=Number.parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--thumb'))||160;
 for(const grid of $('library').querySelectorAll('.photo-grid')){
  const width=grid.clientWidth-4.28,gap=2.14;
  if(width<=0)continue;
  let row=[],sum=0;
  const placeRow=last=>{
   const height=Math.min(last?target:Infinity,(width-gap*(row.length-1))/sum);
   for(const card of row){
    card.style.width=(height*(photoRatios.get(card.querySelector('img').dataset.media)||1))+'px';
    card.style.height=height+'px';
   }
   row=[];sum=0;
  };
  for(const card of grid.children){
   const ratio=photoRatios.get(card.querySelector('img').dataset.media)||1;
   row.push(card);sum+=ratio;
   if(sum*target+gap*(row.length-1)>=width)placeRow(false);
  }
  if(row.length)placeRow(true);
 }
}
function prepareImages(){
  for(const image of $('library').querySelectorAll('img[data-media]')){
    const loaded=arriving=>{
      if(image.naturalWidth&&image.naturalHeight){
        photoRatios.set(image.dataset.media,image.naturalWidth/image.naturalHeight);
        layoutPhotoGrid();
      }
      image.classList.add('is-loaded');
      if(arriving)image.classList.add('is-arriving');
    };
    if(image.hasAttribute('src')&&image.complete){
      if(image.naturalWidth)loaded(false);else showImageFailure(image);
    }else{
      image.addEventListener('load',()=>loaded(true),{once:true});
      image.addEventListener('error',()=>showImageFailure(image),{once:true});
    }
  }
  layoutPhotoGrid();
}


let tooltipTimer=0,tooltipTarget=null;
function prepareHoverDetails(){for(const button of $('library').querySelectorAll('.photo-open')){if(button.querySelector('.photo-details'))continue;const photo=photos.find(item=>item.id===button.dataset.photo);if(!photo)continue;const detail=document.createElement('span');detail.className='photo-details';detail.setAttribute('aria-hidden','true');detail.innerHTML='<strong>'+escapeText(photo.name)+'</strong><span class="photo-detail-meta"><span>'+escapeText(dateCompact(photo.date))+'</span><span>'+escapeText(photo.place)+'</span></span>';button.append(detail)}for(const button of document.querySelectorAll('.icon-btn[title],.sidebar-button[title],.select-mode-button[title]')){button.dataset.tooltip=button.title;button.removeAttribute('title')}}
function hideGlassTooltip(){clearTimeout(tooltipTimer);$('glass-tooltip').hidden=true;if(tooltipTarget?.getAttribute('aria-describedby')==='glass-tooltip')tooltipTarget.removeAttribute('aria-describedby');tooltipTarget=null}
function showGlassTooltip(button,immediate=false){hideGlassTooltip();if(!button||button.disabled)return;const text=button.dataset.tooltip||button.getAttribute('aria-label');if(!text)return;tooltipTarget=button;tooltipTimer=setTimeout(()=>{if(!button.isConnected||button.disabled)return;const box=button.getBoundingClientRect();if(!box.width)return;const tip=$('glass-tooltip');tip.textContent=text;tip.hidden=false;const rect=tip.getBoundingClientRect();tip.style.left=Math.max(8,Math.min(innerWidth-rect.width-8,box.left+box.width/2-rect.width/2))+'px';tip.style.top=(box.bottom+rect.height+14<innerHeight?box.bottom+9:Math.max(8,box.top-rect.height-9))+'px';button.setAttribute('aria-describedby','glass-tooltip');animateElement(tip,[{opacity:0,translate:'0 -4px'},{opacity:1,translate:'0 0'}],{duration:180})},immediate?0:350)}

function renderSelection(){
 const visible=new Set(matches().map(photo=>photo.id));for(const id of state.selected)if(!visible.has(id))state.selected.delete(id);
 const available=!['trash','settings'].includes(state.route)&&(state.route!=='albums'||!!state.album)&&(state.route!=='photos'||state.period==='all')&&visible.size>0;
 if(!available){state.selecting=false;state.selected.clear()}
 $('app').classList.toggle('is-selecting',state.selecting);
 const mode=document.querySelector('[data-action="select-mode"]');mode.hidden=!available;mode.textContent=state.selecting?'Cancelar':'Seleccionar';mode.setAttribute('aria-pressed',String(state.selecting));
 const all=document.querySelector('[data-action="select-all"]');all.hidden=!state.selecting;all.textContent=state.selected.size===visible.size?'Deseleccionar':'Seleccionar todas';
 $('selection-count').textContent=state.selected.size?state.selected.size+' seleccionada'+(state.selected.size===1?'':'s'):state.selecting?'Selecciona fotos':'';
 $('bulk-actions').hidden=!state.selected.size;
 updateInspector();
 for(const card of $('library').querySelectorAll('.photo-card')){const id=card.querySelector('[data-photo]').dataset.photo;card.classList.toggle('is-selected',state.selected.has(id));let button=card.querySelector('.select-photo');if(!button){button=document.createElement('button');button.className='select-photo';button.dataset.select=id;button.innerHTML=icon('check');card.append(button)}const photo=photos.find(item=>item.id===id);button.setAttribute('aria-pressed',String(state.selected.has(id)));button.setAttribute('aria-label',(state.selected.has(id)?'Deseleccionar ':'Seleccionar ')+photo.name);button.hidden=!available}
 for(const image of $('sidebar-albums').querySelectorAll('img')){const holder=document.createElement('span');holder.innerHTML=icon('albums');image.replaceWith(holder.firstElementChild)}
}
function updateInspector(){
 if($('photo-inspector').hidden)return;
 const id=state.selecting?(state.selected.size===1?state.selected.values().next().value:null):state.infoId;
 const photo=photos.find(item=>item.id===id&&!item.deleted);
 $('inspector-empty').hidden=!!photo;
 $('inspector-photo').hidden=!photo;
 if(!photo)return;
 $('inspector-name').textContent=photo.name;

async function photoApi(path,{method='GET',body,headers={}}={}){

 if(response.status===401||['password_change_required','service_forbidden','service_disabled','service_not_installed'].includes(data?.error?.code)){leavePhotos();throw new Error('Vuelve a Inicio para continuar.')}
 if(!response.ok)throw new Error(({quota_exceeded:'No queda espacio disponible.',name_already_exists:'Ya existe una foto con ese nombre.',revision_changed:'La foto ha cambiado. Actualiza la biblioteca.',workspace_sync_pending:'El servidor está organizando las carpetas. Vuelve a intentarlo.'})[data?.error?.code]||data?.error?.code||'No se pudo completar la operación.');return data

function clearMedia(){mediaGeneration++;for(const url of mediaUrls.values())URL.revokeObjectURL(url);mediaUrls.clear()}
async function loadLibrary(append=false){
 const data=await photoApi('/photos/library'+(append&&libraryCursor?'?after='+encodeURIComponent(libraryCursor):''));
 if(!append){photos.length=0;albums.length=0}
 for(const item of data.items){if(item.kind==='folder'){if(!item.deleted)albums.push({...item,eyebrow:'Álbum',cover:''});continue}photos.push({...item,src:mediaUrls.get(item.id)||'',alt:item.name,place:'Fecha de subida'})}
 libraryLoading=false;libraryCursor=data.next_cursor;const albumId=location.hash.replace(/^#\/?/,'').split('/')[1];if(state.route==='albums'&&albums.some(a=>a.id===albumId))state.album=albumId;render();$('load-more').hidden=!libraryCursor;
}
function showPhotoError(error){notify(error.message||'No se pudo completar la operación.')}
async function beginPhotos(){try{const me=await photoApi('/me');csrf=me.csrf_token||'';if(me.must_change_password){leavePhotos();return}window.SantolvShell?.session(me.expires_at);photoSpace=(await photoApi('/photos/space',{method:'POST'})).id;document.querySelector('.side-note').textContent=me.username+' · Conectado';window.SantolvShell?.account(me,{logout:endPhotosSession,switch:endPhotosSession});await loadLibrary();
 const params=new URLSearchParams(location.search),requested=params.get('photo')||params.get('album');if(requested){const data=await photoApi('/photos/library?id='+encodeURIComponent(requested));const item=data.items[0];if(item&&!item.deleted){if(item.kind==='folder'){if(!albums.some(a=>a.id===item.id))albums.push({...item,eyebrow:'Álbum',cover:''});location.hash='/albums/'+item.id}else{if(!photos.some(p=>p.id===item.id))photos.push({...item,src:'',alt:item.name,place:'Fecha de subida'});render();openViewer(item.id)}}}
 }catch(error){libraryLoading=false;$('library').textContent='No se pudo conectar con tu biblioteca.';$('library-count').textContent='';showPhotoError(error)}}

async function endPhotosSession(){if(photoBusy)throw new Error('Espera a que termine la operación de Fotos.');await photoApi('/auth/logout',{method:'POST'});window.SantolvShell?.sessionEnded();leavePhotos()}
function imageUrl(photo){if(mediaUrls.has(photo.id))return Promise.resolve(mediaUrls.get(photo.id));if(mediaRequests.has(photo.id))return mediaRequests.get(photo.id);
 const generation=mediaGeneration;const request=mediaTail.then(async()=>{if(generation!==mediaGeneration)throw new Error('Carga cancelada.');const r=await fetch(API_ORIGIN+'/api/v1/nodes/'+photo.id+'/content',{credentials:'include'});if(r.status===401){leavePhotos();throw new Error('Sesión caducada.')}if(!r.ok)throw new Error('No se pudo cargar '+photo.name);if(Number(r.headers.get('content-length'))>30*1024*1024){await r.body.cancel();throw new Error('La previsualización admite originales de hasta 30 MiB.')}const mime=({'jpg':'image/jpeg','jpeg':'image/jpeg','png':'image/png','webp':'image/webp','gif':'image/gif','avif':'image/avif'})[photo.name.split('.').at(-1).toLowerCase()];const url=URL.createObjectURL(new Blob([await r.arrayBuffer()],{type:mime}));if(generation!==mediaGeneration){URL.revokeObjectURL(url);throw new Error('Carga cancelada.')}mediaUrls.set(photo.id,url);photo.src=url;while(mediaUrls.size>8){const [oldId,oldUrl]=mediaUrls.entries().next().value;mediaUrls.delete(oldId);URL.revokeObjectURL(oldUrl);const old=photos.find(p=>p.id===oldId);if(old)old.src=''}return url}).finally(()=>mediaRequests.delete(photo.id));mediaTail=request.catch(()=>{});mediaRequests.set(photo.id,request);return request;
}
const imageObserver=new IntersectionObserver(entries=>{for(const entry of entries){if(!entry.isIntersecting)continue;const image=entry.target;imageObserver.unobserve(image);const photo=photos.find(p=>p.id===image.dataset.media);if(photo&&!photo.deleted)imageUrl(photo).then(url=>{if(image.isConnected)image.src=url}).catch(()=>{if(image.isConnected)showImageFailure(image)})}},{root:$('content'),rootMargin:'200px'});
function prepareServerImages(){imageObserver.disconnect();for(const image of $('library').querySelectorAll('img[data-media]:not([src])'))imageObserver.observe(image)}
async function persistPhoto(photo,action,value){if(!photo||photoBusy)return false;photoBusy=true;try{const result=await photoApi(action==='favorite'?'/photos/'+photo.id+'/favorite':'/nodes/'+photo.id+'/'+action,{method:action==='favorite'?'PUT':'POST',body:action==='favorite'?{favorite:value}:undefined,headers:{'If-Match':'"'+photo.revision+'"'}});photo.revision=result.revision;if(action==='favorite')photo.favorite=value;else photo.deleted=action==='trash';render();if($('viewer').open)updateViewer();return true}catch(error){showPhotoError(error);await loadLibrary().catch(showPhotoError);return false}finally{photoBusy=false}}
async function toggleFavorite(id){const photo=photos.find(p=>p.id===id);if(photo)await persistPhoto(photo,'favorite',!photo.favorite)}
async function bulkPhoto(action){for(const id of [...state.selected]){const photo=photos.find(p=>p.id===id);if(!await persistPhoto(photo,action,true))break}state.selected.clear();state.selecting=false;render()}
async function trashPhoto(){const photo=photos.find(p=>p.id===state.viewerId);if(await persistPhoto(photo,'trash')){await closeDialog($('viewer'));notify('Foto guardada en la papelera del servidor.')}}
async function restorePhoto(id){if(await persistPhoto(photos.find(p=>p.id===id),'restore'))notify('Foto restaurada.')}
const sha256=async buffer=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',buffer)),b=>b.toString(16).padStart(2,'0')).join('');
async function uploadPhoto(file){
 // shortcut: browser hashing buffers one image (30 MiB max); use streaming hashing for larger originals.
 const buffer=await file.arrayBuffer();const upload=await photoApi('/uploads',{method:'POST',body:{space_id:photoSpace,parent_id:state.album,name:file.name,size:file.size,sha256:await sha256(buffer)}});
 let accepted=false;try{for(let offset=0;offset<file.size;offset+=1024*1024){const chunk=buffer.slice(offset,offset+1024*1024);await photoApi('/uploads/'+upload.id+'/content',{method:'PATCH',body:chunk,headers:{'Content-Type':'application/octet-stream','Upload-Offset':String(offset),'X-Chunk-SHA256':await sha256(chunk)}});notify('Subiendo '+file.name+' · '+Math.min(100,Math.round((offset+chunk.byteLength)/file.size*100))+'%')}
 await photoApi('/uploads/'+upload.id+'/complete',{method:'POST'});accepted=true;
 for(let attempt=0;attempt<120;attempt++){const status=await photoApi('/uploads/'+upload.id);if(status.state==='ready')return;if(status.completion_error)throw new Error(status.completion_error);await new Promise(resolve=>setTimeout(resolve,500))}
 throw new Error('El servidor sigue procesando '+file.name+'. Actualiza la biblioteca para comprobar el resultado.');
 }catch(error){if(!accepted)await photoApi('/uploads/'+upload.id,{method:'DELETE'}).catch(()=>{});throw error}
}
async function importFiles(files){if(photoBusy||!photoSpace)return;photoBusy=true;let added=0;try{for(const file of files){if(!/^image\/(jpeg|png|webp|gif|avif)$/.test(file.type)||!file.size||file.size>30*1024*1024){notify(file.name+': admite JPEG, PNG, WebP, GIF o AVIF de hasta 30 MiB.');continue}await uploadPhoto(file);added++}if(added)notify(added+' '+(added===1?'foto guardada':'fotos guardadas')+' en el servidor.')}catch(error){showPhotoError(error)}finally{photoBusy=false;$('file-input').value='';await loadLibrary().catch(showPhotoError)}}
async function createAlbum(){if(!photoSpace)return notify('Espera a que se conecte la biblioteca.');showInfo('Nuevo álbum','<form id="album-form"><label>Nombre<input id="album-name" required maxlength="255" autocomplete="off"></label><button class="button primary">Crear álbum</button></form>');$('album-form').addEventListener('submit',async event=>{event.preventDefault();const button=event.target.querySelector('button');button.disabled=true;try{await photoApi('/spaces/'+photoSpace+'/nodes',{method:'POST',body:{name:$('album-name').value,parent_id:null}});await closeDialog($('info-dialog'));await loadLibrary()}catch(error){showPhotoError(error)}finally{button.disabled=false}})}
function renderSettings(){const theme=window.SantolvShell.preference();$('library').innerHTML='<div class="page-content settings">'+pageHeading('Ajustes','Tu fototeca, a tu manera.')+'<h2>Apariencia</h2><div class="group"><label class="setting-row">Tema<select id="theme-select" data-shell-theme-select><option value="system">Según el sistema</option><option value="light">Claro</option><option value="dark">Oscuro</option></select></label></div><h2>Biblioteca</h2><p>Conectada al servidor Santolv. Favoritos, álbumes, fotos y papelera se guardan en tu cuenta.</p><p>Las fechas corresponden a la subida. La búsqueda abarca las fotos cargadas; usa Cargar más para continuar.</p><p>Esta versión muestra originales JPEG, PNG, WebP, GIF y AVIF de hasta 30 MiB. Las miniaturas derivadas, EXIF y vídeo quedan pendientes.</p></div>';$('theme-select').value=theme;$('theme-select').addEventListener('change',event=>setTheme(event.target.value))}
$('load-more').addEventListener('click',async()=>{const button=$('load-more');button.disabled=true;try{await loadLibrary(true)}catch(error){showPhotoError(error)}finally{button.disabled=false}});
window.addEventListener('pagehide',clearMedia);
window.addEventListener('pageshow',()=>beginPhotos());

new ResizeObserver(layoutPhotoGrid).observe($('content'));
restoreThumbnailSize();
route();

</script>
</body>
