.recent{margin-top:36.38px}.section-heading{display:flex;align-items:center;justify-content:space-between;gap:21.4px;margin-bottom:12.84px}.section-heading h2{font-size:16.05px;font-weight:600;margin:0;letter-spacing:-.2.14px}.section-heading span{font-size:11.77px;color:#909098}.table-wrap{border:1.07px solid var(--line);border-radius:13.91px;background:#fff;overflow:hidden}table{width:100%;border-collapse:collapse;table-layout:fixed;text-align:left}th{font-weight:400;font-size:11.77px;color:var(--muted);padding:11.77px 17.12px;border-bottom:1.07px solid #ededf0}th:first-child{width:62%}th:nth-child(2){width:15%}td{font-size:12.84px;height:54.57px;border-bottom:1.07px solid #ededf0;padding:0 17.12px}tr:last-child td{border-bottom:0}.recent-row:hover{background:#f9f9fc}.recent-item{display:flex;align-items:center;gap:11.77px;min-height:53.5px}.recent-item span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file-symbol{display:flex;align-items:center;justify-content:center;width:28.89px;height:31.03px;border-radius:6.42px;flex-shrink:0}.file-symbol svg{width:20.33px;height:20.33px;fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}.photo-symbol{background:#fbedf2;color:#e45e8b}.drive-symbol{background:#eaf3ff;color:#278aef}.file-symbol svg{stroke:currentColor}.app-cell,.date-cell{color:var(--muted);font-size:11.77px}.recent-status:not(:empty){padding:19.26px 0 12.84px;font-size:12.84px}#status:empty{display:none}#status:not(:empty){margin:17.12px 0}form{max-width:385.2px;display:grid;gap:19.26px;background:#fff;border:1.07px solid var(--line);border-radius:17.12px;padding:27.82px;margin-bottom:25.68px;box-shadow:0 2.14px 5.35px #20203005}label{display:grid;gap:7.49px;font-size:12.84px;font-weight:500}form input{width:100%;padding:10.7px 12.84px;border:1.07px solid #d8d8df;border-radius:8.56px;background:#fff;color:inherit;font-size:17.12px}form button{border:0;background:var(--blue);color:#fff;border-radius:8.56px;padding:11.77px;font-size:13.91px;font-weight:600}form button:hover{background:#0065d2}
@media(min-width:1440px){main{padding-top:51.36px}}@media(max-width:900px){.services{grid-template-columns:repeat(3,minmax(0,1fr))}.toolbar{padding:0 25.68px}.account-name{display:none}main{padding:34.24px 25.68px}}@media(max-width:650px){.toolbar{height:62.06px;padding:0 19.26px;gap:12.84px}.toolbar-start{gap:12.84px}.toolbar-end{gap:10.7px}.brand span,.toolbar-divider{display:none}.search{width:181.9px}.services{grid-template-columns:repeat(2,minmax(0,1fr));gap:12.84px}.service{min-height:169.06px;padding:19.26px}.app-icon{margin-bottom:17.12px}main{padding:29.96px 19.26px 48.15px}h1{font-size:25.68px}.section-heading span{display:none}th:first-child{width:57%}th:nth-child(2){width:16%}th,td{padding-left:11.77px;padding-right:11.77px}.file-symbol{display:none}.date-cell{font-size:10.7px}.recent{margin-top:29.96px}}@media(max-width:390px){.toolbar-title{display:none}.search{width:162.64px}th:first-child{width:53%}th:nth-child(2){width:18%}.service{padding:17.12px}.service-description{font-size:10.7px}}
:root[data-theme="dark"]{color-scheme:dark;color:#eeeef4;background:#19191d;--muted:#aaaab7;--line:#38383f;--blue:#65aaff}
:root[data-theme="dark"] .toolbar{background:#222227e8}:root[data-theme="dark"] .service,:root[data-theme="dark"] .table-wrap,:root[data-theme="dark"] form,:root[data-theme="dark"] form input,:root[data-theme="dark"] .logout{background:#25252b;border-color:var(--line);color:#eeeef4}
:root[data-theme="dark"] .service:hover{border-color:#657b9e}:root[data-theme="dark"] .search{background:#303037}:root[data-theme="dark"] .search:focus-within{background:#25252b}:root[data-theme="dark"] .account-name,:root[data-theme="dark"] .logout svg{color:#bbbbc7;stroke:currentColor}:root[data-theme="dark"] td,:root[data-theme="dark"] th{border-color:var(--line)}:root[data-theme="dark"] .recent-row:hover,:root[data-theme="dark"] .logout:hover{background:#303039}:root[data-theme="dark"] .photo-symbol{background:#492b3c;color:#ff9cc5}:root[data-theme="dark"] .drive-symbol{background:#233c5b;color:#8bc1ff}
@media(max-width:650px){.toolbar-end{gap:8.56px}.search{width:136.96px}}@media(max-width:390px){.search{width:121.98px}}

</style></head><body>
<a class="skip" href="#main">Saltar al contenido</a>
<!-- SANTOLV_SHELL -->
<main id="main" tabindex="-1"><div class="home-tools"><label id="search-wrap" class="search" hidden><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4 4"/></svg><input id="home-search" type="search" placeholder="Buscar" aria-label="Buscar apps y recientes" autocomplete="off"></label></div><div class="welcome"><h1 id="greeting">Tu espacio, en un solo lugar.</h1><p id="intro">Una cuenta para tus servicios.</p></div>

<p id="status" role="status" aria-live="polite"></p>
<div id="services" class="services" aria-label="Servicios" hidden>
<a class="service" href="/photos/"><span class="app-icon photos-icon" aria-hidden="true"><svg viewBox="0 0 48 48" aria-hidden="true"><g transform="translate(24 24)"><ellipse cx="0" cy="-10" rx="5.5" ry="10" fill="#f86472" fill-opacity=".9" transform="rotate(0)"/><ellipse cx="0" cy="-10" rx="5.5" ry="10" fill="#ff9656" fill-opacity=".9" transform="rotate(45)"/><ellipse cx="0" cy="-10" rx="5.5" ry="10" fill="#ffc94e" fill-opacity=".9" transform="rotate(90)"/><ellipse cx="0" cy="-10" rx="5.5" ry="10" fill="#a5d958" fill-opacity=".9" transform="rotate(135)"/><ellipse cx="0" cy="-10" rx="5.5" ry="10" fill="#4bcc8c" fill-opacity=".9" transform="rotate(180)"/><ellipse cx="0" cy="-10" rx="5.5" ry="10" fill="#4bb9f5" fill-opacity=".9" transform="rotate(225)"/><ellipse cx="0" cy="-10" rx="5.5" ry="10" fill="#7187f5" fill-opacity=".9" transform="rotate(270)"/><ellipse cx="0" cy="-10" rx="5.5" ry="10" fill="#c86be7" fill-opacity=".9" transform="rotate(315)"/></g></svg></span><strong>Fotos</strong><span class="service-description">Tu biblioteca de fotos</span></a>
<a class="service" href="/drive/"><span class="app-icon drive-icon" aria-hidden="true"><svg viewBox="0 0 36 36"><path d="M10.5 27a7 7 0 0 1-1.2-13.9 9 9 0 0 1 17-2.2A8.1 8.1 0 0 1 26 27z"/></svg></span><strong>Drive</strong><span class="service-description">Archivos y carpetas</span></a>
</div>
<section id="recent" class="recent" hidden><div class="section-heading"><h2>Lo último trabajado</h2><span>En todos tus servicios</span></div><div class="table-wrap"><table aria-label="Actividad reciente"><thead><tr><th scope="col">Nombre</th><th scope="col">App</th><th scope="col">Última actividad</th></tr></thead><tbody id="recent-list"></tbody></table></div><p id="recent-status" class="recent-status" role="status"></p></section>
</main><script>
'use strict';
const API_ORIGIN=location.protocol==='https:'?location.origin:'http://localhost:8443';
const $=id=>document.getElementById(id);let csrf='',enterRevision=0;
async function api(path,method='GET',body){const headers={};if(body!==undefined)headers['Content-Type']='application/json';if(csrf&&method!=='GET')headers['X-CSRF-Token']=csrf;const r=await fetch(API_ORIGIN+'/api/v1'+path,{method,headers,credentials:'include',body:body===undefined?undefined:JSON.stringify(body)});const data=r.status===204?null:await r.json();if(r.status===401)signedOut();if(!r.ok)throw new Error(data?.error?.code||'No se pudo completar la operación.');return data}
function signedOut(){enterRevision++;csrf='';$('recent').hidden=true;$('recent-list').replaceChildren();document.body.hidden=true;location.replace('/')}
async function enter(){const request=++enterRevision;const me=await api('/me');if(request!==enterRevision)return;if(me.must_change_password){signedOut();return}csrf=me.csrf_token||'';window.SantolvShell?.session(me.expires_at);window.SantolvShell?.account(me,{switch:endSession,logout:endSession});$('greeting').textContent=new Date().getHours()<13?'Buenos días':new Date().getHours()<20?'Buenas tardes':'Buenas noches';$('services').hidden=false;$('search-wrap').hidden=false;$('intro').textContent='Elige una app para empezar.';$('recent').hidden=false;await loadRecent(request)}
async function loadRecent(request){
 $('recent-status').textContent='Cargando actividad…';$('recent-list').replaceChildren();
 try{const data=await api('/activity/recent');if(request!==enterRevision)return;const items=data.items.slice(0,8);$('recent-status').textContent=items.length?'':'Aquí aparecerán los archivos y fotos que utilices.';
 for(const item of items){const row=document.createElement('tr'),cell=document.createElement('td'),link=document.createElement('a'),name=document.createElement('span'),app=document.createElement('td'),modified=document.createElement('td'),symbol=document.createElement('span');
 const photos=item.service==='photos';row.className='recent-row';link.className='recent-item';link.href=photos?'/photos/?'+(item.kind==='folder'?'album':'photo')+'='+encodeURIComponent(item.id):'/drive/?node='+encodeURIComponent(item.id);
 symbol.className='file-symbol '+(photos?'photo-symbol':'drive-symbol');symbol.setAttribute('aria-hidden','true');symbol.innerHTML=item.kind==='folder'?'<svg viewBox="0 0 20 20"><path d="M2.5 5.5h5l2-2h4.8a2 2 0 0 1 2 2V15a2 2 0 0 1-2 2H4.5a2 2 0 0 1-2-2z"/></svg>':'<svg viewBox="0 0 20 20"><rect x="3" y="3" width="14" height="14" rx="3"/><path d="m4 14 4-4 3 3 2-2 3 3M7 7h.01"/></svg>';
 name.textContent=item.name;link.append(symbol,name);cell.append(link);app.textContent=photos?'Fotos':'Drive';app.className='app-cell';modified.className='date-cell';modified.textContent=new Date(Number(item.last_used_at)/1000).toLocaleString('es-ES',{dateStyle:'short',timeStyle:'short'});row.append(cell,app,modified);$('recent-list').append(row)}
 filterHome();
 }catch(error){if(request===enterRevision)$('recent-status').textContent='No se pudo cargar la actividad reciente.'}
}
async function endSession(){await api('/auth/logout','POST');window.SantolvShell?.sessionEnded();signedOut()}
function filterHome(){const query=$('home-search').value.trim().toLocaleLowerCase('es');for(const item of document.querySelectorAll('.service:not([inert]),.recent-row'))item.hidden=!item.textContent.toLocaleLowerCase('es').includes(query)}
$('home-search').addEventListener('input',filterHome);
window.addEventListener('pageshow',()=>enter().catch(error=>{$('status').textContent='No se pudo cargar Inicio. '+error.message}));
</script></body></html>
