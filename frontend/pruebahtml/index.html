<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="light dark"><meta name="referrer" content="no-referrer"><title>Drive</title><style>
:root{
  box-sizing:border-box;
  --bg:#fff;--side:#f5f5f7;--card:#f5f5f7;--text:#000;--sub:#86868b;--line:rgba(0,0,0,.1);
  --fill:rgba(118,118,128,.12);--ink:#000;--on-ink:#fff;--glass:rgba(255,255,255,.72);--scrim:rgba(0,0,0,.32);
  --ease:cubic-bezier(.22,1,.36,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Inter,system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#000;--side:#111113;--card:#1c1c1e;--text:#fff;--sub:#98989f;--line:rgba(255,255,255,.14);--fill:rgba(118,118,128,.24);--ink:#fff;--on-ink:#000;--glass:rgba(28,28,30,.72);--scrim:rgba(0,0,0,.55)}
}
:root[data-theme="dark"]{--bg:#000;--side:#111113;--card:#1c1c1e;--text:#fff;--sub:#98989f;--line:rgba(255,255,255,.14);--fill:rgba(118,118,128,.24);--ink:#fff;--on-ink:#000;--glass:rgba(28,28,30,.72);--scrim:rgba(0,0,0,.55)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;line-height:1.4}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.glass{background:var(--glass);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px)}
.press{transition:transform .18s var(--ease)}
.press:active{transform:scale(.96);transition-duration:.08s}

.app{display:grid;grid-template-columns:240px 1fr;grid-template-rows:60px 1fr;height:100%}
.top{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 20px;border-bottom:.5px solid var(--line);z-index:5}
.logo{width:240px;margin-left:-20px;padding-left:20px;font-weight:700;font-size:19px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.logo i{width:26px;height:26px;border-radius:7px;background:var(--ink);display:grid;place-items:center}
.logo i svg{width:15px;height:15px;stroke:var(--on-ink);stroke-width:2}
.search{flex:1;max-width:620px;display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:10px;padding:8px 12px}
.search svg{width:16px;height:16px;color:var(--sub)}
.search input{flex:1;border:0;background:none;font:inherit;font-size:16px;color:var(--text);outline:0;min-width:0}
.search input::placeholder{color:var(--sub)}
.avatar{margin-left:auto;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-weight:600;font-size:14px}
.side{background:var(--side);padding:16px 12px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.new{display:flex;align-items:center;gap:8px;align-self:flex-start;background:var(--ink);color:var(--on-ink);border-radius:999px;padding:11px 20px 11px 16px;font-size:15px;font-weight:600;margin:4px 0 14px}
.new svg{stroke:var(--on-ink);stroke-width:2.2;width:18px;height:18px}
.nav{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;font-size:15px;text-align:left;width:100%}
.nav[aria-current="page"]{background:var(--fill);font-weight:600}
.storage{margin-top:auto;padding:14px 12px 4px;font-size:12px;letter-spacing:.01em;color:var(--sub)}
.bar{height:5px;border-radius:3px;background:var(--fill);margin-bottom:8px;overflow:hidden}
.bar i{display:block;height:100%;width:62%;background:var(--ink);border-radius:3px}
main{overflow:auto;padding:20px 28px 120px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px}
.seg button{font-size:13px;font-weight:500;padding:5px 14px;border-radius:7px;transition:background .2s var(--ease),box-shadow .2s var(--ease)}
.seg button[aria-pressed="true"]{background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.05)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#636366}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:#636366}}
h2{font-size:15px;font-weight:600;color:var(--sub);margin:22px 0 10px}
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.folder{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:12px;padding:13px 14px;text-align:left;font-size:15px;font-weight:500}
.folder svg{fill:currentColor;stroke:none;width:22px;height:22px}
.files.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.card{background:var(--card);border-radius:14px;overflow:hidden;cursor:pointer;position:relative;box-shadow:inset 0 0 0 2px transparent;transition:transform .18s var(--ease),box-shadow .2s var(--ease)}
.card:active{transform:scale(.97);transition-duration:.08s}
.card.on{box-shadow:inset 0 0 0 2px var(--ink)}
.thumb{height:120px;margin:10px 10px 0;border-radius:8px;background:var(--bg);padding:14px;display:flex;flex-direction:column;gap:7px}
.thumb s{display:block;height:5px;border-radius:3px;background:var(--fill)}
.thumb s:first-child{width:55%;background:var(--sub);opacity:.5}
.thumb s:nth-child(4){width:80%}.thumb s:last-child{width:40%}
.cap{padding:10px 12px 12px;display:flex;gap:8px;align-items:center}
.cap b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.cap>div{flex:1;min-width:0}
.tag{font-size:10px;font-weight:700;letter-spacing:.02em;border:1px solid var(--line);color:var(--sub);border-radius:5px;padding:2px 5px;flex:none}
.col{display:none;font-size:13px;color:var(--sub)}
.chk{position:absolute;top:8px;left:8px;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--sub);background:var(--glass);display:grid;place-items:center;opacity:0;transition:opacity .15s,background .15s}
.chk svg{width:13px;height:13px;stroke:var(--on-ink);stroke-width:3;opacity:0}
.card:hover .chk,.card:focus-visible .chk,body.sel .chk{opacity:1}
@media (hover:none){.chk{opacity:1}}
.card.on .chk{background:var(--ink);border-color:var(--ink);opacity:1}
.card.on .chk svg{opacity:1}
.files.list{background:var(--card);border-radius:14px;overflow:hidden}
.files.list .card{display:grid;grid-template-columns:24px 1fr 110px 80px 44px;align-items:center;gap:14px;border-radius:0;padding:11px 16px;background:none}
.files.list .card+.card{border-top:.5px solid var(--line)}
.files.list .card.on{background:var(--fill);box-shadow:none}
.files.list .thumb{display:none}
.files.list .cap{display:contents}
.files.list .chk{position:static;opacity:1}
.files.list .col{display:block}
.empty{display:none;text-align:center;color:var(--sub);padding:50px 0}
/* selección, toast, sheet */
.selbar{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);display:flex;align-items:center;gap:4px;padding:6px 6px 6px 18px;border-radius:999px;border:.5px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:20;transition:transform .45s var(--ease);white-space:nowrap}
.selbar.show{transform:translate(-50%,0)}
.selbar span{font-size:14px;font-weight:600;margin-right:8px}
.selbar button{font-size:14px;font-weight:500;padding:8px 14px;border-radius:999px;background:var(--fill)}
.selbar .go{background:var(--ink);color:var(--on-ink)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--on-ink);border-radius:14px;padding:12px 16px;font-size:14px;display:flex;gap:16px;z-index:40;transition:transform .4s var(--ease),opacity .25s}
.toast.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.toast button{font-weight:700;text-decoration:underline}
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;visibility:hidden;z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;border-radius:22px 22px 0 0;border:.5px solid var(--line);border-bottom:0;box-shadow:0 -10px 40px rgba(0,0,0,.18);padding:0 20px calc(20px + env(safe-area-inset-bottom,0px));z-index:31;visibility:hidden;will-change:transform}
.grab{touch-action:none;cursor:grab;padding:8px 0 4px}
.grab:active{cursor:grabbing}
.pill{width:38px;height:5px;border-radius:3px;background:var(--sub);opacity:.5;margin:0 auto 14px}
.sheet h3{font-size:22px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.sheet p{font-size:13px;color:var(--sub);letter-spacing:.01em;margin:2px 0 14px}
.sheet .thumb{height:150px;margin:0 0 16px;background:var(--card)}
.sheet .thumb s{background:var(--fill)}
.group{background:var(--card);border-radius:14px;overflow:hidden;margin-bottom:12px}
.group>*{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px 16px;font-size:15px;text-align:left}
.group>*+*{border-top:.5px solid var(--line)}
.group span{color:var(--sub)}
.group button:active{background:var(--fill)}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:60px auto 1fr}
  .logo{display:none}.top{grid-column:1}
  .side{flex-direction:row;overflow-x:auto;padding:10px 16px;gap:6px;align-items:center}
  .new{margin:0 6px 0 0;padding:9px 16px 9px 12px;white-space:nowrap}
  .nav{width:auto;white-space:nowrap;padding:8px 14px;background:var(--fill);font-size:14px}
  .nav svg,.storage{display:none}
  .nav[aria-current="page"]{background:var(--ink);color:var(--on-ink)}
  main{padding:8px 16px 120px}
  .files.list .card{grid-template-columns:24px 1fr 44px}
  .files.list .col{display:none}
}
@media (prefers-reduced-transparency:reduce){
  .glass,.chk{background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none}
}
@media (prefers-contrast:more){
  .card,.folder,.group{outline:1px solid var(--ink)}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important}
  .selbar,.toast{transition:opacity .2s!important}
}
/* ===== color + botones estilo iOS ===== */
:root{--blue:#007aff;--green:#34c759;--red:#ff3b30;--orange:#ff9500;--ink:#007aff;--on-ink:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--blue:#0a84ff;--green:#30d158;--red:#ff453a;--orange:#ff9f0a;--ink:#0a84ff;--on-ink:#fff}}
:root[data-theme="dark"]{--blue:#0a84ff;--green:#30d158;--red:#ff453a;--orange:#ff9f0a;--ink:#0a84ff;--on-ink:#fff}
[data-t="XLS"]{--c:var(--green)}[data-t="PDF"]{--c:var(--red)}[data-t="DOC"]{--c:var(--blue)}[data-t="PPT"]{--c:var(--orange)}
.nav[data-t="Mi unidad"]{--c:var(--blue)}.nav[data-t="Compartidos conmigo"]{--c:var(--green)}.nav[data-t="Recientes"]{--c:var(--orange)}.nav[data-t="Destacados"]{--c:#ffcc00}.nav[data-t="Papelera"]{--c:var(--red)}
.avatar{background:linear-gradient(135deg,#5ac8fa,var(--blue))}
.new{font-size:16px;padding:12px 22px 12px 16px;box-shadow:0 4px 14px color-mix(in srgb,var(--blue) 40%,transparent)}
.nav svg{width:28px;height:28px;padding:5px;border-radius:8px;background:var(--c);color:#fff;stroke-width:2}
@media (min-width:821px){.nav[aria-current="page"]{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue)}}
.folder svg{color:var(--blue);width:26px;height:26px}
.tag{background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);border-color:transparent}
.thumb s:first-child{background:var(--c);opacity:1}
.files.list .card.on{background:color-mix(in srgb,var(--blue) 12%,transparent)}
.selbar button{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue);font-weight:600}
.selbar .go{background:var(--red);color:#fff}
.selbar #aCancel{background:none}
.toast{background:#2c2c2e;color:#fff}
.toast button{color:#64d2ff;text-decoration:none}
.group button{color:var(--blue);font-weight:500}
.group #sDel{color:var(--red)}
.group button::after{content:"";width:7px;height:7px;border-top:2px solid var(--sub);border-right:2px solid var(--sub);transform:rotate(45deg);opacity:.5}
.group #sDel::after{display:none}
/* ===== sistema de color: azul = lo interactivo, rojo = destructivo, el resto neutro ===== */
.card[data-t],.sheet[data-t]{--c:var(--sub)}
.tag{background:var(--fill);color:var(--sub)}
.thumb s:first-child{background:var(--sub);opacity:.5}
.avatar{margin-left:0;background:var(--fill);color:var(--text)}
.nav svg{width:20px;height:20px;padding:0;border-radius:0;background:none;color:var(--blue);stroke-width:1.7}
/* botón de la barra: círculo de cristal con símbolo, abre un menú contextual */
.plus{margin-left:auto;width:36px;height:36px;border-radius:50%;background:var(--fill);color:var(--blue);display:grid;place-items:center;flex:none}
.plus svg{stroke-width:2.2}
.plus[aria-expanded="true"]{background:var(--blue);color:#fff}
.menu{position:fixed;top:58px;right:20px;min-width:250px;border-radius:14px;padding:6px;border:.5px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.22);z-index:50;transform-origin:top right;transform:scale(.88);opacity:0;visibility:hidden;transition:transform .35s var(--ease),opacity .2s,visibility 0s .35s}
.menu.show{transform:scale(1);opacity:1;visibility:visible;transition:transform .35s var(--ease),opacity .2s}
.menu button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:11px 12px;border-radius:9px;font-size:16px;text-align:left}
.menu button:active{background:var(--fill)}
.menu hr{border:0;height:.5px;background:var(--line);margin:4px 8px}
/* tipos de botón: relleno, tintado, simple, de icono */
.btnrow{display:flex;gap:10px;margin:2px 0 16px}
.btn{flex:1;height:50px;border-radius:14px;font-size:17px;font-weight:600;letter-spacing:-.01em;transition:transform .18s var(--ease),opacity .15s}
.btn:active{transform:scale(.97);opacity:.85}
.btn.fill{background:var(--blue);color:#fff}
.btn.tint{background:color-mix(in srgb,var(--blue) 15%,transparent);color:var(--blue)}
.selbar{padding:6px 8px 6px 18px;gap:2px}
.selbar .ib{width:44px;height:44px;padding:0;border-radius:50%;background:none;color:var(--blue);display:grid;place-items:center}
.selbar .ib:active{background:var(--fill)}
.selbar .ib.red{color:var(--red)}
.selbar .plain{background:none;color:var(--blue);font-weight:600;padding:8px 12px;margin-left:4px}
.group .center{justify-content:center}
@media (max-width:820px){.menu{right:16px}}
/* ===== color con criterio: cada color significa siempre lo mismo ===== */
.card[data-t="XLS"],.sheet[data-t="XLS"]{--c:var(--green)}
.card[data-t="PDF"],.sheet[data-t="PDF"]{--c:var(--red)}
.card[data-t="DOC"],.sheet[data-t="DOC"]{--c:var(--blue)}
.card[data-t="PPT"],.sheet[data-t="PPT"]{--c:var(--orange)}
.tag{background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.thumb s:first-child{background:var(--c);opacity:1}
.nav svg{width:28px;height:28px;padding:5px;border-radius:8px;background:var(--c);color:#fff;stroke-width:2}
.avatar{margin-left:auto;background:linear-gradient(135deg,#5ac8fa,var(--blue));color:#fff}
.menu{transform-origin:top left;right:auto;bottom:auto;width:250px;min-width:0;max-width:calc(100vw - 24px);max-height:calc(100dvh - 24px);overflow-y:auto;height:auto}.menu .destructive{color:var(--red)}
.new{height:44px;padding:0 20px 0 16px;font-size:16px}

function closeMenus(){for(const id of ['new-menu','node-menu'])$(id).classList.remove('show');$('newBtn').setAttribute('aria-expanded','false')}
function nodeMenu(event,node){const n=state.rows.find(n=>n.id===node.dataset.node);if(!n)return;event.preventDefault();closeMenus();state.selected=n;state.selection=n.id;selectionBar();const menu=$('node-menu');const options=n.trashed_at?[['restore','Restaurar'],['purge','Eliminar definitivamente']]:[['inspect',n.kind==='folder'?'Abrir carpeta':'Ver archivo'],['rename','Cambiar nombre'],['move','Mover'],['share','Compartir'],['trash','Mover a la papelera']];menu.innerHTML=options.map(([action,label])=>`<button role="menuitem" data-action="${action}"${['trash','purge'].includes(action)?' class="destructive"':''}>${label}</button>`).join('');menu.classList.add('show');const rect=node.getBoundingClientRect();menu.style.left=Math.max(12,Math.min(event.clientX??rect.left,innerWidth-menu.offsetWidth-12))+'px';menu.style.top=Math.max(12,Math.min(event.clientY??rect.bottom,innerHeight-menu.offsetHeight-12))+'px';menu.querySelector('button')?.focus()}
actions.inspect=()=>state.selected?.kind==='folder'?openFolder(state.selected):detail();
document.addEventListener('contextmenu',event=>{const node=event.target.closest('[data-node]');if(node)nodeMenu(event,node)});
document.addEventListener('keydown',event=>{if(event.key==='ContextMenu'||(event.shiftKey&&event.key==='F10')){const node=event.target.closest('[data-node]');if(node)nodeMenu(event,node)}if(event.key==='Escape')closeMenus();if(['ArrowDown','ArrowUp','Home','End'].includes(event.key)&&event.target.closest('[role="menu"]')){event.preventDefault();const buttons=[...event.target.closest('[role="menu"]').querySelectorAll('button:not(:disabled)')];let i=buttons.indexOf(event.target);i=event.key==='Home'?0:event.key==='End'?buttons.length-1:(i+(event.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length;buttons[i]?.focus()}});
document.addEventListener('pointerdown',event=>{if(!event.target.closest('[role="menu"]')&&!event.target.closest('#newBtn'))closeMenus()});
window.addEventListener('resize',closeMenus);
document.addEventListener('scroll',closeMenus,true);
document.addEventListener('click',async event=>{const download=event.target.closest('a[download]');if(LOCAL_FILE&&download){event.preventDefault();try{await downloadFile(download.href)}catch(error){toast(message(error))}return}const action=event.target.closest('[data-action]');if(action){if(action.disabled)return;$('node-menu').classList.remove('show');if(action.dataset.action!=='new-menu'){$('new-menu').classList.remove('show');$('newBtn').setAttribute('aria-expanded','false')}if($('detail').open)$('detail').close();try{await actions[action.dataset.action]?.(action)}catch(error){toast(message(error))}return}const nav=event.target.closest('[data-nav]');if(nav&&state.me){if(nav.disabled)return;state.view=nav.dataset.nav;if(state.view==='files')state.space=state.spaces.find(s=>s.kind==='personal')?.id||state.space;state.parent=null;state.crumbs=[];$('search').value='';$('sidebar').classList.remove('open');await load();return}const space=event.target.closest('[data-space]');if(space){state.space=space.dataset.space;state.parent=null;state.crumbs=[];state.view='files';$('search').value='';$('sidebar').classList.remove('open');await load();return}const crumb=event.target.closest('[data-crumb]');if(crumb){const i=Number(crumb.dataset.crumb);state.parent=i<0?null:state.crumbs[i].id;state.crumbs=state.crumbs.slice(0,i+1);await load();return}const node=event.target.closest('[data-node]');if(node){const selected=state.rows.find(n=>n.id===node.dataset.node);if(!selected)return;state.selected=selected;if(event.target.closest('.folder')&&!selected.trashed_at){openFolder(selected);return}if(event.target.closest('.chk')){state.selection=state.selection===selected.id?null:selected.id;render();return}state.selection=null;render();detail();return}});

async function moveDialog(){
 const n={...state.selected},space=n.space_id||state.space;let parent=null,trail=[],cursor=null,folders=[];const title='Mover «'+n.name+'»';
 async function draw(append=false){const {data}=await api(`/spaces/${space}/nodes?${parent?'parent='+encodeURIComponent(parent)+'&':''}${append&&cursor?'after='+encodeURIComponent(cursor):''}`);cursor=data.next_cursor;folders=(append?folders:[]).concat(data.items.filter(f=>f.kind==='folder'&&f.id!==n.id));
 form(title,`<p>Destino: <strong>${esc(trail.length?trail.map(f=>f.name).join(' / '):'Mi unidad')}</strong></p><div class="stack"><button type="button" class="button" id="move-up" ${trail.length?'':'disabled'}>Subir un nivel</button>${folders.map(f=>`<button type="button" class="button" data-destination="${f.id}">${icon('folder')}${esc(f.name)}</button>`).join('')}${cursor?'<button type="button" class="button" id="move-more">Cargar más</button>':''}</div>`,'Mover aquí',async()=>{await mutate('/nodes/'+n.id,'PATCH',parent?{parent_id:parent}:{move_to_root:true},n);$('dialog').close();await load();toast('Elemento movido.')});
 $('move-up').addEventListener('click',()=>{trail.pop();parent=trail.at(-1)?.id||null;draw().catch(e=>toast(message(e)))});
 $('dialog-body').querySelectorAll('[data-destination]').forEach(b=>b.addEventListener('click',()=>{const f=folders.find(f=>f.id===b.dataset.destination);trail.push(f);parent=f.id;draw().catch(e=>toast(message(e)))}));
 if(cursor)$('move-more').addEventListener('click',()=>draw(true).catch(e=>toast(message(e))));
 }await draw();
}
async function downloadFile(url){
 if(!state.token)throw new Error('Inicia sesión para descargar.');
 if(!url.startsWith(API_ORIGIN+'/api/v1/nodes/'))throw new Error('Dirección de descarga no válida.');
 const response=await fetch(url,{credentials:'omit',headers:{Authorization:'Bearer '+state.token}});
 if(!response.ok)throw new Error('No se pudo descargar el archivo.');
 // shortcut: the standalone demo buffers downloads up to 64 MiB; add streamed saving for larger files.
 const limit=64*1024*1024,reader=response.body.getReader(),chunks=[];let size=0;
 try{while(true){const {done,value}=await reader.read();if(done)break;size+=value.byteLength;if(size>limit)throw new Error('Esta prueba admite descargas de hasta 64 MiB.');chunks.push(value)}}catch(error){await reader.cancel();throw error}
 const objectURL=URL.createObjectURL(new Blob(chunks)),link=document.createElement('a');
 link.href=objectURL;link.download=state.selected?.name||'archivo';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(objectURL),60000);
}
async function connectAPI(){
 $('login-submit').disabled=true;$('login-error').textContent='';$('api-status').textContent='Conectando…';$('api-dot').style.background='#9aa48e';
 let connected=false;
 try{
  const health=await fetch(apiUrl('/health/live'),{credentials,cache:'no-store',signal:AbortSignal.timeout(4000)});
  if(!health.ok)throw new Error('La API no está disponible.');
  connected=true;$('api-status').textContent='API conectada';$('api-dot').style.background='#388d6b';$('connection-help').textContent='Conectado al servidor local. Utiliza la cuenta que creó el administrador.';
  try{await enter();if(state.me&&!state.csrf&&!state.token){signedOut();toast('Entra de nuevo para habilitar las operaciones de esta pestaña.')}}catch(error){if(error.status!==401)throw error}
 }catch(error){$('api-status').textContent='Sin conexión';$('api-dot').style.background='#ad3d3d';$('login-error').textContent=connected?message(error):'No se puede conectar con la API en localhost:8443. Arranca el backend y vuelve a pulsar Entrar.';$('connection-help').innerHTML='<button type="button" class="button" data-action="connect">Reintentar conexión</button>';}
 finally{$('login-submit').disabled=false}
}
